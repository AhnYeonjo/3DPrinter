#####################################################################
#  Voron 2.4 350mm AWD - BTT Kraken + 6-Tool StealthChanger
#  Hybrid Mode: BoxTurtle Optional Filament Loading System
#  Fly SHT36 V3 x5 (CAN bus via Fly UTOC-3)
#  Micro Camera on Shuttle
#  Z max physical endstop (top of chamber, tool-independent Z homing)
#  48V HV for all motors / 24V for logic & heaters
#
#  * BoxTurtle is always included, with each lane operating independently:
#    - "bt" mode: BoxTurtle feeder + G2SA dual drive
#    - "direct" mode: Direct feed (G2SA only)
#    - Auto-detection: Mode automatically determined by sensor state
#####################################################################

#####################################################################
#  Includes - StealthChanger (klipper-toolchanger-easy)
#####################################################################
#  Installation:
#    cd ~/ && git clone https://github.com/jwellman80/klipper-toolchanger-easy.git
#    cd ~/klipper-toolchanger-easy && ./install.sh
#    -> Select Option 1 (Tap on each tool)
#
#  Directory structure after installation:
#    ~/printer_data/config/toolchanger/
#    ├── readonly-configs/    <- Do not modify (symlinks)
#    │   ├── homing.cfg
#    │   ├── tool_detection.cfg
#    │   ├── toolchanger.cfg
#    │   ├── toolchanger-macros.cfg
#    │   ├── calibrate-offsets.cfg
#    │   ├── crash-detection.cfg
#    │   └── toolchanger-include.cfg
#    ├── tools/               <- Per-toolhead configs (T0.cfg ~ T5.cfg)
#    └── toolchanger-config.cfg  <- User overrides (dock paths, etc.)
#
[duplicate_pin_override]
pins: SHT0:gpio20,SHT1:gpio20,SHT2:gpio20,SHT3:gpio20,SHT4:gpio20

[include toolchanger-include.cfg]
[include toolchanger/tool_detection.cfg]
#[include toolchanger/readonly-configs/crash-detection.cfg]

# BoxTurtle optional filament loading system (always included)
# Each lane automatically detects bt/direct/empty mode
#[include boxturtle.cfg]

[include macros.cfg]

# moonraker-timelapse macros (TIMELAPSE_TAKE_FRAME, TIMELAPSE_NEW_FRAME, etc.)
# Symlink after installation: ~/moonraker-timelapse/klipper_macro/timelapse.cfg
[include timelapse.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes

[save_variables]
filename: ~/printer_data/config/bt_saved_state.cfg

[pause_resume]

[display_status]

[exclude_object]

[respond]

[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 0.5
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

# force_move is configured in toolchanger-config.cfg
# (enable_force_move: True)

#####################################################################
#  MCU Settings
#####################################################################

[mcu]
# BTT Kraken - USB / UART connection
# Verify with ls -l /dev/serial/by-id/ and update as needed
serial: /dev/ttyAMA0
restart_method: command

# CAN bus via Fly UTOC-3 is connected using canbus_uuid in each toolboard config
# Example: [mcu SHT0] canbus_uuid: XXXXXXXXXX (configured inside T0.cfg)

#####################################################################
#  Printer Settings
#####################################################################

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 50
max_z_accel: 800
square_corner_velocity: 8.0

#####################################################################
#  X/Y Stepper Settings - AWD (4 Motors)
#  aTinyShellScript v2.4_AWD model
#  Belt path is inverted compared to stock V2.4 (to maintain XY-joint compatibility)
#  * Mandatory: Verify all motor directions with STEPPER_BUZZ!
#####################################################################

# Kraken V1.1 pin mapping (verified against official manual + VoronDesign official config):
# SPI: MOSI=PC8, MISO=PC7, SCK=PC6
#
# Slot  Step   Dir    Enable  CS     Endstop  Rsense         Assignment
# S1:   PC14   PC13   !PE6    PD6    PC15     0.050ohm (V1.1)  stepper_x (sensorless)
# S2:   PE5    PE4    !PE3    PD5    PF0      0.050ohm (V1.1)  stepper_y (sensorless)
# S3:   PE2    PE1    !PE0    PD4    PF1      0.050ohm (V1.1)  stepper_y1 (endstop unused)
# S4:   PB9    PB8    !PB7    PD3    PF2      0.050ohm (V1.1)  stepper_x1 (endstop unused)
# S5:   PG9    PG10   !PG13   PD2    PF3      0.075ohm         stepper_z  (PF3=SexBolt)
# S6:   PG11   PD7    !PG12   PA15   PF4      0.075ohm         stepper_z1 (PF4=Z max endstop)
# S7:   PB4    PB3    !PB5    PA9    ---      0.075ohm         stepper_z2
# S8:   PG15   PB6    !PG14   PA10   ---      0.075ohm         stepper_z3

[stepper_x]
step_pin: PB9
dir_pin: !PB8
enable_pin: !PB7
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: tmc5160_stepper_x:virtual_endstop   # Sensorless homing
position_min: 0
position_endstop: 350
position_max: 350
homing_positive_dir: True     # Sensorless homing direction: max right (X+)
homing_speed: 60              # Increased sensorless homing speed
homing_retract_dist: 0        # Sensorless homing: no retract

[stepper_x1]
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400

[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400
endstop_pin: tmc5160_stepper_y:virtual_endstop   # Sensorless homing
position_min: -25
position_endstop: 350
position_max: 350
homing_positive_dir: True     # Sensorless homing direction: max rear (Y+)
homing_speed: 60              # Increased sensorless homing speed (maximizes back-EMF drop for immediate stall detection)
homing_retract_dist: 0        # Sensorless homing: no retract

[stepper_y1]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400

#####################################################################
#  TMC2160 / TMC5160 (SPI) - AB Motors (48V)
#####################################################################

# Kraken V1.1 Rsense values:
# S1-S4: 0.050 (V1.1) <- Board Kraken V1.1 (NOT V1.0)
# S5-S8: 0.075

[tmc5160 stepper_x]
cs_pin: PD3              # Kraken S4 SPI CS
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 1.0         # 42STH48-2004MAH (rated 2.0A), 1.0A shared across AWD 4 motors
sense_resistor: 0.050    # Kraken V1.1 S1-S4 (onboard TMC5160, Rsense 50mOhm)
stealthchop_threshold: 0
diag1_pin: ^!PF2         # Sensorless homing StallGuard S4
driver_SGT: 0            # Sensitivity tuning

[tmc5160 stepper_x1]
cs_pin: PD6              # Kraken S1 SPI CS
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 1.0         # 42STH48-2004MAH, AWD shared load
sense_resistor: 0.050    # Kraken V1.1 S1-S4 (TMC5160, Rsense 50mOhm)
stealthchop_threshold: 0

[tmc5160 stepper_y]
cs_pin: PD5              # Kraken S2 SPI CS
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 1.0         # 42STH48-2004MAH, AWD shared load
sense_resistor: 0.050    # Kraken V1.1 S1-S4 (TMC5160, Rsense 50mOhm)
stealthchop_threshold: 0
diag1_pin: ^!PF0         # Sensorless homing StallGuard S2
driver_SGT: 0            # Sensitivity tuning (adjusted to stabilize homing friction)

[tmc5160 stepper_y1]
cs_pin: PD4              # Kraken S3 SPI CS
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 1.0         # 42STH48-2004MAH, AWD shared load
sense_resistor: 0.050    # Kraken V1.1 S1-S4 (TMC5160, Rsense 50mOhm)
stealthchop_threshold: 0

#####################################################################
#  Z Stepper Settings (Belt Z - 4 Motors)
#####################################################################

## Z0 Motor (Front Left) - Kraken S5
## Motor: LDO-42STH48-2004AC
## * S5-S8 pins verified against official VoronDesign Kraken config

[smart_effector]
pin: ^PE9
x_offset: -12.0               # Klipper standard: negative (-) for left of nozzle
y_offset: 50.0                # Klipper standard: positive (+) for rear of nozzle
z_offset: 0.0                 # * Always 0. Datum is pure IR trigger (never enter 2.55 here)
speed: 3.0
lift_speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.15
samples_tolerance_retries: 3


# [filament_switch_sensor z_max]
# switch_pin: ^!PF4
# pause_on_runout: False
# runout_gcode:
# insert_gcode:
# 
[stepper_z]
step_pin: PG9
dir_pin: !PG10
enable_pin: !PG13
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
# ── Z Homing: Direct bed probing via shuttle IR probe (Z min = 0) ──
endstop_pin: probe:z_virtual_endstop
position_max: 305
position_min: -5
homing_speed: 20
second_homing_speed: 3
homing_retract_dist: 3

## Z1 Motor (Rear Left) - Kraken S6
## Motor: LDO-42STH48-2004AC
[stepper_z1]
step_pin: PG11
dir_pin: PD7
enable_pin: !PG12
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

## Z2 Motor (Rear Right) - Kraken S7
## Motor: LDO-42STH48-2004AC
[stepper_z2]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

## Z3 Motor (Front Right) - Kraken S8
## Motor: LDO-42STH48-2004AC
[stepper_z3]
step_pin: PG15
dir_pin: PB6
enable_pin: !PG14
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

#####################################################################
#  TMC5160 (SPI) - Z Motors (48V)
#####################################################################

[tmc5160 stepper_z]
cs_pin: PD2              # Kraken S5 SPI CS (official pinout verified)
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 0.8
sense_resistor: 0.075    # Kraken S5-S8
stealthchop_threshold: 0

[tmc5160 stepper_z1]
cs_pin: PA15             # Kraken S6 SPI CS (official pinout verified)
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z2]
cs_pin: PA9              # Kraken S7 SPI CS (official pinout verified)
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_z3]
cs_pin: PA10             # Kraken S8 SPI CS (official pinout verified)
spi_software_miso_pin: PC7
spi_software_mosi_pin: PC8
spi_software_sclk_pin: PC6
interpolate: True
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

#####################################################################
#  Bed Heater (AC Heated Bed via SSR)
#####################################################################

[heater_bed]
heater_pin: PF5       # Kraken BED-OUT (V1.0 official: Low-Side MOSFET -> SSR control)
sensor_type: ATC Semitec 104NT-4-R025H42G   # Update according to thermistor type
sensor_pin: PB0        # Kraken THB (V1.0 official: Bed thermistor ADC)
max_power: 1.0
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769
# Replace the values above after PID tuning

#####################################################################
#  Tools Calibrate - SexBolt (SexBall Probe)
#####################################################################

# The SexBolt (SexBall Probe) is mounted on the rear bed extrusion
# (bed shifted 10mm forward -> secures rear clearance)
# Placed at Y rear alongside the nozzle brush / purge bucket
# Microswitch wired to Kraken S5 endstop pin (PF3)
#
# Purpose: Reference datum for X, Y, Z offset calibration across 6 tools
# - Uses T0 as the reference tool (offset 0,0,0)
# - Each tool's nozzle touches the SexBolt in X/Y/Z directions to measure position
# - Automatically calculates gcode_x/y/z_offset values for T1~T5
#
# Calibration sequence:
# 1. G28 -> QGL -> G28 Z
# 2. TOOL_LOCATE_SENSOR: Detect SexBolt position with T0 (set reference point)
# 3. TOOL_CALIBRATE_TOOL_OFFSET: Measure X/Y/Z offsets for each of T1~T5
# 4. CALIBRATE_NOZZLE_PROBE_OFFSET: Measure each tool_probe Z offset
# Or all at once: CALIBRATE_ALL_OFFSETS

[tools_calibrate]
pin: ^PF3                       # SexBolt microswitch pin (Kraken S5 endstop, NC assembly)
travel_speed: 20                # Travel speed (mm/s)
spread: 8.0                     # X/Y probing spread from center (mm) - adjusted to avoid Y-axis min limit (-15)
lower_z: 0.5                    # Z drop distance for nozzle to touch ball side (mm)
speed: 3.0                      # Probing speed (mm/s) - increased from 1 to 3
lift_speed: 4                   # Retract lift speed (mm/s)
final_lift_z: 6                 # Final Z lift after calibration (mm)
sample_retract_dist: 5.0        # Retract distance between samples
samples_tolerance: 0.50         # Sample tolerance (raised from 0.15 to accommodate variance)
samples: 3                      # Number of probing samples
samples_result: median          # Result calculation method
trigger_to_bottom_z: 0.25       # Trigger-to-bottom distance - requires calibration

# SexBolt position macro (referenced by CALIBRATE_ALL_OFFSETS, etc.)
[gcode_macro _CALIBRATION_SWITCH]
variable_x: 42.60               # SexBall X coordinate - measured value
variable_y: -6.70               # SexBall Y coordinate - measured value
variable_z: 20.000              # Approach Z height (safe height, must be well above SexBolt)
gcode:
    # This macro only stores variables and is not called directly.
    # klipper-toolchanger-easy references these variables.
    RESPOND MSG="Calibration switch at X{printer['gcode_macro _CALIBRATION_SWITCH'].x} Y{printer['gcode_macro _CALIBRATION_SWITCH'].y}"

#####################################################################
# i2c_bus: i2c0f
# x_offset: 0.0
# y_offset: 0.0
# descend_z: 1.0              # Latest Klipper standard (used instead of z_offset, safe reference height 1.0mm)


#####################################################################
#  Nozzle Camera (Mounted on Shuttle, USB Connection)
#####################################################################

# Nozzle camera is connected to Raspberry Pi USB
# No Klipper config required - configured in Crowsnest or camera software
# Recognized as /dev/video* device

#####################################################################
#  Quad Gantry Level
#####################################################################

[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    50,55
    50,280
    300,280
    300,55
speed: 300
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.03
max_adjust: 10

#####################################################################
#  Bed Mesh
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 40, 50
mesh_max: 310, 280
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5              # Voron Tap / IR probe (adjusted to practical 5x5 grid)
algorithm: bicubic
zero_reference_position: 175,175
adaptive_margin: 5            # * Klipper native (or KAMP) adaptive mesh margin

#####################################################################
#  Fan Control (Kraken Board Fans)
#####################################################################

# Part cooling fans and hotend fans for each toolhead are configured in T*.cfg.
#
# Kraken fan port pinmap (officially verified):
# FAN0: PA0  │ FAN1: PA1  │ FAN2: PA2  │ FAN3: PA3
# FAN4: PA4  │ FAN5: PA5  │ FAN6: PA6 (4-pin, tacho PC1)
# FAN7: PE8 (4-pin, tacho PG0)
# Voltage selection: 5V / 12V / 24V (jumper), max 1A per port

# ─── Electronics Bay Cooling Fan 1 (FAN0) ───
[controller_fan electronics_fan_1]
pin: PA0                   # Kraken FAN0
kick_start_time: 0.5
heater: heater_bed
stepper: stepper_x, stepper_y
fan_speed: 0.5
idle_speed: 0.2            # Spins gently during idle

# ─── Electronics Bay Cooling Fan 2 (FAN1) ───
[controller_fan electronics_fan_2]
pin: PA1                   # Kraken FAN1
kick_start_time: 0.5
heater: heater_bed
stepper: stepper_x, stepper_y
fan_speed: 0.5
idle_speed: 0.2

# ─── Chamber Temperature Control / Exhaust Fan (FAN2) ───
# Rear panel, chamber exhaust / activated carbon filter
[temperature_fan chamber]
pin: PA2                   # Kraken FAN2
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5
sensor_type: Generic 3950
sensor_pin: PB1            # Kraken TH0 
control: pid
pid_Kp: 40.0
pid_Ki: 0.2
pid_Kd: 0.1
min_temp: -100
max_temp: 80
target_temp: 80.0          # Default (inactive)

# ─── Internal Air Filter Fan (FAN3) ───
# 3 fans wired in parallel to a single port
# 3 fans x ~0.2A = ~0.6A (within 1A port max)
[fan_generic chamber_filter_fan]
off_below: 0.3
pin: PA3                   # Kraken FAN3
max_power: 1.0
shutdown_speed: 0.0

#####################################################################
#  Temperature Sensors
#####################################################################

[temperature_sensor MCU_Kraken]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

# Chamber temperature sensor (Kraken TH0 port)
# Since extruder heaters/thermistors are on SHT36 V3 toolboards, TH0 is used for chamber temp.
# [temperature_sensor Chamber] has been merged into [temperature_fan chamber].

#####################################################################
#  VOC Air Quality Sensor (BME680 / SGP40 Ready)
#####################################################################
# Connect a VOC sensor to the I2C port for active carbon filter control.
# Uncomment when installed and update MCU pins accordingly (e.g., Kraken I2C1 PB8/PB9).

#[bme680 chamber_voc]
#i2c_mcu: mcu
#i2c_bus: i2c1_PB8_PB9
#
#[temperature_sensor VOC_Temperature]
#sensor_type: bme680
#sensor_pin: chamber_voc:temp
#
# (* Controlling bme680:gas via [temperature_fan] in Klipper can be linked
# via custom macros in future updates.)

#####################################################################
#  LED (Kraken Neopixel Ports)
#####################################################################

# Chamber interior lighting - Kraken Neopixel 1 port (PF12)
# WS2812B or compatible LED strip
[neopixel chamber_light]
pin: PF12                  # Kraken Neopixel 1 (officially verified)
chain_count: 30            # Adjust to match LED count
color_order: GRB           # WS2812B standard
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

# Spare LED port - Kraken Neopixel 2 (PF11)
# Enable if an additional LED strip is needed
#[neopixel extra_light]
#pin: PF11                 # Kraken Neopixel 2
#chain_count: 10
#color_order: GRB

# LED control macros
[gcode_macro LIGHTS_ON]
gcode:
    SET_LED LED=chamber_light RED=1.0 GREEN=1.0 BLUE=1.0

[gcode_macro LIGHTS_OFF]
gcode:
    SET_LED LED=chamber_light RED=0 GREEN=0 BLUE=0

[gcode_macro LIGHTS_DIM]
gcode:
    SET_LED LED=chamber_light RED=0.2 GREEN=0.2 BLUE=0.2

#####################################################################
#  Servo - LeafCutter (Rear Left, Filament Cutter)
#####################################################################

# Servo motor for actuating the LeafCutter bolt
# Mounted at rear left; when folded (safe) the bolt points up,
# when deployed (cut) it extends horizontally to press the LeafCutter arm.

[servo leafcutter_servo]
pin: PE7              # Kraken SERVO pin (official pinout verified; PE9 is BLTouch/Probe pin)
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 0      # Folded state (bolt pointing up = safe position)

#####################################################################
#  Toolchanger / Homing Configuration
#####################################################################
#  * [toolchanger] parameters and [homing_override_config] are managed in
#    toolchanger/toolchanger-config.cfg.
#    (klipper-toolchanger-easy design pattern: last include overrides)
#
#  save_current_tool feature:
#    klipper-toolchanger-easy internally tracks the currently mounted tool.
#    No separate [save_variables] section is needed for tool state.
#
#  On initial startup:
#    * Z homing works without a tool mounted via the shuttle IR probe / endstop
#    * Optional auto-sequence after boot: G28 -> move to nozzle cleaning position
#    During G28, homing_override -> INITIALIZE_TOOLCHANGER ->
#    DETECT_ACTIVE_TOOL_PROBE automatically detects the mounted tool.

#####################################################################
#  Auto-Home Sequence on Boot
#####################################################################
#  Runs automatically 5 seconds after power-on (when enabled):
#  1. XYZ Homing (works with or without a tool mounted)
#  2. Move to nozzle cleaning position (rear center brush area)
#  3. Keep Z at top safe height
#
#  * BoxTurtle state restoration completes earlier in _BT_STARTUP (3s)
#  * Caution: Motors activate immediately after Klipper boots when enabled!
#  * Set initial_duration: 0 to disable

[delayed_gcode _STARTUP_AUTO_HOME]
initial_duration: 0
gcode:
    RESPOND MSG="╔══════════════════════════════════════════════╗"
    RESPOND MSG="║  Boot Auto Sequence: XYZ Home + Standby Pos  ║"
    RESPOND MSG="╚══════════════════════════════════════════════╝"

    # ── 1. XYZ Homing ──
    # homing_override automatically runs DETECT_ACTIVE_TOOL_PROBE
    RESPOND MSG="[1/2] Homing XYZ..."
    M117 [1/2] Homing XYZ...
    _LED_HOMING
    G28

    # ── 2. Move to nozzle cleaning standby position ──
    # Brush area: X=175, Y=345 (rear bed clearance)
    RESPOND MSG="[2/2] Moving to nozzle cleaning standby position..."
    M117 [2/2] Moving to standby pos...
    G90
    G1 X175 Y345 F6000

    ALL_TOOL_LEDS_ON
    RESPOND MSG="Boot sequence complete - Standby (Nozzle cleaning position)"
    M117 Ready - Nozzle cleaning pos

#####################################################################
#  Input Shaper
#####################################################################

[input_shaper]
# Configure after measuring with the SHT36 V3 onboard accelerometer (LIS2DW)
# * Multi-tool: Enter per-tool values in params_input_shaper_* inside each T*.cfg
#   klipper-toolchanger-easy switches shapers automatically on toolchange
#shaper_freq_x: 50
#shaper_freq_y: 50
#shaper_type: mzv

[resonance_tester]
# Uses T0's LIS2DW as the default chip
# MEASURE_RESONANCE macro switches accel_chip per tool
accel_chip: lis2dw T0_accel
probe_points:
    175, 165, 50

#####################################################################
#  Idle Timeout
#####################################################################

[idle_timeout]
timeout: 1800
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Idle timeout reached: 30 min. Turning off hotend but keeping bed on."
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
        {% if printer['extruder1'] is defined %} SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0 {% endif %}
        {% if printer['extruder2'] is defined %} SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET=0 {% endif %}
        {% if printer['extruder3'] is defined %} SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET=0 {% endif %}
        {% if printer['extruder4'] is defined %} SET_HEATER_TEMPERATURE HEATER=extruder4 TARGET=0 {% endif %}
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

#####################################################################
#  Webcam (Logitech C920E, USB 3.0)
#####################################################################

# Logitech C920E connected to Raspberry Pi 5 USB 3.0 port
# For overall print monitoring (separate from shuttle nozzle camera)
# No Klipper config required - configured in Crowsnest or camera software
# Recognized as /dev/video* device

#####################################################################
#  PRINT_START - Print Start Macro
#####################################################################
#
#  Slicer Start G-code example (OrcaSlicer / SuperSlicer):
#    PRINT_START BED={first_layer_bed_temperature[0]}
#                HOTEND={first_layer_temperature[0]}
#                TOOL={initial_tool}
#                MATERIAL={filament_type[0]}
#                SPOOL_ID={spool_id[0]}
#                TOOLS={used_tools}
#                FILAMENT_M={filament_used_m}
#
#  * SPOOL_ID: Spoolman spool ID (passed automatically with OrcaSlicer Spoolman integration)
#    Proceeds without Spoolman assignment if omitted
#  * TOOLS: List of used tools (e.g., "0,2,4") - for parallel preheating in multi-color prints
#  * FILAMENT_M: Total filament required (meters) - for low-filament warning
#
#  Before Layer Change G-code:
#    BEFORE_LAYER_CHANGE LAYER=[layer_num] HEIGHT=[layer_z] TOTAL=[total_layer_count]
#
#  After Layer Change G-code:
#    AFTER_LAYER_CHANGE
#
#  Before Tool Change G-code (for multi-color prints):
#    PREHEAT_NEXT_TOOL TOOL=[next_extruder] TEMP={first_layer_temperature[next_extruder]}
#
#  Execution Sequence:
#  1. Bed heating (heat to target temperature + thermal soak wait)
#  2. G28 Homing (XYZ homing)
#  3. QGL gantry leveling (empty shuttle probe -> establish gantry plane)
#  4. G28 Z re-homing (re-establish Z datum after QGL)
#  5. Bed Mesh Scan (empty shuttle IR probe scan)
#  6. Initial tool pickup (SELECT_TOOL - accurate docking after leveling)
#  7. BoxTurtle preparation (lane detection + BT mode sync)
#  8. Hotend heating (heat to printing temperature over purge bucket)
#  9. PURGE_NOZZLE (purge bucket -> brush wipe)
#  10. CLEAN_NOZZLE (final nozzle wipe)

[gcode_macro PRINT_START]
description: Complete print start sequence (Hybrid mode - BoxTurtle optional)
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set HOTEND = params.HOTEND|default(200)|float %}
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
    {% set SOAK_TIME = params.SOAK|default(0)|int %}
    {% set IS_TPU = 1 if MATERIAL == "TPU" else 0 %}
    {% set SPOOL_ID = params.SPOOL_ID|default(0)|int %}
    {% set TOOLS_STR = params.TOOLS|default("")|string %}
    {% set FILAMENT_M = params.FILAMENT_M|default(0)|float %}

    # ── Input Parameter Validation ──
    {% if TOOL < 0 or TOOL > 5 %}
        { action_raise_error("PRINT_START: Valid tool number is 0~5 (input: T%d)" % TOOL) }
    {% endif %}
    {% if HOTEND < 150 %}
        { action_raise_error("PRINT_START: Hotend temperature must be at least 150C (input: %.0fC)" % HOTEND) }
    {% endif %}

    # Map extruder name
    {% set heater_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    RESPOND MSG="========================================="
    RESPOND MSG="  PRINT_START: {MATERIAL} / BED:{BED}°C / HOTEND:{HOTEND}°C / T{TOOL}"
    {% if SPOOL_ID > 0 %}
        RESPOND MSG="  Spoolman Spool ID: #{SPOOL_ID}"
    {% endif %}
    RESPOND MSG="========================================="
    M117 Print starting...
    _LED_HEATING
    LIGHTS_ON

    # ── Cancel previous cooldown timers (prevents conflict on rapid restart) ──
    UPDATE_DELAYED_GCODE ID=_DELAYED_EXHAUST DURATION=0
    UPDATE_DELAYED_GCODE ID=_DELAYED_EXHAUST_FULL DURATION=0
    UPDATE_DELAYED_GCODE ID=_DELAYED_FANS_OFF DURATION=0

    # ── Set filament usage estimate ──
    {% if FILAMENT_M > 0 %}
        SET_FILAMENT_ESTIMATE TOTAL_M={FILAMENT_M}
    {% endif %}

    # ── Multi-color print: Parallel preheating of used tools ──
    # When passed as TOOLS="0,2,4", preheats used tools to 150C standby
    {% if TOOLS_STR != "" %}
        {% for t in TOOLS_STR.split(",") %}
            {% set t_num = t|trim|int %}
            {% if t_num != TOOL and t_num >= 0 and t_num <= 5 %}
                {% set h = "extruder" if t_num == 0 else "extruder" ~ t_num %}
                SET_HEATER_TEMPERATURE HEATER={h} TARGET=150
                RESPOND MSG="  T{t_num} preheat started (150°C standby)"
            {% endif %}
        {% endfor %}
    {% endif %}

    # ── Stage 0: Spoolman spool assignment + material environment control ──
    {% if SPOOL_ID > 0 %}
        SET_ACTIVE_SPOOL ID={SPOOL_ID}
    {% endif %}

    # Automatic exhaust / filter fan control by material
    {% if MATERIAL in ["ABS", "ASA", "HS-ABS"] %}
        # ABS/ASA: Enclosed chamber -> Exhaust OFF, Carbon Filter ON (VOC scrubbing)
        SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET=80
        SET_FAN_SPEED FAN=chamber_filter_fan SPEED=0.8
        RESPOND MSG="  Environment: Enclosed chamber mode (Exhaust OFF, Filter ON)"
    {% elif MATERIAL in ["PLA", "PETG", "HS-PLA", "HS-PETG", "TPU"] %}
        # PLA/PETG/TPU: Ventilated chamber -> Exhaust ON, Filter OFF
        SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET=35
        SET_FAN_SPEED FAN=chamber_filter_fan SPEED=0
        RESPOND MSG="  Environment: Ventilated chamber mode (Exhaust ON, Filter OFF)"
    {% else %}
        # Nylon and others: Filter at 50%
        SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET=80
        SET_FAN_SPEED FAN=chamber_filter_fan SPEED=0.5
        RESPOND MSG="  Environment: Low-ventilation mode (Exhaust OFF, Filter 50%)"
    {% endif %}

    # ── Stage 1: Bed Heating ──
    # Preheat hotend to 150C only (prevents oozing during probing)
    RESPOND MSG="[1/10] Heating bed: {BED}°C / Preheating hotend: 150°C"
    M117 [1/10] Heating bed...
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED}
    SET_HEATER_TEMPERATURE HEATER={heater_name} TARGET=150
    # * Sets both MINIMUM (heating wait) and MAXIMUM (cooling wait)
    # Prevents adhesion failure when switching from a high-temp print (110C) to a low-temp print (60C)
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED - 2} MAXIMUM={BED + 5} TIMEOUT=1800

    # Thermal soak wait (bed thermal expansion affects mesh)
    {% if SOAK_TIME > 0 %}
        RESPOND MSG="[1/10] Thermal soak wait: {SOAK_TIME} min..."
        M117 [1/10] Heat soak: {SOAK_TIME}m...
        G4 P{SOAK_TIME * 60 * 1000}
    {% endif %}

    # ── Stage 2: Homing ──
    # homing_override -> INITIALIZE_TOOLCHANGER -> DETECT_ACTIVE_TOOL_PROBE runs automatically
    RESPOND MSG="[2/10] G28 Homing..."
    M117 [2/10] G28 Homing...
    _LED_HOMING
    G28

    # ── Stage 3: QGL Gantry Leveling (Empty Shuttle) ──
    # * Leveling the gantry before tool pickup ensures accurate dock Z alignment.
    RESPOND MSG="[3/10] QGL Gantry Leveling (empty shuttle)..."
    M117 [3/10] QGL Leveling...
    QUAD_GANTRY_LEVEL

    # ── Stage 4: Re-home Z after QGL ──
    # QGL corrects gantry tilt, so re-establish Z datum
    RESPOND MSG="[4/10] Re-homing Z..."
    M117 [4/10] Re-homing Z...
    G28 Z

    # ── Stage 5: Bed Mesh Scan (Empty Shuttle State) ──
    # Scanning the mesh with an empty shuttle (IR probe) prevents double-applying tool Z offsets.
    RESPOND MSG="[5/10] Scanning bed mesh (Adaptive)..."
    M117 [5/10] Bed mesh scan...
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1

    # ── Stage 6: Initial Tool Pickup ──
    # Mount tool from dock with gantry leveled, Z datum established, and mesh scanned
    RESPOND MSG="[6/10] Picking up initial tool T{TOOL}..."
    M117 [6/10] Pickup T{TOOL}...
    SELECT_TOOL T={TOOL}

    # ── Stage 7: BoxTurtle Preparation ──
    # Auto-detects sensor states for each lane to determine bt/direct/empty mode
    # Syncs extruder_stepper only for lanes in BT mode
    # Enables tension management for TPU material
    # * Runs only if BoxTurtle (boxturtle.cfg) is included.
    {% if printer["gcode_macro _BT_VARS"] is defined %}
        RESPOND MSG="[7/10] BoxTurtle lane detection and sync..."
        M117 [7/10] BoxTurtle sync...
        BT_PRINT_START TPU={IS_TPU}
    {% else %}
        RESPOND MSG="[7/10] BoxTurtle not installed — Direct feed mode (skipping BoxTurtle step)"
        M117 [7/10] Direct feed mode...
    {% endif %}

    # ── Stage 8: Final Hotend Heating ──
    # Move over purge bucket first so oozing filament during heating does not drop onto the bed
    {% set purge_vars = printer["gcode_macro _PURGE_BUCKET_VARS"] %}
    G90
    _SAFE_BUCKET_ENTRY TARGET=BUCKET

    # Heat to printing temperature after mesh scan completes
    RESPOND MSG="[8/10] Heating hotend: {HOTEND}°C..."
    M117 [8/10] Heating: {HOTEND}°C...
    _LED_HEATING
    SET_HEATER_TEMPERATURE HEATER={heater_name} TARGET={HOTEND}
    TEMPERATURE_WAIT SENSOR={heater_name} MINIMUM={HOTEND - 2} TIMEOUT=600
    # * TIMEOUT=600: Errors out after max 10 min wait on heater fault (prevents infinite wait)

    # ── Stage 9: Purge (Conditional Skip) ──
    # Skips purge if using the exact same tool + material as the previous print (saves time)
    {% set state = printer["gcode_macro _PRINT_STATE"] %}
    {% set skip_purge = (state.last_tool == TOOL and state.last_material == MATERIAL) %}

    {% if skip_purge %}
        RESPOND MSG="[9/10] Skipping purge (same tool/material as previous print)"
        M117 [9/10] Purge skipped...
    {% else %}
        RESPOND MSG="[9/10] Purging nozzle..."
        M117 [9/10] Purging nozzle...
        PURGE_NOZZLE
    {% endif %}

    # ── Stage 10: Final Nozzle Cleaning ──
    RESPOND MSG="[10/10] Final nozzle wipe..."
    M117 [10/10] Cleaning nozzle...
    CLEAN_NOZZLE

    # ── Save state (for comparison on next print) ──
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=last_tool VALUE={TOOL}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=last_material VALUE='"{MATERIAL}"'
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=print_count VALUE={state.print_count + 1}

    # RESET_THERMAL_ADJUST   # (deprecated - call removed to prevent double compensation)

    # ── Enable Clog Detection Sensors (filament stall during print) ──
    # Motion sensors only evaluate when their assigned extruder is actively extruding,
    # so enabling all 5 will not false-trigger on parked (non-extruding) tools.
    {% for i in range(5) %}
        SET_FILAMENT_SENSOR SENSOR=T{i}_clog ENABLE=1
    {% endfor %}
    RESPOND MSG="Clog detection sensors enabled."

    M117 Printing...
    _LED_PRINTING
    RESPOND MSG="========================================="
    RESPOND MSG="  PRINT_START Complete - Starting Print (#{state.print_count + 1})"
    RESPOND MSG="========================================="

#####################################################################
#  PRINT_END - Print End Macro
#####################################################################
#
#  Slicer End G-code:
#    PRINT_END
#
#  Execution Sequence:
#  1. Retract extruder (prevent stringing)
#  2. Raise Z to top safe height (secure print clearance)
#  3. BoxTurtle cleanup (unsync steppers)
#  4. Drop off active tool (return to dock)
#  5. Turn off heaters and fans
#  6. Move shuttle to nozzle cleaning standby position (keep Z at top)
#  7. Clear bed mesh

[gcode_macro PRINT_END]
description: Print end sequence (Hybrid mode - BoxTurtle optional)
gcode:
    RESPOND MSG="========================================="
    RESPOND MSG="  PRINT_END: Starting shutdown sequence"
    RESPOND MSG="========================================="
    M117 Print ending...

    # ── Disable clog detection sensors (prevents false triggers during parking/retraction) ──
    {% for i in range(5) %}
        SET_FILAMENT_SENSOR SENSOR=T{i}_clog ENABLE=0
    {% endfor %}

    # ── Stage 1: Stop extrusion + Retract ──
    M400                               # Wait for move queue to finish
    G92 E0
    G1 E-5.0 F2100                     # 5mm retract (prevent stringing)

    # ── Stage 2: Raise Z to top safe height ──
    G90
    G1 Z300 F3000                      # Move near top Z (leaves 5mm margin for bed mesh compensation)

    # ── Stage 3: BoxTurtle cleanup ──
    # BT mode lanes: Unsync motion queue (leave filament loaded in toolhead)
    # Direct mode lanes: No action
    # State transition: printing -> idle
    {% if printer["gcode_macro _BT_VARS"] is defined %}
        RESPOND MSG="Cleaning up BoxTurtle..."
        BT_PRINT_END
    {% endif %}

    # ── Stage 4: Drop off active tool ──
    # UNSELECT_TOOL: Returns currently mounted tool to its dock
    RESPOND MSG="Dropping off active tool..."
    UNSELECT_TOOL                      # klipper-toolchanger: park current tool

    # ── Stage 5: Heaters + Fans OFF ──
    TURN_OFF_HEATERS
    # * M107 only applies to [fan] — use SET_FAN_SPEED / ALL_FANS_OFF for fan_generic
    ALL_FANS_OFF
    # G2SA hotend fans are heater_fan and turn off automatically below threshold temp

    # ── Stage 6: Shuttle -> Nozzle cleaning standby position (keep Z at top) ──
    RESPOND MSG="Moving shuttle to nozzle cleaning standby position..."
    G90
    G1 X175 Y345 F6000                 # Nozzle cleaning area (rear of bed)

    # ── Stage 7: Clear Spoolman active spool ──
    CLEAR_ACTIVE_SPOOL

    # ── Stage 8: Clear bed mesh ──
    BED_MESH_CLEAR

    # ── Stage 9: Material-specific cooldown ventilation ──
    # ABS/ASA anti-warping: Keep exhaust OFF initially, cool chamber gradually
    # PLA/PETG: Run exhaust immediately for rapid cooling
    _PRINT_END_COOLDOWN

    # ── Stage 10: Disable steppers ──
    # Automatically disabled after idle_timeout (1800s)
    # Uncomment below to disable immediately:
    # M84

    _LED_COMPLETE
    LIGHTS_DIM
    M117 Print complete - All tools docked
    RESPOND MSG="========================================="
    RESPOND MSG="  PRINT_END Complete - All tools docked"
    RESPOND MSG="========================================="

#####################################################################
#  CANCEL_PRINT - Print Cancel Macro
#####################################################################

[gcode_macro CANCEL_PRINT]
description: Cancel print (same as PRINT_END + bed OFF)
rename_existing: BASE_CANCEL_PRINT
gcode:
    RESPOND MSG="!!! PRINT CANCELLED !!!"
    M117 CANCELLED

    # Execute full PRINT_END procedure (including BT_PRINT_END)
    PRINT_END

    BASE_CANCEL_PRINT

    # * Call _LED_ERROR after PRINT_END so error LED color overrides _LED_COMPLETE
    _LED_ERROR

#####################################################################
#  PAUSE / RESUME Overrides
#####################################################################

[gcode_macro PAUSE]
description: Pause print (called on filament runout, etc.)
rename_existing: BASE_PAUSE
variable_saved_fan_speed: 0
variable_is_paused: 0
variable_saved_hotend_temp: 0
variable_saved_hotend_name: 'extruder'
gcode:
    {% set E = params.E|default(5)|float %}

    RESPOND MSG="Print paused"
    M117 PAUSED
    _LED_PAUSED
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=is_paused VALUE=1

    # Save current active tool part cooling fan speed
    {% if printer.toolchanger is defined %}
        {% set tool_num = printer.toolchanger.tool_number|default(0) %}
        {% set fan_name = "T" ~ tool_num ~ "_part_fan" %}
        {% if printer["fan_generic " ~ fan_name] is defined %}
            SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_fan_speed VALUE={printer["fan_generic " ~ fan_name].speed|default(0)}
        {% endif %}
    {% endif %}

    # ── Save current hotend target temp (for reheating on resume after idle_timeout) ──
    {% set tnum = printer.toolchanger.tool_number|default(0) if printer.toolchanger is defined else 0 %}
    {% set ename = "extruder" if tnum == 0 else "extruder" ~ tnum %}
    {% if printer[ename] is defined and printer[ename].target > 0 %}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_hotend_temp VALUE={printer[ename].target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_hotend_name VALUE="'{ename}'"
    {% endif %}

    SAVE_GCODE_STATE NAME=PAUSE_STATE

    BASE_PAUSE

    # Retract nozzle
    G91
    G1 E-{E} F2100
    G90

    # Lift Z (calculated in absolute coordinates)
    {% set z_park = [printer.toolhead.position.z + 10, 300]|min %}
    G1 Z{z_park} F3000

[gcode_macro RESUME]
description: Resume print
rename_existing: BASE_RESUME
gcode:
    {% set E = params.E|default(5)|float %}

    # Guard against calling RESUME without prior PAUSE
    {% if not printer["gcode_macro PAUSE"].is_paused %}
        { action_raise_error("RESUME: Cannot RESUME without calling PAUSE first") }
    {% endif %}

    RESPOND MSG="Resuming print"
    M117 Resuming...
    _LED_PRINTING

    # Restore saved part fan speed
    {% if printer.toolchanger is defined %}
        {% set tool_num = printer.toolchanger.tool_number|default(0) %}
        {% set fan_name = "T" ~ tool_num ~ "_part_fan" %}
        {% set saved_speed = printer["gcode_macro PAUSE"].saved_fan_speed|default(0) %}
        {% if saved_speed > 0 %}
            SET_FAN_SPEED FAN={fan_name} SPEED={saved_speed}
            RESPOND MSG="Restored fan: {fan_name} -> {'%.0f'|format(saved_speed*100)}%"
        {% endif %}
    {% endif %}

    # ── Reheat hotend (if cooled down by idle_timeout during pause) ──
    {% set saved_temp = printer["gcode_macro PAUSE"].saved_hotend_temp|float %}
    {% set saved_ext  = printer["gcode_macro PAUSE"].saved_hotend_name %}
    {% if saved_temp > 0 and printer[saved_ext] is defined %}
        {% if printer[saved_ext].target < saved_temp - 5 %}
            RESPOND MSG="Reheating hotend: {saved_ext} -> {saved_temp}°C (before resume)"
            M117 Reheating...
            SET_HEATER_TEMPERATURE HEATER={saved_ext} TARGET={saved_temp}
        {% endif %}
        TEMPERATURE_WAIT SENSOR={saved_ext} MINIMUM={saved_temp - 2} TIMEOUT=600
    {% endif %}

    # Unretract
    G91
    G1 E{E} F2100
    G90

    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=150
    BASE_RESUME
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=is_paused VALUE=0

    M117 Printing...

#####################################################################
#  Filament Runout Handler
#####################################################################
#  * _FILAMENT_RUNOUT_HANDLER is defined in macros.cfg / boxturtle.cfg.
#    (State-machine smart handler: branches by bt/direct/empty mode)
#    Called from runout_gcode in each T*.cfg:
#      _FILAMENT_RUNOUT_HANDLER TOOL={N} SENSOR=entry|toolhead
#
#  * Uncomment below if using without macros.cfg / boxturtle.cfg:
#
# [gcode_macro _FILAMENT_RUNOUT_HANDLER]
# description: Filament runout detection handler (Standalone fallback without BoxTurtle)
# gcode:
#     {% set TOOL = params.TOOL|default(0)|int %}
#     {% set SENSOR = params.SENSOR|default("")|string %}
#     RESPOND MSG="Filament runout detected: T{TOOL} (Sensor: {SENSOR})"
#     {% if printer.idle_timeout.state == "Printing" %}
#         RESPOND MSG="Printing in progress - pausing..."
#         PAUSE
#     {% else %}
#         RESPOND MSG="Not printing - warning only"
#     {% endif %}

#####################################################################
#  LeafCutter Macro (Filament Cutting)
#####################################################################

# LeafCutter operating sequence:
# 1. Deploy servo -> bolt extends horizontally into cutting position
# 2. Move toolhead to bolt position -> LeafCutter arm presses against bolt
# 3. Filament cut complete
# 4. Fold servo -> bolt returns to safe position

[gcode_macro CUT_FILAMENT]
description: Cut filament with LeafCutter (called during toolchange / unload)
variable_cut_x: 30.0          # LeafCutter bolt X position - requires calibration
variable_cut_y: 330.0         # LeafCutter bolt Y position (rear left) - requires calibration
variable_safe_angle: 0        # Servo folded angle (bolt up = safe)
variable_cut_angle: 90        # Servo deployed angle (bolt horizontal = cut) - requires calibration
variable_push_distance: 5.0   # Travel distance for arm to press bolt - requires calibration
variable_push_direction: "x"  # Push direction ("x" or "y") - set according to mounting
gcode:
    SAVE_GCODE_STATE NAME=CUT_STATE

    # 1. Deploy servo (move bolt to cut position)
    SET_SERVO SERVO=leafcutter_servo ANGLE={cut_angle}
    G4 P500                    # Wait 500ms for servo movement

    # 2. Move near cutting position
    G90                        # Absolute positioning
    G1 X{cut_x} Y{cut_y} F6000

    # 3. Press LeafCutter arm against bolt (cutting action)
    {% if push_direction == "x" %}
        G91
        G1 X{push_distance} F1000
        G1 X-{push_distance} F3000
        G90
    {% else %}
        G91
        G1 Y{push_distance} F1000
        G1 Y-{push_distance} F3000
        G90
    {% endif %}

    G4 P200                    # Dwell after cut

    # 4. Fold servo (return bolt to safe position)
    SET_SERVO SERVO=leafcutter_servo ANGLE={safe_angle}
    G4 P500
    SET_SERVO SERVO=leafcutter_servo WIDTH=0    # Disable servo PWM (prevent jitter)

    RESTORE_GCODE_STATE NAME=CUT_STATE

#####################################################################
#  Decontaminator Purge Bucket & Nozzle Scrubber
#####################################################################
#
#  Mounting Location: Front-right / Rear bed rail
#  Layout (top view):
#
#   ┌──────────┐ ┌──────────────────┐ ┌────────────────────────┐
#   │Small Bkt │ │   Brass Brush    │ │     Large Bucket       │
#   └──────────┘ └──────────────────┘ └────────────────────────┘
#
#  Usage points:
#  1. After filament load -> PURGE_NOZZLE (integrated purge + wipe)
#  2. After tool change -> CLEAN_NOZZLE (wipe only)
#  3. Before probing -> CLEAN_NOZZLE (for accurate Z measurement)
#  4. PRINT_START -> PURGE_NOZZLE or CLEAN_NOZZLE
#
#  Recommended brush: Brass or Bambu A1 silicone wiper
#  Mount: M3 bolts + 2020 hammer nuts, 6x3mm magnets for removable bucket



[gcode_macro _PURGE_BUCKET_VARS]
description: Shared purge bucket / brush variables
# ── Brush coordinates (left-right wiping) ──
variable_brush_x_start: 311.72      # Brush start X (323.72 - 12)
variable_brush_x_end: 335.72        # Brush end X (323.72 + 12)
variable_brush_x: 323.72            # Brush center X
variable_brush_y: -1.37             # Brush center Y
variable_brush_z: 290.500           # Nozzle-to-brush Z height
# ── Purge bucket coordinates ──
variable_bucket_x: 323.72           # Bucket center X
variable_bucket_y: -12.37           # Bucket center Y
# ── Shared parameters ──
variable_travel_z: 265.0            # Safe travel Z height (clearance below/above docks)
variable_wipe_count: 5              # Number of reciprocating wipe strokes
variable_wipe_speed: 6000           # Wiping speed (mm/min)
variable_purge_amount: 30           # Default purge length (mm)
variable_purge_speed: 300           # Purge extrusion speed (mm/min)
variable_purge_retract: 5.0         # Retract after purge (mm)
variable_ooze_dwell: 5              # Dwell time after purge (seconds)
gcode:
    RESPOND MSG="Purge bucket vars loaded"

[gcode_macro _SAFE_BUCKET_ENTRY]
description: Collision-free safe entry path into the purge bucket or nozzle brush avoiding docks and tools
gcode:
    {% set TARGET = params.TARGET|default("BUCKET")|string|upper %}
    {% set vars = printer['gcode_macro _PURGE_BUCKET_VARS'] %}
    {% set is_in_bucket_zone = (printer.toolhead.position.x > 310 and printer.toolhead.position.y < 5) %}

    {% if is_in_bucket_zone %}
        # Already inside bucket/brush zone: move directly to adjacent target without full Y120/Z265 retreat
        {% if TARGET == "BRUSH" %}
            G1 Y{vars.brush_y} F6000
            G1 X{vars.brush_x_start} F6000
            G1 Z{vars.brush_z} F1500
        {% else %}
            G1 X{vars.bucket_x} F6000
            G1 Z{vars.brush_z + 2} F1500
            G1 Y{vars.bucket_y} F6000
        {% endif %}
    {% else %}
        # Entering from outside: safe retreat to Y120 and Z265 before approaching
        {% if printer.toolhead.position.y < 120 and printer.toolhead.position.z > vars.travel_z %}
            G1 Y120 F6000
        {% endif %}
        G1 Z{vars.travel_z} F3000
        G1 Y120 F6000
        {% if TARGET == "BRUSH" %}
            G1 X{vars.brush_x_start} F6000
            G1 Z{vars.brush_z} F1500
            G1 Y{vars.brush_y} F6000
        {% else %}
            G1 X{vars.bucket_x} F6000
            G1 Z{vars.brush_z + 2} F1500
            G1 Y{vars.bucket_y} F6000
        {% endif %}
    {% endif %}

#####################################################################
#  Integrated Purge + Wipe Macro
#####################################################################
[gcode_macro PURGE_NOZZLE]
description: Purge filament in purge bucket and clean nozzle on brush
gcode:
    {% set vars = printer['gcode_macro _PURGE_BUCKET_VARS'] %}
    {% set AMOUNT = params.AMOUNT|default(vars.purge_amount)|float %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("PURGE_NOZZLE: Please home with G28 first") }
    {% endif %}

    {% set TOOL = printer.toolchanger.tool_number|default(-1)|int %}
    {% if TOOL == -1 %}
        { action_raise_error("PURGE_NOZZLE: No tool selected. Please select a tool with SELECT_TOOL first.") }
    {% endif %}
    
    {% set aext = printer.toolhead.extruder %}
    {% if aext == "" %}
        { action_raise_error("PURGE_NOZZLE: No active extruder.") }
    {% endif %}

    # Smart heating based on saved filament material (turn heater ON before moving)
    {% set saved_mat = printer.save_variables.variables.get("tool" ~ TOOL ~ "_material", "") | replace("'", "") %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}
    {% if saved_mat in db %}
        {% set TEMP = [ db[saved_mat].load|float, 175 ]|max %}
    {% else %}
        {% set TEMP = 200 %}
    {% endif %}

    {% if printer[aext].temperature < (TEMP - 2) %}
        RESPOND MSG="[PURGE_NOZZLE] Turning on heater for T{TOOL}({saved_mat}) and moving to purge bucket..."
        SET_HEATER_TEMPERATURE HEATER={aext} TARGET={TEMP}
    {% endif %}

    SAVE_GCODE_STATE NAME=PURGE_STATE
    M117 Moving to bucket...

    G90
    _SAFE_BUCKET_ENTRY TARGET=BUCKET

    RESPOND MSG="[PURGE_NOZZLE] Waiting for purge temperature: {TEMP}°C"
    TEMPERATURE_WAIT SENSOR={aext} MINIMUM={TEMP - 2}
    
    M83
    G92 E0
    G1 E{AMOUNT} F{vars.purge_speed}
    
    M106 S255
    G4 P{vars.ooze_dwell * 1000}
    
    G92 E0
    G1 E-{vars.purge_retract} F{vars.purge_speed * 5}
    
    M106 S0
    
    # Finish by wiping nozzle with CLEAN_NOZZLE
    CLEAN_NOZZLE
    
    # Turn off hotend only when not actively printing (maintain temp during mid-print toolchange/purge!)
    {% set st = printer.print_stats.state %}
    {% set sd_active = printer.virtual_sdcard.is_active %}
    {% if st != "printing" and not sd_active %}
        SET_HEATER_TEMPERATURE HEATER={aext} TARGET=0
        RESPOND MSG="[PURGE_NOZZLE] Purge and wipe complete. Turning off hotend heater for safety."
    {% else %}
        RESPOND MSG="[PURGE_NOZZLE] Purge and wipe complete. (Keeping heater temperature active during print)"
    {% endif %}

    M117 Purge Complete
    RESTORE_GCODE_STATE NAME=PURGE_STATE

#####################################################################
#  Wipe-Only Macro (Without Purge)
#####################################################################
[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle on brush only (without purging)
gcode:
    {% set vars = printer['gcode_macro _PURGE_BUCKET_VARS'] %}
    {% set COUNT = params.COUNT|default(vars.wipe_count)|int %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("CLEAN_NOZZLE: Please home with G28 first") }
    {% endif %}

    SAVE_GCODE_STATE NAME=CLEAN_STATE
    M117 Cleaning nozzle...

    G90
    _SAFE_BUCKET_ENTRY TARGET=BRUSH

    # Deploy brush servo (raise to 110 deg after arrival)
    SET_SERVO SERVO=brush_servo ANGLE=111
    SET_SERVO SERVO=brush_servo ANGLE=110
    G4 P500

    {% for i in range(COUNT) %}
        G1 X{vars.brush_x_end} F{vars.wipe_speed}
        G1 X{vars.brush_x_start} F{vars.wipe_speed}
    {% endfor %}

    G1 Y{vars.brush_y + 1.5} F{vars.wipe_speed}
    {% for i in range(COUNT) %}
        G1 X{vars.brush_x_end} F{vars.wipe_speed}
        G1 X{vars.brush_x_start} F{vars.wipe_speed}
    {% endfor %}

    G1 Y{vars.brush_y - 1.5} F{vars.wipe_speed}
    {% for i in range(COUNT) %}
        G1 X{vars.brush_x_end} F{vars.wipe_speed}
        G1 X{vars.brush_x_start} F{vars.wipe_speed}
    {% endfor %}

    G1 X{vars.brush_x} Y{vars.brush_y} F{vars.wipe_speed}

    # Retract brush servo (lower safely to 10 deg)
    SET_SERVO SERVO=brush_servo ANGLE=11
    SET_SERVO SERVO=brush_servo ANGLE=10
    G4 P500
    SET_SERVO SERVO=brush_servo WIDTH=0

    # Pull Y back to 120 to avoid colliding with toolhead docks on return
    G1 Y120 F6000
    G1 Z{vars.travel_z} F3000
    
    RESTORE_GCODE_STATE NAME=CLEAN_STATE


#####################################################################
#  Filament Load / Unload Macros (Default G2SA Direct Load)
#####################################################################
#  * Use BT_LOAD / BT_UNLOAD for BoxTurtle-assisted loading/unloading
#    (defined in boxturtle.cfg, branches by auto-detected lane mode)

[gcode_macro LOAD_FILAMENT]
description: Load filament (material-aware — auto-sets temp and saves per-tool material when MATERIAL is specified)
# Usage: LOAD_FILAMENT TOOL=1 MATERIAL=ABS   (auto material temp, remembered for subsequent unload/change)
#        LOAD_FILAMENT TOOL=1 TEMP=230        (direct temperature override also supported)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default("")|string|upper %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}

    # Determine temperature: DB load temp if MATERIAL specified, otherwise TEMP param (default 200)
    {% if MATERIAL in db %}
        {% set TEMP = [ db[MATERIAL].load|float, 175 ]|max %}
    {% else %}
        # Raise to at least 175C to avoid cold extrusion error below min_extrude_temp (170C)
        {% set TEMP = [ params.TEMP|default(200)|float, 175 ]|max %}
    {% endif %}

    # Map extruder name
    {% set extruder_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    RESPOND MSG="[LOAD_FILAMENT] T{TOOL}{' / ' ~ MATERIAL if MATERIAL else ''}: Starting load at {TEMP}°C..."
    M117 Loading filament T{TOOL}...

    # 1. Pick up tool (* Home/QGL first — SELECT_TOOL requires homing for accurate docking)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="[LOAD] Running homing first..."
        G28
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        RESPOND MSG="[LOAD] Running QGL (gantry leveling)..."
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}
    SELECT_TOOL T={TOOL}

    # 2. Heat hotend
    SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET={TEMP}
    TEMPERATURE_WAIT SENSOR={extruder_name} MINIMUM={TEMP - 2} TIMEOUT=600

    # 3. Extrude filament (50mm @ 300mm/min)
    G91                                    # Relative positioning
    M83                                    # Relative extrusion
    G1 E50 F300                            # Extrude 50mm
    G90

    # 4. Save material per tool (automatically used by unload/change)
    {% if MATERIAL in db %}
        SAVE_VARIABLE VARIABLE=tool{TOOL}_material VALUE="'{MATERIAL}'"
        RESPOND MSG="[LOAD_FILAMENT] Saved T{TOOL} = {MATERIAL}"
    {% endif %}

    RESPOND MSG="[LOAD_FILAMENT] T{TOOL} load complete"
    M117 Filament loaded

#####################################################################
#  Shared Filament Handling Settings (LeafCutter Assumed)
#####################################################################
#  * Operates assuming LeafCutter is installed (have_cutter: True).
#    Set have_cutter: False to temporarily disable the cutter.
#  * Calibrate distance values against actual toolhead measurements,
#    and calibrate CUT_FILAMENT cut_x/cut_y/angles first.
[gcode_macro _FILAMENT_SETTINGS]
description: Shared filament handling settings (cutter usage and distances)
variable_have_cutter: True      # True: Use LeafCutter (CUT_FILAMENT) for unload/change
variable_cut_to_nozzle: 45      # Cut point (above heatsink) to nozzle distance (mm) = remaining stub length
variable_upper_retract: 90      # Retract distance (mm) to pull out severed upper filament after cut
variable_cut_prime: 2           # Small prime right before cut (mm) - meltzone stabilization
variable_purge_margin: 15       # Transition purge = cut_to_nozzle + this margin (mm)
gcode:
    RESPOND MSG="Filament settings — Cutter:{'ON' if have_cutter else 'OFF'} / stub:{cut_to_nozzle}mm / upper_retract:{upper_retract}mm"

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament (material-aware — automatically uses saved material temperature)
# Usage: UNLOAD_FILAMENT TOOL=1               (auto-uses material temp saved during LOAD)
#        UNLOAD_FILAMENT TOOL=1 MATERIAL=ABS  (explicit material override)
#        UNLOAD_FILAMENT TOOL=1 TEMP=250      (explicit temperature override)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}
    # Determine material: parameter > saved tool material > (none)
    {% set saved_mat = printer.save_variables.variables.get('tool' ~ TOOL ~ '_material', '')|string|upper %}
    {% set MATERIAL = params.MATERIAL|default(saved_mat)|string|upper %}

    # Determine temperature: DB unload temp if material recognized, otherwise TEMP param (default 200)
    {% if MATERIAL in db %}
        {% set TEMP = [ db[MATERIAL].unload|float, 175 ]|max %}
    {% else %}
        # Raise to at least 175C to avoid cold extrusion error below min_extrude_temp (170C)
        {% set TEMP = [ params.TEMP|default(200)|float, 175 ]|max %}
    {% endif %}

    # Map extruder name
    {% set extruder_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    RESPOND MSG="[UNLOAD_FILAMENT] T{TOOL}{' / ' ~ MATERIAL if MATERIAL in db else ''}: Starting unload at {TEMP}°C..."
    M117 Unloading filament T{TOOL}...

    # 1. Pick up tool (* Home/QGL first — SELECT_TOOL requires homing for accurate docking)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="[UNLOAD] Running homing first..."
        G28
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        RESPOND MSG="[UNLOAD] Running QGL (gantry leveling)..."
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}
    SELECT_TOOL T={TOOL}

    # 2. Heat hotend
    SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET={TEMP}
    TEMPERATURE_WAIT SENSOR={extruder_name} MINIMUM={TEMP - 2} TIMEOUT=600

    # 3. Unload action: Cut if cutter enabled, otherwise tip-forming + retract
    {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% if s.have_cutter %}
        # ── Cutter Path ──
        # Small prime right before cut (meltzone stabilization)
        G91
        M83
        G1 E{s.cut_prime} F120
        G90
        M400
        # Cut filament above heatsink
        CUT_FILAMENT
        # Retract severed upper segment (* executed while hot to pass min_extrude_temp)
        G91
        M83
        G1 E-{s.upper_retract} F1200
        G90
        M400
        RESPOND MSG="[UNLOAD] Cutter cut complete. Remaining stub ({s.cut_to_nozzle}mm) will be purged on next load."
    {% else %}
        # ── Standard Retract Path (Cutter Disabled) ──
        # Tip forming (3 cycles: 3mm retract -> 2mm push)
        G91
        M83
        {% for i in range(3) %}
            G1 E-3 F300
            G1 E2 F300
        {% endfor %}
        # Final retract (50mm, fast)
        G1 E-50 F600
        G90
    {% endif %}

    # 4. Turn heater OFF (prevent hotend from sitting hot after unload)
    SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET=0

    RESPOND MSG="[UNLOAD_FILAMENT] T{TOOL} unload complete (Heater OFF)"
    M117 Filament unloaded

#####################################################################
#  Material Changeover Macro (PLA <-> ABS, etc. — Jam Prevention)
#####################################################################
#  Unloads at outgoing material temp -> (optional) cold pull -> loads at incoming material temp
#  -> flushes meltzone residue thoroughly with the new material.
#  OLD (current material) automatically uses the value saved during LOAD.
#
#  Usage: CHANGE_FILAMENT TOOL=0 NEW=ABS
#         CHANGE_FILAMENT TOOL=0 NEW=PLA COLDPULL=1      (includes cold pull — removes burnt residue)
#         CHANGE_FILAMENT TOOL=0 NEW=PETG OLD=ABS        (explicitly specify OLD)
#
#  Flow: Remove OLD (cutter cut or cold pull) -> insert NEW into entry -> interactive load
#        handles auto-feeding + purge/color confirmation (= transition flush).
[gcode_macro CHANGE_FILAMENT]
description: Material transition (OLD unload/cold pull -> NEW interactive load)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set NEW = params.NEW|default("")|string|upper %}
    {% set COLDPULL = params.COLDPULL|default(0)|int %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}
    {% set saved_mat = printer.save_variables.variables.get('tool' ~ TOOL ~ '_material', 'PLA')|string|upper %}
    {% set OLD = params.OLD|default(saved_mat)|string|upper %}

    # ── Safety guards ──
    {% if printer.idle_timeout.state == "Printing" %}
        RESPOND TYPE=error MSG="[CHANGE] Cannot use during printing"
    {% elif TOOL < 0 or TOOL > 5 %}
        RESPOND TYPE=error MSG="[CHANGE] TOOL range error: 0~5"
    {% elif NEW not in db %}
        RESPOND TYPE=error MSG="[CHANGE] Valid NEW material required. Example: CHANGE_FILAMENT TOOL=0 NEW=ABS"
    {% else %}
        RESPOND MSG="========== Material Transition T{TOOL}: {OLD} -> {NEW} =========="

        # 1. Remove OLD — pull out whole via cold pull (without cutting) if COLDPULL=1, otherwise standard unload
        {% if COLDPULL %}
            RESPOND MSG="[CHANGE] Pulling out {OLD} via cold pull (cutter bypassed)..."
            _COLD_PULL TOOL={TOOL} MATERIAL={OLD}
        {% else %}
            UNLOAD_FILAMENT TOOL={TOOL} MATERIAL={OLD}
        {% endif %}

        # 2. Load NEW — delegate to interactive load mode
        RESPOND MSG="[CHANGE] Insert {NEW} filament into entry now. Auto-load and purge will start upon detection."
        FILAMENT_LOAD_MODE TOOL={TOOL} MATERIAL={NEW}
    {% endif %}

#####################################################################
#  Cold Pull (Atomic Pull) — Forced Removal of Meltzone Residue
#####################################################################
#  * Experimental: Uses FORCE_MOVE to bypass min_extrude_temp and pull out at low temperature.
#    Tune distance (-90mm) / pull temperature for your hotend and material. Can also be used standalone.
#  Usage: _COLD_PULL TOOL=0 MATERIAL=PLA
[gcode_macro _COLD_PULL]
description: Cold pull — heat then cool to pull temperature and extract with FORCE_MOVE
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
    {% set ext = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}

    {% if printer.idle_timeout.state == "Printing" %}
        RESPOND TYPE=error MSG="[COLD_PULL] Cannot use during printing"
    {% elif MATERIAL not in db %}
        RESPOND TYPE=error MSG="[COLD_PULL] Unknown material: {MATERIAL}"
    {% else %}
        {% set hot  = [ db[MATERIAL].unload|float, 175 ]|max %}
        {% set pull = db[MATERIAL].pull|float %}
        RESPOND MSG="[COLD_PULL] T{TOOL} ({MATERIAL}): Heat {hot}°C -> Cool {pull}°C -> Forced extraction"
        ACTIVATE_EXTRUDER EXTRUDER={ext}

        # 1. Heat and prime slightly (fill meltzone to capture residue)
        SET_HEATER_TEMPERATURE HEATER={ext} TARGET={hot}
        TEMPERATURE_WAIT SENSOR={ext} MINIMUM={hot - 3} TIMEOUT=600
        M83
        G1 E8 F60
        M400

        # 2. Cool down to pull temperature (solidified plug pulls residue out at this temp)
        SET_HEATER_TEMPERATURE HEATER={ext} TARGET={pull}
        M117 Cooling for pull...
        TEMPERATURE_WAIT SENSOR={ext} MAXIMUM={pull}

        # 3. Extract using FORCE_MOVE since temperature is below min_extrude_temp
        FORCE_MOVE STEPPER={ext} DISTANCE=-90 VELOCITY=15 ACCEL=200

        SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
        RESPOND MSG="[COLD_PULL] Complete — inspect extracted tip for residue. Repeat once if dirty."
        M117 Cold pull done
    {% endif %}


#####################################################################
#  Nozzle Brush / Purge Bucket Servo
#####################################################################
[servo brush_servo]
pin: PF11
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 10



[delayed_gcode INIT_SERVO]
initial_duration: 1.0
gcode:
    SET_SERVO SERVO=brush_servo ANGLE=11
    UPDATE_DELAYED_GCODE ID=_INIT_SERVO_FOLD DURATION=0.5

[delayed_gcode _INIT_SERVO_FOLD]
initial_duration: 0
gcode:
    SET_SERVO SERVO=brush_servo ANGLE=10
    UPDATE_DELAYED_GCODE ID=_INIT_SERVO_OFF DURATION=1.0

[delayed_gcode _INIT_SERVO_OFF]
initial_duration: 0
gcode:
    SET_SERVO SERVO=brush_servo WIDTH=0
    M118 Servo folded on startup.

