#####################################################################
#  KlipperScreen.conf - 7-inch Touchpad Custom Menu
#####################################################################
#  Voron 2.4 350mm AWD + 5-Tool StealthChanger
#  BoxTurtle 5-Lane Hybrid Filament Loader
#
#  Location: ~/printer_data/config/KlipperScreen.conf
#  ★ KlipperScreen must already be installed.
#    Install: cd ~ && git clone https://github.com/KlipperScreen/KlipperScreen.git
#             cd KlipperScreen && ./scripts/KlipperScreen-install.sh
#
#  Custom menus added in addition to default menus:
#  - Tool Select (T0~T4 + Dropoff)
#  - BoxTurtle Control (Lane Status, Load/Unload)
#  - Unified Calibration Menu
#  - Sensor/System Status
#####################################################################

#####################################################################
#  Printer Default Settings
#####################################################################

[printer Voron 2.4 StealthChanger]
# Printer name (distinguishes when multiple printers are used)
# Moonraker connection settings (local default)
moonraker_host: 127.0.0.1
moonraker_port: 7125

#####################################################################
#  Screen Settings
#####################################################################

# 7-inch touchscreen settings (adjust to match resolution)
# BTT HDMI5/7, Waveshare 7inch, etc.
[main]
# 24-hour time format
24htime: True
# Print time estimation method
print_estimate_method: auto
# Confirm emergency stop
confirm_estop: True
# Show heater power in temperature graph
show_heater_power: True
# Screensaver blanking timeout (seconds) - 0 to disable
screen_blanking: 300

#####################################################################
#  Preheat Presets
#####################################################################

[preheat PLA]
bed: 60
extruder: 200
chamber: 0

[preheat PETG]
bed: 80
extruder: 230
chamber: 0

[preheat ABS]
bed: 110
extruder: 250
chamber: 50

[preheat ASA]
bed: 110
extruder: 250
chamber: 50

[preheat TPU]
bed: 50
extruder: 220
chamber: 0

[preheat Nylon]
bed: 80
extruder: 260
chamber: 0

[preheat HS-PLA]
# High Speed PLA (eSUN, PolyLite, etc. High Speed PLA)
bed: 65
extruder: 220
chamber: 0

[preheat HS-ABS]
# High Speed ABS (eSUN, Polymaker, etc. High Speed ABS)
bed: 110
extruder: 270
chamber: 50

[preheat HS-PETG]
# High Speed PETG
bed: 85
extruder: 250
chamber: 0

#####################################################################
#  Main Menu Custom Items
#####################################################################
#  KlipperScreen default menus:
#  - Actions, Temperature, Print, Configuration
#
#  Custom additions:
#  - Tools, BoxTurtle, Calibrate, System
#
#  ★ With Spoolman integration, KlipperScreen automatically displays
#    a spool selection panel (KlipperScreen v0.4.0+). No extra menu needed.
#    In Mainsail, spools can also be assigned via the spool icon beside each extruder.

