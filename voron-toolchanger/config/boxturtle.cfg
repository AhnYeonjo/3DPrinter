#####################################################################
#  Octopus Temperature Monitoring
#####################################################################

[temperature_sensor MCU_Octopus]
sensor_type: temperature_mcu
sensor_mcu: octopus
min_temp: 0
max_temp: 100

#####################################################################
#  State-Based Runout Sensor Handler (State Machine)
#####################################################################
#
#  * Core Principle:
#  All runout sensors (T0~T5_runout_entry/toolhead) remain enabled at all times.
#  When a sensor triggers, this handler checks _BT_VARS.state and the lane mode
#  to execute the appropriate action for the current state and mode.
#
#  pause_on_runout: False -> Disables Klipper's built-in PAUSE
#  runout_gcode: _FILAMENT_RUNOUT_HANDLER -> Evaluates state via macro instead
#
#  Handling by state:
#    "printing"  -> Actual runout! Calls PAUSE (or failover) + error message
#    "loading"   -> Ignored (normal sensor transitions during filament entry)
#    "unloading" -> Ignored (normal sensor transitions during filament exit)
#    "idle"      -> Warning message only (not printing, no PAUSE needed)
#
#  Lane mode awareness:
#    "bt" mode     -> Both sensors active during BT_SYNC (monitors both ends)
#    "direct" mode -> Only G2SA active (toolhead sensor is primary)

[gcode_macro _BT_FILAMENT_RUNOUT_HANDLER]
description: Branches runout sensor events based on current system state (delegated by _FILAMENT_RUNOUT_HANDLER dispatcher)
gcode:
    {% set TOOL = params.TOOL|default(-1)|int %}
    {% set SENSOR = params.SENSOR|default("unknown")|string %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set state = vars.state %}
    {% set active_lane = vars.active_lane %}
    {% set detected_mode = vars["detected_mode_" ~ TOOL] if TOOL >= 0 else "unknown" %}

    {% if state == "printing" %}
        # ══ Runout during printing -> Check fallback tool ══
        # 1. Check manually configured failover tool
        {% set fallback = printer["gcode_macro _AUTO_FAILOVER"].fallback_tool[TOOL]|default(-1)|int %}

        # 2. (Note) Spoolman dynamic lookup cannot be called and read in the same template pass
        #    because Klipper renders the entire Jinja template before executing commands.
        #    Therefore, only pre-configured fallback_tool mappings are used here; otherwise PAUSE safely.

        {% if fallback >= 0 %}
            RESPOND TYPE=error MSG="!!! T{TOOL} Filament Runout -> Auto-switching to T{fallback} (Auto Failover) !!!"
            M117 Failover: T{TOOL} -> T{fallback}
            # Park current tool and pick up fallback tool
            T{fallback}
        {% else %}
            RESPOND TYPE=error MSG="!!! T{TOOL} Filament Runout ({SENSOR}) detected during print! !!!"
            M117 RUNOUT T{TOOL}!
            PAUSE
        {% endif %}
    {% elif state == "loading" %}
        # ══ During loading -> Normal sensor transition (ignore) ══
        RESPOND MSG="[Runout Handler] T{TOOL} {SENSOR} transition - ignored during loading"
    {% elif state == "unloading" %}
        # ══ During unloading -> Normal sensor transition (ignore) ══
        RESPOND MSG="[Runout Handler] T{TOOL} {SENSOR} transition - ignored during unloading"
    {% else %}
        # ══ Idle state -> Warning only ══
        RESPOND TYPE=error MSG="[Runout Handler] T{TOOL} {SENSOR} transition - standby (warning only, mode: {detected_mode})"
        M117 T{TOOL} filament warning
    {% endif %}

#####################################################################
#  Lane Mode Detection Macros (Auto-Detection System)
#####################################################################

[gcode_macro _BT_DETECT_LANE_MODE]
description: Auto-detect and set filament mode for the specified lane
# Internal macro - called by _BT_DETECT_ALL_LANES
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set manual_mode = vars["lane_mode_" ~ LANE] %}

    {% if manual_mode != "auto" %}
        # ══ Manual mode override ══
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=detected_mode_{LANE} VALUE='"{manual_mode}"'
        RESPOND MSG="Lane {LANE}: Manual mode override -> {manual_mode|upper}"
    {% else %}
        # ══ Auto-detection logic ══
        {% set prep_sensor = "filament_switch_sensor bt_lane" ~ LANE ~ "_prep" %}
        {% set entry_sensor = "filament_switch_sensor T" ~ LANE ~ "_runout_entry" %}

        {% set prep_detected = printer[prep_sensor].filament_detected if printer[prep_sensor] is defined else false %}
        {% set entry_detected = printer[entry_sensor].filament_detected if printer[entry_sensor] is defined else false %}

        {% if prep_detected %}
            # ══ bt mode: BoxTurtle prep sensor detected ══
            SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=detected_mode_{LANE} VALUE='"bt"'
            RESPOND MSG="Lane {LANE}: Auto-detected -> BT mode (prep sensor triggered)"
        {% elif entry_detected %}
            # ══ direct mode: G2SA entry sensor detected (no prep) ══
            SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=detected_mode_{LANE} VALUE='"direct"'
            RESPOND MSG="Lane {LANE}: Auto-detected -> DIRECT mode (entry sensor only)"
        {% else %}
            # ══ empty: Neither detected ══
            SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=detected_mode_{LANE} VALUE='"empty"'
            RESPOND MSG="Lane {LANE}: Auto-detected -> EMPTY (no sensors triggered)"
        {% endif %}
    {% endif %}

[gcode_macro _BT_DETECT_ALL_LANES]
description: Auto-detect filament modes for all lanes (called in PRINT_START)
gcode:
    RESPOND MSG="BoxTurtle: ═══════════════════════════════════════"
    RESPOND MSG="BoxTurtle: Detecting all lane modes..."
    RESPOND MSG="BoxTurtle: ═══════════════════════════════════════"

    {% for i in range(6) %}
        _BT_DETECT_LANE_MODE LANE={i}
    {% endfor %}

    RESPOND MSG="BoxTurtle: Mode detection complete"
    RESPOND MSG="BoxTurtle: ═══════════════════════════════════════"

    # Persist detection results to disk
    _BT_SAVE_STATE

#####################################################################
#  Manual Lane Mode Control Macro
#####################################################################

[gcode_macro BT_SET_LANE_MODE]
description: Manually set filament mode per lane
# Usage: BT_SET_LANE_MODE LANE=0 MODE=auto    # Return to auto-detection
#        BT_SET_LANE_MODE LANE=0 MODE=bt      # Force BoxTurtle
#        BT_SET_LANE_MODE LANE=0 MODE=direct  # Force Direct Feed
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set MODE = params.MODE|default("auto")|string %}
    {% set valid_modes = ["auto", "bt", "direct"] %}

    {% if LANE < 0 or LANE > 5 %}
        RESPOND TYPE=error MSG="BoxTurtle: Invalid lane {LANE} (valid range: 0~5)"
    {% elif MODE not in valid_modes %}
        RESPOND TYPE=error MSG="BoxTurtle: Invalid mode {MODE} (auto/bt/direct)"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=lane_mode_{LANE} VALUE='"{MODE}"'
        RESPOND MSG="BoxTurtle: Lane {LANE} mode set -> {MODE|upper}"
        # Immediately update detection + save to disk
        _BT_DETECT_LANE_MODE LANE={LANE}
        _BT_SAVE_STATE
    {% endif %}

#####################################################################
#  Synchronization Control Macros (Mode-Aware)
#####################################################################

# ─── Lane <-> Extruder Mapping Table ───
#   Lane 0: bt_lane0 <-> extruder
#   Lane 1: bt_lane1 <-> extruder1
#   Lane 2: bt_lane2 <-> extruder2
#   Lane 3: bt_lane3 <-> extruder3
#   Lane 4: bt_lane4 <-> extruder4
#   Lane 5: bt_lane5 <-> extruder5

[gcode_macro BT_SYNC]
description: Synchronize BoxTurtle lane to its corresponding toolhead extruder (bt mode only)
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set detected_mode = vars["detected_mode_" ~ LANE] %}
    {% set extruder_names = {0: "extruder", 1: "extruder1", 2: "extruder2", 3: "extruder3", 4: "extruder4", 5: "extruder5"} %}
    {% set lane_names = {0: "bt_lane0", 1: "bt_lane1", 2: "bt_lane2", 3: "bt_lane3", 4: "bt_lane4", 5: "bt_lane5"} %}

    {% if LANE not in extruder_names %}
        RESPOND TYPE=error MSG="BoxTurtle: Invalid lane number {LANE} (0~5)"
    {% elif detected_mode == "empty" %}
        RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} is empty - skipping sync"
    {% elif detected_mode == "direct" %}
        RESPOND MSG="BoxTurtle: Lane {LANE} in DIRECT mode - skipping sync (G2SA independent drive)"
    {% else %}
        # bt mode: normal synchronization
        SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE={extruder_names[LANE]}
        RESPOND MSG="BoxTurtle: Lane {LANE} -> {extruder_names[LANE]} synchronized (BT mode)"
    {% endif %}

[gcode_macro BT_UNSYNC]
description: Unsynchronize BoxTurtle lane (stops BoxTurtle motor, G2SA operates independently)
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set lane_names = {0: "bt_lane0", 1: "bt_lane1", 2: "bt_lane2", 3: "bt_lane3", 4: "bt_lane4", 5: "bt_lane5"} %}
    {% if LANE in lane_names %}
        SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE=
        RESPOND MSG="BoxTurtle: Lane {LANE} unsynchronized"
    {% else %}
        RESPOND TYPE=error MSG="BoxTurtle: Invalid lane number {LANE} (0~5)"
    {% endif %}

[gcode_macro BT_SYNC_ALL]
description: Synchronize all lanes in BT mode (called at print start)
gcode:
    {% set vars = printer["gcode_macro _BT_VARS"] %}

    RESPOND MSG="BoxTurtle: Synchronizing BT-mode lanes..."
    {% for i in range(6) %}
        {% if vars["detected_mode_" ~ i] == "bt" %}
            BT_SYNC LANE={i}
        {% endif %}
    {% endfor %}
    RESPOND MSG="BoxTurtle: Selected lanes synchronized (dual-drive active)"

[gcode_macro BT_UNSYNC_ALL]
description: Unsynchronize all lanes
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=bt_lane0 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=bt_lane1 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=bt_lane2 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=bt_lane3 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=bt_lane4 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=bt_lane5 MOTION_QUEUE=
    RESPOND MSG="BoxTurtle: All lanes unsynchronized"

#####################################################################
#  Filament Loading Macro (Mode-Branching)
#####################################################################

[gcode_macro BT_LOAD]
description: Load filament from the specified lane to its toolhead (auto-branches by mode)
# Usage: BT_LOAD LANE=0              (loads using auto-detected mode)
#        BT_LOAD LANE=0 TPU=1        (flexible filament)
#        BT_LOAD LANE=0 TEMP=210     (heat to specific temp before loading)
#
# Behavior:
#  - "bt" mode: Sync + Bowden tube load + hotend load + purge
#  - "direct" mode: No sync, G2SA slow load only (50mm @ 300mm/min) + purge
#  - "empty" mode: Error (no filament)
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set TPU = params.TPU|default(0)|int %}
    {% set TEMP = params.TEMP|default(0)|int %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set detected_mode = vars["detected_mode_" ~ LANE] %}
    {% set bowden_lengths = {0: vars.bowden_length_0, 1: vars.bowden_length_1,
                             2: vars.bowden_length_2, 3: vars.bowden_length_3,
                             4: vars.bowden_length_4, 5: vars.bowden_length_5} %}
    {% set extruder_names = {0: "extruder", 1: "extruder1", 2: "extruder2",
                             3: "extruder3", 4: "extruder4", 5: "extruder5"} %}
    {% set lane_names = {0: "bt_lane0", 1: "bt_lane1", 2: "bt_lane2",
                         3: "bt_lane3", 4: "bt_lane4", 5: "bt_lane5"} %}
    {% set heater_names = {0: "extruder", 1: "extruder1", 2: "extruder2",
                           3: "extruder3", 4: "extruder4", 5: "extruder5"} %}

    {% set bowden = bowden_lengths[LANE] %}
    {% set fast_speed = vars.tpu_load_speed if TPU else vars.load_speed_fast %}
    {% set slow_speed = vars.tpu_load_speed if TPU else vars.load_speed_slow %}
    {% set hotend_dist = vars.hotend_load_distance %}
    {% set purge = vars.hotend_purge %}
    {% set min_temp = vars.min_load_temp %}

    # ── Temperature Check ──
    {% set current_temp = printer[heater_names[LANE]].temperature|default(0) %}
    {% set target_temp = [ (TEMP if TEMP > 0 else min_temp), min_temp ]|max %}

    {% if detected_mode == "empty" %}
        RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} is empty - cannot load"
        M117 BT: Lane {LANE} EMPTY!
    {% else %}
        RESPOND MSG="BoxTurtle: Starting Lane {LANE} load{' (TPU mode)' if TPU else ''} ({detected_mode|upper} mode)..."
        M117 BT: Lane {LANE} Loading...

        {% if current_temp < target_temp - 2 %}
            RESPOND MSG="BoxTurtle: Hotend temperature too low ({current_temp|round(1)}°C < {min_temp}°C)"
            RESPOND MSG="BoxTurtle: Heating to {target_temp}°C..."
            SET_HEATER_TEMPERATURE HEATER={heater_names[LANE]} TARGET={target_temp}
            TEMPERATURE_WAIT SENSOR={heater_names[LANE]} MINIMUM={target_temp - 2}
            RESPOND MSG="BoxTurtle: Hotend heating complete, proceeding with load"
        {% endif %}

        # ── State transition: idle -> loading ──
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=state VALUE='"loading"'
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=active_lane VALUE={LANE}

        SAVE_GCODE_STATE NAME=BT_LOAD_STATE

        # 1. Activate corresponding extruder
        ACTIVATE_EXTRUDER EXTRUDER={extruder_names[LANE]}

        {% if detected_mode == "bt" %}
            # ════════════════════════════════════════════════
            #  BT Mode: Bowden tube load + hotend load (synchronized)
            # ════════════════════════════════════════════════

            # 2. Synchronize BoxTurtle motor to extruder
            SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE={extruder_names[LANE]}

            # 3. Fast load through Bowden tube
            G92 E0
            G1 E{bowden} F{fast_speed}

            # 4. Slow load into hotend
            G1 E{hotend_dist} F{slow_speed}
            G92 E0

        {% else %}
            # ════════════════════════════════════════════════
            #  DIRECT Mode: G2SA load only (unsynchronized)
            # ════════════════════════════════════════════════

            # 2. Do not synchronize (BoxTurtle remains stopped)
            RESPOND MSG="BoxTurtle: Lane {LANE} DIRECT mode - bypassing BoxTurtle, loading with G2SA only"

            # 3. Slow load with G2SA only
            G92 E0
            G1 E{hotend_dist} F{slow_speed}
            G92 E0

        {% endif %}

        # 5. Sensor-based load verification
        {% set entry_sensor = "filament_switch_sensor T" ~ LANE ~ "_runout_entry" %}
        {% set th_sensor = "filament_switch_sensor T" ~ LANE ~ "_runout_toolhead" %}
        {% if printer[entry_sensor] is defined and printer[th_sensor] is defined %}
            {% if printer[entry_sensor].filament_detected and printer[th_sensor].filament_detected %}
                RESPOND MSG="BoxTurtle: Lane {LANE} G2SA sensors verified OK (entry + toolhead detected)"
            {% elif printer[entry_sensor].filament_detected %}
                RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} toolhead sensor not triggered - filament did not reach hotend"
                RESPOND MSG="BoxTurtle: Attempting additional 20mm slow feed..."
                G1 E20 F{slow_speed}
                G92 E0
            {% else %}
                RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} entry sensor not triggered! Load may have failed - check manually"
                M117 BT: Lane {LANE} LOAD FAIL!
            {% endif %}
        {% endif %}

        RESTORE_GCODE_STATE NAME=BT_LOAD_STATE

        # 6. Move to purge bucket to purge + wipe nozzle
        PURGE_NOZZLE AMOUNT={purge}

        # ── State transition: loading -> idle ──
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=state VALUE='"idle"'
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=active_lane VALUE={-1}

        RESPOND MSG="BoxTurtle: Lane {LANE} load + purge complete ({detected_mode|upper} mode, state: idle)"
        M117 BT: Lane {LANE} Ready

        # Save completed load state to disk
        _BT_SAVE_STATE

    {% endif %}

[gcode_macro BT_UNLOAD]
description: Unload filament from the specified lane's toolhead (auto-branches by mode)
# Usage: BT_UNLOAD LANE=0              (unloads using auto-detected mode)
#        BT_UNLOAD LANE=0 TPU=1        (flexible filament)
#        BT_UNLOAD LANE=0 NOCUT=1      (skip LeafCutter)
#        BT_UNLOAD LANE=0 TEMP=200     (specific temperature)
#
# Behavior:
#  - "bt" mode: Tip forming / cut + Bowden tube retract (synchronized)
#  - "direct" mode: Tip forming / cut + short retract (50mm @ 3000mm/min, unsynchronized)
#  - "empty" mode: Error
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set TPU = params.TPU|default(0)|int %}
    {% set NOCUT = params.NOCUT|default(0)|int %}
    {% set TEMP = params.TEMP|default(0)|int %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set detected_mode = vars["detected_mode_" ~ LANE] %}
    {% set bowden_lengths = {0: vars.bowden_length_0, 1: vars.bowden_length_1,
                             2: vars.bowden_length_2, 3: vars.bowden_length_3,
                             4: vars.bowden_length_4, 5: vars.bowden_length_5} %}
    {% set extruder_names = {0: "extruder", 1: "extruder1", 2: "extruder2",
                             3: "extruder3", 4: "extruder4", 5: "extruder5"} %}
    {% set lane_names = {0: "bt_lane0", 1: "bt_lane1", 2: "bt_lane2",
                         3: "bt_lane3", 4: "bt_lane4", 5: "bt_lane5"} %}
    {% set heater_names = {0: "extruder", 1: "extruder1", 2: "extruder2",
                           3: "extruder3", 4: "extruder4", 5: "extruder5"} %}

    {% set bowden = bowden_lengths[LANE] %}
    {% set fast_speed = vars.tpu_unload_speed if TPU else vars.unload_speed %}
    {% set slow_speed = vars.tpu_unload_speed if TPU else vars.load_speed_slow %}
    {% set hotend_dist = vars.hotend_load_distance %}
    {% set min_temp = vars.min_unload_temp %}
    {% set use_cutter = vars.use_leafcutter and not NOCUT %}

    # ── Temperature Check ──
    {% set current_temp = printer[heater_names[LANE]].temperature|default(0) %}
    {% set target_temp = [ (TEMP if TEMP > 0 else min_temp), min_temp ]|max %}

    {% if detected_mode == "empty" %}
        RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} is empty - cannot unload"
        M117 BT: Lane {LANE} EMPTY!
    {% else %}
        RESPOND MSG="BoxTurtle: Starting Lane {LANE} unload{' (TPU)' if TPU else ''}{' (LeafCutter)' if use_cutter else ' (Tip Forming)'} ({detected_mode|upper} mode)..."
        M117 BT: Lane {LANE} Unloading...

        {% if current_temp < target_temp - 2 %}
            RESPOND MSG="BoxTurtle: Hotend temperature too low ({current_temp|round(1)}°C < {min_temp}°C)"
            RESPOND MSG="BoxTurtle: Heating to {target_temp}°C..."
            SET_HEATER_TEMPERATURE HEATER={heater_names[LANE]} TARGET={target_temp}
            TEMPERATURE_WAIT SENSOR={heater_names[LANE]} MINIMUM={target_temp - 2}
            RESPOND MSG="BoxTurtle: Hotend heating complete"
        {% endif %}

        # ── State transition: idle -> unloading ──
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=state VALUE='"unloading"'
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=active_lane VALUE={LANE}

        SAVE_GCODE_STATE NAME=BT_UNLOAD_STATE

        # 1. Activate corresponding extruder
        ACTIVATE_EXTRUDER EXTRUDER={extruder_names[LANE]}

        {% if detected_mode == "bt" %}
            # ════════════════════════════════════════════════
            #  BT Mode: Tip forming / cut + Bowden tube retract (synchronized)
            # ════════════════════════════════════════════════

            # 2. Synchronize BoxTurtle <-> G2SA
            SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE={extruder_names[LANE]}

            {% if use_cutter %}
                # Path A: LeafCutter cut
                G92 E0
                G1 E-{vars.pre_cut_retract} F{slow_speed}
                G92 E0
                CUT_FILAMENT
                G92 E0
                G1 E-{hotend_dist + bowden + vars.post_cut_extra} F{fast_speed}
                G92 E0
            {% elif TPU %}
                # Path B: TPU (no tip forming)
                G92 E0
                G1 E-{hotend_dist} F{slow_speed}
                G1 E-{bowden + vars.post_cut_extra} F{fast_speed}
                G92 E0
            {% else %}
                # Path C: Tip forming then retract
                G92 E0
                {% for i in range(vars.tip_form_count) %}
                    G1 E-{vars.tip_retract_dist} F{vars.tip_retract_speed}
                    G1 E{vars.tip_push_dist} F{vars.tip_push_speed}
                {% endfor %}
                {% for i in range(vars.tip_cooling_moves) %}
                    G1 E-{vars.tip_cooling_dist} F{vars.tip_cooling_speed}
                    G1 E{vars.tip_cooling_dist} F{vars.tip_cooling_speed}
                {% endfor %}
                G4 P{vars.tip_pause_ms}
                G1 E-{vars.tip_final_retract} F{vars.tip_final_speed}
                G1 E-{hotend_dist + bowden + vars.post_cut_extra} F{fast_speed}
                G92 E0
            {% endif %}

            # Unsynchronize
            SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE=

            # Sensor-based verification (prep sensor: before BT motor)
            # Filament should still be present at prep sensor upon unload completion
            {% set prep_sensor = "filament_switch_sensor bt_lane" ~ LANE ~ "_prep" %}
            {% if printer[prep_sensor] is defined %}
                {% if printer[prep_sensor].filament_detected %}
                    RESPOND MSG="BoxTurtle: Lane {LANE} prep sensor verified OK (filament returned to loader)"
                {% else %}
                    RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} prep sensor not triggered! Attempting additional retract..."
                    M117 BT: Lane {LANE} Retry retract...
                    ACTIVATE_EXTRUDER EXTRUDER={extruder_names[LANE]}
                    G92 E0
                    G1 E-50 F{fast_speed}
                    G92 E0
                    {% if not printer[prep_sensor].filament_detected %}
                        RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} unload may have failed - check manually!"
                        M117 BT: Lane {LANE} UNLOAD FAIL!
                    {% else %}
                        RESPOND MSG="BoxTurtle: Lane {LANE} prep sensor triggered after additional retract OK"
                    {% endif %}
                {% endif %}
            {% else %}
                RESPOND MSG="BoxTurtle: Lane {LANE} no prep sensor - distance-based unload complete"
            {% endif %}

        {% else %}
            # ════════════════════════════════════════════════════════════════
            #  DIRECT Mode: Tip forming / cut + retract -> Manual removal by user
            # ════════════════════════════════════════════════════════════════

            RESPOND MSG="BoxTurtle: Lane {LANE} DIRECT mode - manual removal after retract"

            {% if use_cutter %}
                # LeafCutter cut
                G92 E0
                G1 E-{vars.pre_cut_retract} F{slow_speed}
                G92 E0
                CUT_FILAMENT
                G92 E0
                G1 E-{vars.post_cut_extra} F{fast_speed}
                G92 E0
            {% elif TPU %}
                # TPU: Simple retract
                G92 E0
                G1 E-{vars.post_cut_extra} F{fast_speed}
                G92 E0
            {% else %}
                # Tip forming
                G92 E0
                {% for i in range(vars.tip_form_count) %}
                    G1 E-{vars.tip_retract_dist} F{vars.tip_retract_speed}
                    G1 E{vars.tip_push_dist} F{vars.tip_push_speed}
                {% endfor %}
                {% for i in range(vars.tip_cooling_moves) %}
                    G1 E-{vars.tip_cooling_dist} F{vars.tip_cooling_speed}
                    G1 E{vars.tip_cooling_dist} F{vars.tip_cooling_speed}
                {% endfor %}
                G4 P{vars.tip_pause_ms}
                G1 E-{vars.tip_final_retract} F{vars.tip_final_speed}
                G1 E-{vars.post_cut_extra} F{fast_speed}
                G92 E0
            {% endif %}

            # ── Prompt user to remove filament (Bambu AMS style) ──
            M300 S1000 P300                # Beep
            M300 S1500 P200
            RESPOND MSG="╔══════════════════════════════════════════════╗"
            RESPOND MSG="║  Please pull out T{LANE} filament!               ║"
            RESPOND MSG="║  Remove filament by hand.                    ║"
            RESPOND MSG="╚══════════════════════════════════════════════╝"
            M117 T{LANE}: Pull filament out!

        {% endif %}

        # ── State transition: unloading -> idle ──
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=state VALUE='"idle"'
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=active_lane VALUE={-1}

        # Unload complete -> set lane mode to "empty"
        SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=detected_mode_{LANE} VALUE='"empty"'

        RESPOND MSG="BoxTurtle: Lane {LANE} unload complete ({detected_mode|upper} mode, state: idle)"
        M117 BT: Lane {LANE} Unloaded

        # Save completed unload state to disk
        _BT_SAVE_STATE

        RESTORE_GCODE_STATE NAME=BT_UNLOAD_STATE

    {% endif %}

#####################################################################
#  Batch Load / Unload Macros
#####################################################################

[gcode_macro BT_LOAD_ALL]
description: Load all lanes that have filament present (auto-branches by mode)
gcode:
    {% set TPU = params.TPU|default(0)|int %}
    RESPOND MSG="BoxTurtle: ===== Starting Batch Load for All Lanes ====="
    BT_LOAD LANE=0 TPU={TPU}
    BT_LOAD LANE=1 TPU={TPU}
    BT_LOAD LANE=2 TPU={TPU}
    BT_LOAD LANE=3 TPU={TPU}
    BT_LOAD LANE=4 TPU={TPU}
    BT_LOAD LANE=5 TPU={TPU}
    RESPOND MSG="BoxTurtle: ===== Batch Load Complete (Processed by Mode) ====="

[gcode_macro BT_UNLOAD_ALL]
description: Unload all lanes that have filament present (auto-branches by mode)
gcode:
    {% set TPU = params.TPU|default(0)|int %}
    RESPOND MSG="BoxTurtle: ===== Starting Batch Unload for All Lanes ====="
    BT_UNLOAD LANE=5 TPU={TPU}
    BT_UNLOAD LANE=4 TPU={TPU}
    BT_UNLOAD LANE=3 TPU={TPU}
    BT_UNLOAD LANE=2 TPU={TPU}
    BT_UNLOAD LANE=1 TPU={TPU}
    BT_UNLOAD LANE=0 TPU={TPU}
    RESPOND MSG="BoxTurtle: ===== Batch Unload Complete (Processed by Mode) ====="

#####################################################################
#  TPU Mode Toggle Macros
#####################################################################

[gcode_macro BT_TPU_ON]
description: Enable TPU / flexible mode (slower speeds + continuous sync)
gcode:
    SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=tpu_mode VALUE=True
    # Synchronize BT-mode lanes
    BT_SYNC_ALL
    RESPOND MSG="BoxTurtle: TPU mode ON - BT-mode lanes kept synchronized, slower speeds applied"

[gcode_macro BT_TPU_OFF]
description: Disable TPU mode (restore normal speeds)
gcode:
    SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=tpu_mode VALUE=False
    RESPOND MSG="BoxTurtle: TPU mode OFF - normal speeds restored"

#####################################################################
#  Status Check Macro (Displays Modes)
#####################################################################

[gcode_macro BT_STATUS]
description: Check status of all BoxTurtle lanes (filament path + mode + sync)
gcode:
    {% set lane_names = ["bt_lane0", "bt_lane1", "bt_lane2", "bt_lane3", "bt_lane4", "bt_lane5"] %}
    {% set ext_names = ["extruder", "extruder1", "extruder2", "extruder3", "extruder4", "extruder5"] %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}

    # Filament path order:
    # Spool -> [BT Prep] -> BT Motor -> PTFE Tube -> [Pre-G2SA] -> G2SA Gear -> [Post-G2SA] -> Hotend
    # Sensor topology: 1 loader (prep) + 2 toolhead (entry, toolhead) = 3 total / filament
    RESPOND MSG="╔══════════════════════════════════════════════════════════════════╗"
    RESPOND MSG="║  BoxTurtle Status  STATE:{vars.state|upper}  TPU:{'ON ' if vars.tpu_mode else 'OFF'}  Cutter:{'ON ' if vars.use_leafcutter else 'OFF'}    ║"
    RESPOND MSG="║  Active Lane: {'T' ~ vars.active_lane if vars.active_lane >= 0 else 'None'}                                              ║"
    RESPOND MSG="╠══════════════════════════════════════════════════════════════════╣"
    RESPOND MSG="║ Lane │BTPrp│ MODE  │ ->G2SA│ G2SA->│ SYNC │ TEMP             ║"
    RESPOND MSG="║      │(prp)│ (det) │ entry │ toolhd│      │                  ║"
    RESPOND MSG="╠══════════════════════════════════════════════════════════════════╣"
    {% for i in range(6) %}
        {% set prep_name = "bt_lane" ~ i ~ "_prep" %}
        {% set entry_name = "T" ~ i ~ "_runout_entry" %}
        {% set detected = vars["detected_mode_" ~ i] %}
        {% if printer["filament_switch_sensor " ~ prep_name] is defined %}
            {% set prep_ok = printer["filament_switch_sensor " ~ prep_name].filament_detected %}
        {% else %}
            {% set prep_ok = false %}
        {% endif %}

        {% if printer["filament_switch_sensor " ~ entry_name] is defined %}
            {% set entry_ok = printer["filament_switch_sensor " ~ entry_name].filament_detected %}
        {% else %}
            {% set entry_ok = false %}
        {% endif %}

        {% set th_name = "T" ~ i ~ "_runout_toolhead" %}
        {% if printer["filament_switch_sensor " ~ th_name] is defined %}
            {% set th_ok = printer["filament_switch_sensor " ~ th_name].filament_detected %}
        {% else %}
            {% set th_ok = false %}
        {% endif %}

        {% if printer["extruder_stepper " ~ lane_names[i]] is defined %}
            {% set synced = printer["extruder_stepper " ~ lane_names[i]].motion_queue is not none %}
        {% else %}
            {% set synced = false %}
        {% endif %}
        {% set temp = printer[ext_names[i]].temperature|default(0)|round(0)|int if printer[ext_names[i]] is defined else 0 %}
        {% set mode_str = detected[:6].center(6) %}
        RESPOND MSG="║  T{i}  │  {'●' if prep_ok else '○'}  │{mode_str}│  {'●' if entry_ok else '○'}   │  {'●' if th_ok else '○'}   │ {'SYNC' if synced else '    '} │ {temp}°C  ║"
    {% endfor %}
    RESPOND MSG="╠══════════════════════════════════════════════════════════════════╣"
    RESPOND MSG="║  ● Detected  ○ Not Detected                                      ║"
    RESPOND MSG="║  MODE: BT=BoxTurtle, DIR=Direct Feed, EMP=Empty                  ║"
    RESPOND MSG="║  BTPrp=Spool->Loader, ->G2SA=entry, G2SA->=toolhead              ║"
    RESPOND MSG="╚══════════════════════════════════════════════════════════════════╝"

#####################################################################
#  Print Start / End Macros (Mode-Aware)
#####################################################################

[gcode_macro BT_PRINT_START]
description: Prepare BoxTurtle before print start (detect lanes + sync BT-mode lanes only)
gcode:
    {% set TPU = params.TPU|default(0)|int %}

    # 1. Detect all lane modes
    _BT_DETECT_ALL_LANES

    # 2. Enable TPU mode (if needed)
    {% if TPU %}
        BT_TPU_ON
    {% endif %}

    # 3. Synchronize only lanes in BT mode (DIRECT mode lanes are skipped)
    BT_SYNC_ALL

    # ── State transition: idle -> printing ──
    SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=state VALUE='"printing"'
    SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=active_lane VALUE={-1}
    RESPOND MSG="BoxTurtle: Print ready - BT-mode lane synchronization active (state: printing)"

[gcode_macro BT_PRINT_END]
description: Clean up BoxTurtle after print completion
gcode:
    {% set RETRACT = params.RETRACT|default(0)|int %}

    # ── State transition: printing -> idle ──
    SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=state VALUE='"idle"'
    SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=active_lane VALUE={-1}

    {% if RETRACT %}
        # Unload all filaments (optional)
        BT_UNLOAD_ALL
    {% else %}
        # Unsync only (leave filament loaded in toolheads)
        BT_UNSYNC_ALL
    {% endif %}

    BT_TPU_OFF
    RESPOND MSG="BoxTurtle: Print end cleanup complete (state: idle)"

#####################################################################
#  Calibration Macros
#####################################################################

[gcode_macro BT_CALIBRATE_BOWDEN]
description: Calibrate Bowden tube length (manual, BT mode only)
# Usage:
# 1. Push filament by hand up to the BoxTurtle exit
# 2. Run BT_CALIBRATE_BOWDEN LANE=0
# 3. Advance in 10mm increments until filament reaches the toolhead sensor
# 4. Total distance traveled = bowden_length
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set DIST = params.DIST|default(10)|float %}
    {% set SPEED = params.SPEED|default(300)|int %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set detected_mode = vars["detected_mode_" ~ LANE] %}
    {% set extruder_names = {0: "extruder", 1: "extruder1", 2: "extruder2",
                             3: "extruder3", 4: "extruder4", 5: "extruder5"} %}
    {% set lane_names = {0: "bt_lane0", 1: "bt_lane1", 2: "bt_lane2",
                         3: "bt_lane3", 4: "bt_lane4", 5: "bt_lane5"} %}

    {% if detected_mode != "bt" %}
        RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} is not in BT mode - cannot calibrate (current: {detected_mode|upper})"
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER={extruder_names[LANE]}
        SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE={extruder_names[LANE]}

        G92 E0
        G1 E{DIST} F{SPEED}
        G92 E0

        RESPOND MSG="BoxTurtle: Lane {LANE} -> advanced {DIST}mm. Repeat until toolhead sensor is reached."
    {% endif %}

#####################################################################
#  Tension Management
#####################################################################
#
#  * Problem: When synchronizing two motors via SYNC_EXTRUDER_MOTION,
#    both motors attempt to feed the exact same filament length for a given E move.
#    In practice, minor differences in rotation_distance, grip force, and PTFE
#    friction can build up tension or slack inside the Bowden tube.
#
#  * 4-Stage Solution Strategy:
#
#  [Stage 1] Precision Calibration (Mandatory!)
#      -> Measure actual rotation_distance per lane using BT_CALIBRATE_ROTATION
#      -> Calibrate G2SA independently as well
#      -> Matching both ends accurately minimizes tension buildup
#
#  [Stage 2] TPU Over-Push Offset
#      -> Intentionally set BoxTurtle rotation_distance slightly lower
#      -> For an E10 command, BoxTurtle pushes 10.15mm while G2SA pulls 10.00mm
#      -> Maintains positive pressure inside PTFE tube -> prevents TPU buckling
#      -> Use BT_CALC_TPU_OFFSET to compute the target RD
#
#  [Stage 3] TurtleNeck Physical Buffer (Optional, Recommended)
#      -> Install spring-loaded buffer between BoxTurtle exit and PTFE tube
#      -> Spring mechanically absorbs minor feed rate differences
#      -> advance/trailing sensors detect extreme compression/extension as a safety guard
#
#  [Stage 4] TMC2209 Load Monitoring (Diagnostics)
#      -> Check motor load per lane using BT_CHECK_TENSION
#      -> Low SG_RESULT = high mechanical resistance = excessive tension or jam

#####################################################################
#  [Stage 1] Precision rotation_distance Calibration
#####################################################################

[gcode_macro BT_CALIBRATE_ROTATION]
description: Calibrate BoxTurtle extruder rotation_distance (BT mode only)
# Usage:
#   1. Unsync and drive BoxTurtle motor independently
#   2. Mark filament at 120mm before the BoxTurtle entry
#   3. Run BT_CALIBRATE_ROTATION LANE=0 -> advances 100mm
#   4. Measure remaining distance to mark (ideal: 20mm)
#   5. Actual extruded length = 120 - remaining_distance
#   6. New rotation_distance = current_value * (100 / actual_extruded)
#   7. Update rotation_distance in [extruder_stepper bt_laneN]
#   8. Update calibrated_rd_N in _BT_VARS as well
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set DIST = params.DIST|default(100)|float %}
    {% set SPEED = params.SPEED|default(300)|int %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set detected_mode = vars["detected_mode_" ~ LANE] %}
    {% set extruder_names = {0: "extruder", 1: "extruder1", 2: "extruder2",
                             3: "extruder3", 4: "extruder4", 5: "extruder5"} %}
    {% set lane_names = {0: "bt_lane0", 1: "bt_lane1", 2: "bt_lane2",
                         3: "bt_lane3", 4: "bt_lane4", 5: "bt_lane5"} %}
    {% set rd = printer.configfile.settings["extruder_stepper " ~ lane_names[LANE]].rotation_distance %}

    {% if detected_mode != "bt" %}
        RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} is not in BT mode - cannot calibrate"
    {% else %}
        RESPOND MSG="══════════════════════════════════════════════════"
        RESPOND MSG="  BoxTurtle Lane {LANE} rotation_distance Calibration"
        RESPOND MSG="══════════════════════════════════════════════════"
        RESPOND MSG="  Current rotation_distance: {rd}"
        RESPOND MSG="  Requested advance distance: {DIST}mm"
        RESPOND MSG=""
        RESPOND MSG="  > Before starting: Mark filament at {DIST + 20}mm"
        RESPOND MSG="    (measured from BoxTurtle entry)"
        RESPOND MSG="══════════════════════════════════════════════════"

        # Unsync then drive independently
        SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE=
        ACTIVATE_EXTRUDER EXTRUDER={extruder_names[LANE]}
        SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE={extruder_names[LANE]}

        G92 E0
        G1 E{DIST} F{SPEED}
        G92 E0

        # Unsync again
        SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE=

        RESPOND MSG=""
        RESPOND MSG="══════════════════════════════════════════════════"
        RESPOND MSG="  > Advance complete! Measure the remaining distance."
        RESPOND MSG=""
        RESPOND MSG="  Formula:"
        RESPOND MSG="    Actual extruded = {DIST + 20} - remaining(mm)"
        RESPOND MSG="    New RD = {rd} * ({DIST} / actual_extruded)"
        RESPOND MSG=""
        RESPOND MSG="  Example: remaining 22mm -> actual extruded = {DIST + 20 - 22}"
        RESPOND MSG="    New RD = {rd} * ({DIST} / {DIST + 20 - 22}) = {'%.3f' % (rd * DIST / (DIST + 20 - 22))}"
        RESPOND MSG=""
        RESPOND MSG="  Update rotation_distance under [extruder_stepper bt_lane{LANE}]"
        RESPOND MSG="  in boxturtle.cfg with the calculated result."
        RESPOND MSG="══════════════════════════════════════════════════"
    {% endif %}

#####################################################################
#  [Stage 2] TPU Over-Push Offset Calculator
#####################################################################

[gcode_macro BT_CALC_TPU_OFFSET]
description: Calculate rotation_distance for TPU over-push (informational display)
gcode:
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set offset = vars.tpu_push_percent %}

    RESPOND MSG="══════════════════════════════════════════════════════"
    RESPOND MSG="  TPU Over-Push rotation_distance Calculator"
    RESPOND MSG="  Current offset: {offset}% (BoxTurtle pushes {offset}% extra)"
    RESPOND MSG="══════════════════════════════════════════════════════"
    RESPOND MSG=""
    {% for i in range(6) %}
        {% set cal_rd_key = "calibrated_rd_" ~ i %}
        {% set cal_rd = vars[cal_rd_key] %}
        {% set tpu_rd = cal_rd * (100.0 - offset) / 100.0 %}
        RESPOND MSG="  Lane {i}: Calibrated RD = {cal_rd}"
        RESPOND MSG="          TPU RD = {'%.4f' % tpu_rd} (enter this in config)"
    {% endfor %}
    RESPOND MSG=""
    RESPOND MSG="══════════════════════════════════════════════════════"
    RESPOND MSG="  > For TPU: Update rotation_distance in boxturtle.cfg"
    RESPOND MSG="    to the TPU RD value above."
    RESPOND MSG="  > For rigid filaments: Restore the calibrated RD value."
    RESPOND MSG=""
    RESPOND MSG="  * To change offset: SET_GCODE_VARIABLE MACRO=_BT_VARS"
    RESPOND MSG="    VARIABLE=tpu_push_percent VALUE=2.0"
    RESPOND MSG="══════════════════════════════════════════════════════"

#####################################################################
#  [Stage 3] TurtleNeck Physical Buffer (Optional)
#####################################################################
#
#  Uncomment the sensor definitions below if a TurtleNeck buffer is installed.
#  The buffer's advance and trailing sensors act as safety guards to detect
#  extreme compression or tension.
#
#  Physical layout:
#  ┌─────────┐   ┌──────────────────┐   ┌──────────┐
#  │BoxTurtle├──>│ TurtleNeck Buffer├──>│PTFE Tube │──> Toolhead
#  │ Exit    │   │ [Spring + Guide] │   │ (~900mm) │
#  └─────────┘   │ <-trailing adv-> │   └──────────┘
#                └──────────────────┘

# [filament_switch_sensor tn_lane0_advance]
# switch_pin: ^octopus:PG7
# pause_on_runout: False
# event_delay: 0.5
# insert_gcode:
#     RESPOND TYPE=error MSG="TurtleNeck Lane 0: Buffer compression warning! BoxTurtle over-feeding"
# runout_gcode:
#     RESPOND MSG="TurtleNeck Lane 0: advance normal"

# [filament_switch_sensor tn_lane0_trailing]
# switch_pin: ^octopus:PE15
# pause_on_runout: False
# event_delay: 0.5
# runout_gcode:
#     RESPOND TYPE=error MSG="TurtleNeck Lane 0: Buffer extension warning! BoxTurtle under-feeding"
# insert_gcode:
#     RESPOND MSG="TurtleNeck Lane 0: trailing normal"

#####################################################################
#  [Stage 4] TMC2209 Load Monitoring (Diagnostics)
#####################################################################

[gcode_macro BT_CHECK_TENSION]
description: Check motor load per lane via TMC2209 SG_RESULT (tension diagnostics)
# SG_RESULT interpretation:
#   High (>200): Low load -> filament slack or not inserted
#   Medium (80~200): Normal range -> proper tension
#   Low (<80): High load -> excessive tension or possible jam
gcode:
    {% set LANE = params.LANE|default(-1)|int %}

    RESPOND MSG="══════════════════════════════════════════"
    RESPOND MSG="  BoxTurtle Motor Load Monitoring"
    RESPOND MSG="══════════════════════════════════════════"

    {% if LANE >= 0 and LANE <= 5 %}
        RESPOND MSG="  Lane {LANE} TMC2209 Status:"
        DUMP_TMC STEPPER="extruder_stepper bt_lane{LANE}"
    {% else %}
        {% for i in range(6) %}
            RESPOND MSG="  Lane {i} TMC2209 Status:"
            DUMP_TMC STEPPER="extruder_stepper bt_lane{i}"
        {% endfor %}
    {% endif %}

    RESPOND MSG="══════════════════════════════════════════"
    RESPOND MSG="  SG_RESULT Reference:"
    RESPOND MSG="    >200: Low load (slack / empty)"
    RESPOND MSG="    80~200: Normal (proper tension)"
    RESPOND MSG="    <80: High load (over-tension / jam)"
    RESPOND MSG="══════════════════════════════════════════"

#####################################################################
#  Tension Utility Macro
#####################################################################

[gcode_macro BT_TENSION_TEST]
description: Extrude a short distance while synchronized to test tension state (BT mode)
# Run only while the hotend is heated!
gcode:
    {% set LANE = params.LANE|default(0)|int %}
    {% set DIST = params.DIST|default(10)|float %}
    {% set SPEED = params.SPEED|default(300)|int %}
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set detected_mode = vars["detected_mode_" ~ LANE] %}
    {% set extruder_names = {0: "extruder", 1: "extruder1", 2: "extruder2",
                             3: "extruder3", 4: "extruder4", 5: "extruder5"} %}
    {% set lane_names = {0: "bt_lane0", 1: "bt_lane1", 2: "bt_lane2",
                         3: "bt_lane3", 4: "bt_lane4", 5: "bt_lane5"} %}

    {% if detected_mode != "bt" %}
        RESPOND TYPE=error MSG="BoxTurtle: Lane {LANE} is not in BT mode - cannot test (current: {detected_mode|upper})"
    {% else %}
        RESPOND MSG="BoxTurtle: Starting Lane {LANE} tension test ({DIST}mm @ F{SPEED})"

        ACTIVATE_EXTRUDER EXTRUDER={extruder_names[LANE]}
        SYNC_EXTRUDER_MOTION EXTRUDER={lane_names[LANE]} MOTION_QUEUE={extruder_names[LANE]}

        G92 E0
        G1 E{DIST} F{SPEED}
        G4 P500

        DUMP_TMC STEPPER="extruder_stepper bt_lane{LANE}"

        G92 E0
        RESPOND MSG="BoxTurtle: Lane {LANE} tension test complete - check SG_RESULT in TMC dump above"
    {% endif %}

