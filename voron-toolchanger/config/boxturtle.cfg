#####################################################################
#  Lane 5 - bt_lane5 <-> T5 (extruder5)
#  * Unassembled spare lane — pins set to Octopus V1.1 MOTOR_5/STOP_5 defaults.
#    Verify and update according to actual wiring after assembly.
#####################################################################

[extruder_stepper bt_lane5]
extruder:                          # Empty = unsynchronized at startup
step_pin: octopus:PC13             # Octopus MOTOR_5
dir_pin: octopus:PF0               # Use !octopus:PF0 if filament direction is inverted
enable_pin: !octopus:PF1
microsteps: 16
