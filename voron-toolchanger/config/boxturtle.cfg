#####################################################################
#  BoxTurtle 5/6-Lane Filament Loader Configuration (OPTIONAL System)
#  Based on BTT Octopus V1.1 (STM32F446)
#  AFC auto-change disabled / Klipper extruder_stepper synchronization mode
#
#  * Hybrid Concept: Optional Filament Loading System (Bambu AMS Style)
#  ─────────────────────────────────────────────────────────
#  Each lane operates in one of two modes:
#
#  1. "bt" (BoxTurtle) mode:
#     Spool -> [BoxTurtle Feeder] -> PTFE Tube -> Toolhead
#     BoxTurtle motor synchronized with G2SA (Dual Drive)
#
#  2. "direct" (Direct Feed) mode:
#     Spool -> Direct -> Toolhead (bypasses BoxTurtle)
#     BoxTurtle inactive, G2SA operates independently
#
#  Sensor configuration (3 sensors per filament path):
#  - bt_lane{N}_prep: BoxTurtle entry (before BT motor) — Octopus
#  - T{N}_runout_entry: Toolhead entry (before G2SA) — SHT36
#  - T{N}_runout_toolhead: Post-toolhead gear (before hotend) — SHT36
#
#  Auto-detection logic:
#  - bt_lane{N}_prep sensor triggered -> "bt" mode
#  - T{N}_runout_entry sensor triggered (no prep) -> "direct" mode
#  - Neither triggered -> "empty" (empty lane)
#
#  Manual mode override:
#  BT_SET_LANE_MODE LANE=0 MODE=auto    # Auto-detect
#  BT_SET_LANE_MODE LANE=0 MODE=bt      # Force BoxTurtle
#  BT_SET_LANE_MODE LANE=0 MODE=direct  # Force Direct Feed
#
#  * Key Features:
#  - Octopus is always connected via USB (included)
#  - boxturtle.cfg is always loaded when enabled
#  - Each lane independently selects its operating mode
#  - Same usability as Bambu AMS (can be used via AMS or direct feed)
#  - Automatically selects path based on detected mode during load/unload
#
#  6 Lanes -> 6 Toolheads Direct Mapping:
#    bt_lane0 <-> extruder  (T0)
#    bt_lane1 <-> extruder1 (T1)
#    bt_lane2 <-> extruder2 (T2)
#    bt_lane3 <-> extruder3 (T3)
#    bt_lane4 <-> extruder4 (T4)
#    bt_lane5 <-> extruder5 (T5)
#
#  * AFC-Klipper-Add-On not required (uses native Klipper features only)
#  * Included in printer.cfg via [include boxturtle.cfg]
#####################################################################

#####################################################################
#  Octopus MCU Configuration
#####################################################################

[mcu octopus]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_REPLACE_WITH_OCTOPUS_ID-if00
restart_method: command

# Octopus V1.1 Klipper firmware menuconfig settings:
# ┌─────────────────────────────────────────────────────┐
# │ [*] Enable extra low-level configuration options    │
# │ Micro-controller Architecture: STMicroelectronics   │
# │ Processor model: STM32F446                          │
# │ Bootloader offset: 32KiB bootloader                 │
# │ Clock Reference: 12 MHz crystal                     │
# │ Communication interface: USB (on PA11/PA12)         │
# └─────────────────────────────────────────────────────┘

#####################################################################
#  Octopus V1.1 Pin Mapping
#####################################################################
#
# Motor Ports (BoxTurtle Feeder Extruders):
# MOTOR_0: step=PF13, dir=PF12, en=!PF14, uart=PC4   -> bt_lane0 (T0)
# MOTOR_1: step=PG0,  dir=PG1,  en=!PF15, uart=PD11  -> bt_lane1 (T1)
# MOTOR_2: step=PF11, dir=PG3,  en=!PG5,  uart=PC6   -> bt_lane2 (T2)
# MOTOR_3: step=PG4,  dir=PC1,  en=!PA0,  uart=PC7   -> bt_lane3 (T3)
# MOTOR_4: step=PF9,  dir=PF10, en=!PG2,  uart=PF2   -> bt_lane4 (T4)
# MOTOR_5: step=PC13, dir=PF0,  en=!PF1,  uart=PE4   -> bt_lane5 (T5)
#
# Endstop Pins (Filament Sensors):
# STOP_0: PG6   -> Lane 0 entry sensor (prep)
# STOP_1: PG9   -> Lane 1 entry sensor
# STOP_2: PG10  -> Lane 2 entry sensor
# STOP_3: PG11  -> Lane 3 entry sensor
# STOP_4: PG12  -> Lane 4 entry sensor
# STOP_5: PG13  -> Lane 5 entry sensor
# STOP_6~7, EXP2: Unused (exit sensors not installed)
# Sensor topology: 1 loader sensor (prep) + 2 toolhead sensors (entry, toolhead) = 3 total per lane

#####################################################################
#  Persistent State Storage (Retains State Across Power Cycles)
#####################################################################
#  Uses Klipper's save_variables to persist per-lane loading states to disk.
#  Remembers which lanes have filament loaded and whether they are in bt or direct mode.
#
#  Saved variable format:
#    bt_lane_state = {"mode_0":"bt", "mode_1":"direct", "mode_2":"empty",
#                     "mode_3":"empty", "mode_4":"empty", "mode_5":"empty",
#                     "loaded_0":true, "loaded_1":true, ...}

# * [save_variables] is already declared in printer.cfg with the same file path;
#   re-declaring it here would cause a boot error ("save_variables already exists").
#   -> Reuses [save_variables] (bt_saved_state.cfg) from printer.cfg.
# [save_variables]
# filename: ~/printer_data/config/bt_saved_state.cfg

#####################################################################
#  State Save / Restore Macros
#####################################################################

[gcode_macro _BT_SAVE_STATE]
description: Save current lane states to disk (persists across power-off)
gcode:
    {% set vars = printer["gcode_macro _BT_VARS"] %}
    {% set state_dict = {
        "mode_0": vars.detected_mode_0,
        "mode_1": vars.detected_mode_1,
        "mode_2": vars.detected_mode_2,
        "mode_3": vars.detected_mode_3,
        "mode_4": vars.detected_mode_4,
        "mode_5": vars.detected_mode_5
    } %}
    SAVE_VARIABLE VARIABLE=bt_lane_state VALUE='{state_dict}'
    RESPOND MSG="BoxTurtle: Lane state saved"

[gcode_macro _BT_RESTORE_STATE]
description: Restore lane states from disk + cross-verify with sensors
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set saved = svv.bt_lane_state|default(none) %}

    {% if saved is not none %}
        RESPOND MSG="BoxTurtle: Restoring saved lane states..."

        # Restore saved modes
        {% for i in range(6) %}
            {% set saved_mode = saved["mode_" ~ i]|default("empty") %}
            SET_GCODE_VARIABLE MACRO=_BT_VARS VARIABLE=detected_mode_{i} VALUE='"{saved_mode}"'
        {% endfor %}

        # Cross-verify against sensors (physical state may have changed while powered off)
        {% for i in range(6) %}
            {% set saved_mode = saved["mode_" ~ i]|default("empty") %}
            {% set prep_sensor = "filament_switch_sensor bt_lane" ~ i ~ "_prep" %}
            {% set entry_sensor = "filament_switch_sensor T" ~ i ~ "_runout_entry" %}
            {% set prep_ok = printer[prep_sensor].filament_detected if printer[prep_sensor] is defined else false %}
            {% set entry_ok = printer[entry_sensor].filament_detected if printer[entry_sensor] is defined else false %}

            # Detect mismatch between saved state and physical sensors
            {% if saved_mode == "bt" and not prep_ok %}
                RESPOND TYPE=error MSG="BoxTurtle: Lane {i} mismatch! Saved=BT but prep sensor not triggered -> Re-detecting"
                _BT_DETECT_LANE_MODE LANE={i}
            {% elif saved_mode == "direct" and not entry_ok %}
                RESPOND TYPE=error MSG="BoxTurtle: Lane {i} mismatch! Saved=DIRECT but entry sensor not triggered -> Re-detecting"
                _BT_DETECT_LANE_MODE LANE={i}
            {% elif saved_mode == "empty" and (prep_ok or entry_ok) %}
                RESPOND TYPE=error MSG="BoxTurtle: Lane {i} mismatch! Saved=EMPTY but sensor triggered -> Re-detecting"
                _BT_DETECT_LANE_MODE LANE={i}
            {% else %}
                RESPOND MSG="BoxTurtle: Lane {i} restore verified OK ({saved_mode|upper})"
            {% endif %}
        {% endfor %}

        # Save final state after restoration (in case any lanes were re-detected)
        _BT_SAVE_STATE
    {% else %}
        # No saved state -> first boot, run full sensor-based detection
        RESPOND MSG="BoxTurtle: No saved state found - running full sensor-based detection"
        _BT_DETECT_ALL_LANES
        _BT_SAVE_STATE
    {% endif %}

    RESPOND MSG="BoxTurtle: State restoration complete"
    BT_STATUS

#####################################################################
#  Automatic State Restoration at Boot
#####################################################################

[delayed_gcode _BT_STARTUP]
initial_duration: 3                    # Runs 3 seconds after boot (waits for MCU initialization)
gcode:
    RESPOND MSG="BoxTurtle: Boot detected - starting state restoration..."
    _BT_RESTORE_STATE

#####################################################################
#  Global Variables Macro
#####################################################################

[gcode_macro _BT_VARS]
description: BoxTurtle global configuration variables
# ─── Bowden Tube Lengths (BoxTurtle exit -> Toolhead entry, mm) ───
# Configured individually per lane as PTFE tube lengths may vary
variable_bowden_length_0: 900      # Lane 0 -> T0 tube length (requires calibration)
variable_bowden_length_1: 900      # Lane 1 -> T1
variable_bowden_length_2: 900      # Lane 2 -> T2
variable_bowden_length_3: 900      # Lane 3 -> T3
variable_bowden_length_4: 900      # Lane 4 -> T4
variable_bowden_length_5: 900      # Lane 5 -> T5
# ─── Loading / Unloading Speeds (mm/min) ───
variable_load_speed_fast: 3000     # Fast loading speed through Bowden tube
variable_load_speed_slow: 300      # Slow loading speed entering hotend
variable_unload_speed: 3000        # Unloading speed
# ─── Hotend Section Distances (mm) ───
variable_hotend_load_distance: 50  # Hotend entry -> nozzle distance (slow speed zone)
variable_hotend_purge: 30          # Purge distance after loading
variable_toolhead_sensor_to_gear: 20  # Toolhead sensor -> G2SA gear distance
# ─── Temperature Settings ───
variable_min_load_temp: 200        # Minimum loading temperature (heats before loading if below)
variable_min_unload_temp: 200      # Minimum unloading temperature (heat needed for tip forming)
# ─── Tip Forming Settings ───
# Shapes filament tip cleanly during unloading to prevent jams on reload
# PLA: Higher cycles (3~4) to prevent stringing
# ABS: Minimal stringing, 2~3 cycles
# PETG: Very stringy, 4~5 cycles + fast final retract
variable_tip_form_count: 3         # Tip forming push-pull cycle count
variable_tip_retract_dist: 3.0     # Retract distance per cycle (mm)
variable_tip_push_dist: 2.0        # Push distance per cycle (mm)
variable_tip_retract_speed: 2400   # Tip forming retract speed (mm/min)
variable_tip_push_speed: 1200      # Tip forming push speed (mm/min)
variable_tip_final_retract: 20.0   # Final retract (full extraction from hotend, mm)
variable_tip_final_speed: 3000     # Final retract speed (mm/min)
variable_tip_cooling_moves: 2      # Cooling oscillation count (back-and-forth in heatbreak)
variable_tip_cooling_dist: 15.0    # Cooling move distance (mm)
variable_tip_cooling_speed: 1200   # Cooling move speed (mm/min)
variable_tip_pause_ms: 500         # Dwell before final retract (ms, tip hardening)
# ─── TPU / Flexible Settings ───
variable_tpu_mode: False           # True = keep synchronized at all times + slower speeds
variable_tpu_load_speed: 1200      # TPU loading speed (slower than rigid filament)
variable_tpu_unload_speed: 1200    # TPU unloading speed
# ─── Tension Management Settings ───
# Calibrated rotation_distance of BoxTurtle feeder (measured after calibration)
# * Default 8.0 is BMG standard. Measure with BT_CALIBRATE_ROTATION and update!
variable_calibrated_rd_0: 8.000    # Lane 0 measured rotation_distance
variable_calibrated_rd_1: 8.000    # Lane 1
variable_calibrated_rd_2: 8.000    # Lane 2
variable_calibrated_rd_3: 8.000    # Lane 3
variable_calibrated_rd_4: 8.000    # Lane 4
variable_calibrated_rd_5: 8.000    # Lane 5
# TPU tension offset (%, positive = BoxTurtle pushes slightly more)
# Example: 1.5 -> BoxTurtle feeds 1.5% faster -> maintains positive pressure in PTFE -> prevents TPU buckling
# Principle: Sets rotation_distance to (calibrated * (100 - offset) / 100)
#   -> BoxTurtle rotates slightly more for the same E command -> pushes extra filament
# Recommended: PLA/ABS=0, TPU=1.0~2.0, Soft TPU=2.0~3.0
variable_tpu_push_percent: 1.5     # TPU over-push percentage (%)
# TurtleNeck buffer usage (True if physical spring buffer is installed)
variable_turtleneck_enabled: False
# ─── LeafCutter / Unloading Settings ───
variable_use_leafcutter: True      # True: Cut with LeafCutter before retracting (skips tip forming)
                                    # False: Tip forming before retracting (when LeafCutter is not installed)
variable_pre_cut_retract: 3.0      # Short retract before cut (ooze prevention, mm)
variable_post_cut_extra: 50        # Extra retract margin after cut (mm, ensures full clearance)
# ─── Lane Mode Settings (Optional System) ───
# Operating mode per lane: "auto" = auto-detect, "bt" = force BoxTurtle, "direct" = force direct feed
variable_lane_mode_0: "auto"       # Lane 0 mode
variable_lane_mode_1: "auto"       # Lane 1 mode
variable_lane_mode_2: "auto"       # Lane 2 mode
variable_lane_mode_3: "auto"       # Lane 3 mode
variable_lane_mode_4: "auto"       # Lane 4 mode
variable_lane_mode_5: "auto"       # Lane 5 mode
# ─── Detected Lane Modes (Auto-Detection Results) ───
# Current detected state per lane: "bt" / "direct" / "empty"
# Automatically populated by _BT_DETECT_ALL_LANES
variable_detected_mode_0: "empty"
variable_detected_mode_1: "empty"
variable_detected_mode_2: "empty"
variable_detected_mode_3: "empty"
variable_detected_mode_4: "empty"
variable_detected_mode_5: "empty"
# ─── State Machine ───
# Keeps runout sensors enabled at all times and branches runout event handling
# based on current system state, maintaining consistent real-time detection.
#
#  State Transition Diagram:
#    idle ──BT_LOAD──> loading ──complete──> idle
#    idle ──BT_UNLOAD-> unloading ──complete-> idle
#    idle ──PRINT_START-> printing ──PRINT_END-> idle
#    printing ──runout──> PAUSE (actual filament runout!)
#    loading/unloading ──runout──> ignore (expected filament travel)
#    idle ──runout──> warning only (not printing)
variable_state: "idle"             # Current state: idle / loading / unloading / printing
variable_active_lane: -1           # Currently active lane number (-1 = none)
gcode:
    RESPOND MSG="BoxTurtle config loaded (state: {printer['gcode_macro _BT_VARS'].state}, optional hybrid system)"

#####################################################################
#  Lane 0 - bt_lane0 <-> T0 (extruder)
#####################################################################

[extruder_stepper bt_lane0]
extruder:                          # Empty = unsynchronized at startup
step_pin: octopus:PF13             # Octopus MOTOR_0
dir_pin: octopus:PF12              # Use !octopus:PF12 if filament direction is inverted
enable_pin: !octopus:PF14
microsteps: 16
rotation_distance: 8               # Adjust to match BoxTurtle extruder gear ratio (BMG=8)

[tmc2209 extruder_stepper bt_lane0]
uart_pin: octopus:PC4
run_current: 0.6                   # BoxTurtle motor current (NEMA14: 0.35~0.4, NEMA17: 0.5~0.8)
stealthchop_threshold: 999999

# Prep sensor: Detects filament insertion from spool into BoxTurtle
[filament_switch_sensor bt_lane0_prep]
switch_pin: ^octopus:PG6           # STOP_0
pause_on_runout: False
event_delay: 1.0
insert_gcode:
    RESPOND MSG="Lane 0: Filament insertion detected (BoxTurtle prep)"
runout_gcode:
    RESPOND MSG="Lane 0: Filament removed"

# Exit sensor not installed (uses single prep sensor before BT motor)

#####################################################################
#  Lane 1 - bt_lane1 <-> T1 (extruder1)
#####################################################################

[extruder_stepper bt_lane1]
extruder:
step_pin: octopus:PG0              # Octopus MOTOR_1
dir_pin: octopus:PG1
enable_pin: !octopus:PF15
microsteps: 16
rotation_distance: 8

[tmc2209 extruder_stepper bt_lane1]
uart_pin: octopus:PD11
run_current: 0.6
stealthchop_threshold: 999999

[filament_switch_sensor bt_lane1_prep]
switch_pin: ^octopus:PG9           # STOP_1
