#  Configuration Notes (Optional Hybrid Mode)
#####################################################################
#  All macros prefixed with BT_ appear automatically in the Mainsail / Fluidd
#  dashboard macro panel. M117 messages display on the status bar and KlipperScreen,
#  while RESPOND messages print to the console.
