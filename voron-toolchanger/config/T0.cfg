#####################################################################
#  Tool 0 - Fly SHT36 V3 (CAN bus)
#  AntHead Toolhead + G2SA Extruder + TZ V6 3.0 Hotend
#####################################################################

[mcu SHT0]
canbus_uuid: 7de00df04b02

#####################################################################
#  Extruder (Galileo 2 Standalone - G2SA)
#####################################################################

[extruder]
step_pin: SHT0:gpio7
dir_pin: SHT0:gpio6
enable_pin: !SHT0:gpio14
rotation_distance: 47.088
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: SHT0:gpio23
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: SHT0:gpio27
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 150.0
max_extrude_cross_section: 5
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: SHT0:gpio15
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#  Filament Runout Sensors (G2SA Dual Runout)
#####################################################################
#
#  Physical sensor layout (verified wiring):
#  PTFE Tube -> [MDM: GPIO20 Switch / GPIO16 Encoder] -> G2SA Gears -> [GPIO17 Toolhead Switch] -> Hotend
#  GPIO20 = MDM Filament Switch -> T0_runout_entry
#  GPIO16 = MDM Pulse Channel -> T0_clog + mdm_cal_T0
#  GPIO17 = G2SA Toolhead Switch -> T0_runout_toolhead

[filament_switch_sensor T0_runout_entry]
switch_pin: ^SHT0:gpio20    # MDM filament presence switch (gpio20) — pull-up (^), non-inverted: filament present = GND = True
pause_on_runout: False         # State machine handler determines whether to PAUSE
event_delay: 3.0
pause_delay: 0.5
insert_gcode:
    {% set st = printer.print_stats.state %}
    {% set sd_active = printer.virtual_sdcard.is_active %}
    {% if st != "printing" and not sd_active %}
        _PREPARE_AUTO_LOAD TOOL=0
    {% endif %}
runout_gcode:
    _FILAMENT_RUNOUT_HANDLER TOOL=0 SENSOR=entry
    _CANCEL_AUTO_LOAD TOOL=0
#####################################################################
#  Tool Probe (Voron Tap)
#####################################################################

[tool_probe T0]
pin: ^SHT0:gpio22              # SHT36 V3 Probe Input pin (gpio17 used as toolhead runout switch)
tool: 0
z_offset: 0
speed: 8
samples: 3
samples_result: median
sample_retract_dist: 2
lift_speed: 5
samples_tolerance: 0.015
samples_tolerance_retries: 5
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder

#####################################################################
#  Fan - Hotend (FAN0 Connector)
#####################################################################

[heater_fan T0_hotend_fan]
pin: SHT0:gpio13               # FAN0 connector -> hotend cooling fan
heater: extruder
heater_temp: 50.0
max_power: 1.0
fan_speed: 1.0
shutdown_speed: 1.0
# -- Disable hotend fan tachometer (2-wire fan) --

#####################################################################
#  Fan - Part Cooling (FAN1 Connector, dual fans bridged in parallel)
#####################################################################

[fan_generic T0_part_fan]
pin: SHT0:gpio21               # FAN1 connector -> 2 part cooling fans bridged
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
kick_start_time: 0.5

#####################################################################
#  Accelerometer (Onboard SHT36 V3 LIS2DW)
#####################################################################

[lis2dw T0_accel]
cs_pin: SHT0:gpio12
spi_software_sclk_pin: SHT0:gpio2
spi_software_mosi_pin: SHT0:gpio3
spi_software_miso_pin: SHT0:gpio4

#####################################################################
#  WS2812B LED
#####################################################################

[neopixel T0_leds]
pin: SHT0:gpio26
chain_count: 3
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

#####################################################################
#  LED Variables
#####################################################################
[filament_switch_sensor T0_runout_toolhead]
switch_pin: ^!SHT0:gpio17
pause_on_runout: False
[gcode_macro _T0_vars]
variable_logo_led_name:         "T0_leds"
variable_logo_idx:              "1"
variable_nozzle_led_name:       "T0_leds"
variable_nozzle_idx:            "2,3"
gcode:

#####################################################################
#  Tool Macro
#####################################################################

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    {% if printer.toolchanger.tool_number|default(-1)|int == 0 %}
        RESPOND MSG="T0 already mounted — same tool re-selected, skipping park/pickup (maintaining print temp)"
    {% else %}
        _BEFORE_SELECT_TOOL_PHYSICAL_CHECK
        _PARK_RETRACT
        SELECT_TOOL T=0
        _PARK_UNRETRACT
    {% endif %}

#####################################################################
#  Tool Definition
#####################################################################
#  * T1+ tools: calibrate gcode_offset using TOOL_CALIBRATE_TOOL_OFFSET
#  * params_park_*: automatically saved after TOOL_ALIGN_DONE calibration

[tool T0]
tool_number: 0
extruder: extruder
fan: T0_part_fan
gcode_x_offset: -0.081250             # Manually entered calibration offset
gcode_y_offset: -0.167187
gcode_z_offset: 0.005000
params_park_x: 12.80
params_park_y: -11.50
params_park_z: 293.000
# Per-tool Input Shaper (enter after resonance measurement)
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 65.4
params_input_shaper_damping_ratio_x: 0.1
params_input_shaper_type_y: 'ei'
params_input_shaper_freq_y: 61.0
params_input_shaper_damping_ratio_y: 0.1

#####################################################################
#  MDM Calibration Sensor
#####################################################################
# [filament_switch_sensor mdm_cal_T0]
# switch_pin: ^SHT0:gpio16  # MDM motion sensor pulse (gpio16) — pull-up (^), non-inverted
# pause_on_runout: False
# event_delay: 0           # Pulse counting: minimize inter-event delay (default 3s would drop pulses)
# runout_gcode:
#     _MDM_CHECK TOOL=0
#  Clog / Motion Sensor (in-print jam detection)
#  gpio16 = Uses MDM encoder pulse channel as filament motion sensor.
#  If extrusion is commanded but filament does not move within detection_length,
#  -> triggers PAUSE due to clog/jam.
#  Disabled during boot/loading/calibration; enabled only during PRINT_START.
#####################################################################
[filament_motion_sensor T0_clog]
switch_pin: ^SHT0:gpio16   # MDM motion sensor (gpio16 encoder pulse)
extruder: extruder
detection_length: 20.0     # Increased from 7.0mm to 20.0mm to prevent false-positive clog triggers
pause_on_runout: False     # Handler determines whether to PAUSE
event_delay: 3.0
[verify_heater extruder]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2
