# Example config to setup per-tool probing and tool detection.
# Used in per-tool-probe examples

[tool_probe_endstop]
  crash_gcode:
    RESPOND TYPE=error MSG='Tool not detected, expected {printer.toolchanger.tool_number}. Aborting the print.' 
    M84
    TURN_OFF_HEATERS

[gcode_macro INITIALIZE_TOOLCHANGER]
description: Intelligently restore and initialize physically mounted tool state via save_variables
rename_existing: INITIALIZE_TOOLCHANGER_ORIG
gcode:
  DETECT_ACTIVE_TOOL_PROBE
  _INITIALIZE_TOOLCHANGER_IMPL {rawparams}

[gcode_macro _INITIALIZE_TOOLCHANGER_IMPL]
gcode:
  {% set query = printer.tool_probe_endstop.last_tools_query %}
  {% set active_count = namespace(val=0) %}
  {% set detected_tool = namespace(val=-1) %}
  {% for tool, triggered in query.items() %}
    {% if triggered|int == 0 %}
      {% set active_count.val = active_count.val + 1 %}
      {% set detected_tool.val = tool|int %}
    {% endif %}
  {% endfor %}

  # 1. If user explicitly passed T or TOOL parameter (manual force specification)
  {% if params.T is defined or params.TOOL is defined %}
    {% set tool_to_init = (params.T|default(params.TOOL))|int %}
    RESPOND MSG="⚠️ [Manual Init] Manually forcing Klipper state to T{tool_to_init} mounted."
    {% if tool_to_init >= 0 %}
      SET_ACTIVE_TOOL_PROBE T={tool_to_init}
      INITIALIZE_TOOLCHANGER_ORIG T={tool_to_init}
    {% else %}
      INITIALIZE_TOOLCHANGER_ORIG
    {% endif %}
  
  # 2. Automatic synchronization based on physical sensor state (no save_variables)
  {% else %}
    {% if active_count.val == 0 %}
      RESPOND MSG="✅ [Physical Detect] Shuttle carriage verified empty (EMPTY), initializing."
      INITIALIZE_TOOLCHANGER_ORIG
    {% elif active_count.val == 1 %}
      RESPOND MSG="✅ [Physical Detect] T{detected_tool.val} mount detected, initializing."
      SET_ACTIVE_TOOL_PROBE T={detected_tool.val}
      INITIALIZE_TOOLCHANGER_ORIG T={detected_tool.val}
    {% else %}
      # Immediately halt and alert upon multi-detection error
      {action_raise_error("🚨 [Sensor Error] Multiple tools (%d) detected simultaneously! Check hardware or alignment." % active_count.val)}
    {% endif %}
  {% endif %}

[gcode_macro VERIFY_TOOL_DETECTED]
rename_existing: VERIFY_TOOL_DETECTED_ORIG
gcode:
    {% if params.T is defined %}
      {% set expected_tool = params.T|int %}
      # Wait for physical motion to finish at safe Y (120) before sampling tool detection sensor
      M400
      G4 P500  # Wait 500ms for sensor signal to settle
      # 1. Query all tool probes in real time to identify the active mounted toolhead
      DETECT_ACTIVE_TOOL_PROBE
      
      # 2. Delegate evaluation to sub-macro to bypass Jinja2 pre-evaluation
      _VERIFY_TOOL_DETECTED_IMPL T={expected_tool}
    {% else %}
      RESPOND MSG="VERIFY_TOOL_DETECTED: No target tool parameter provided; skipping check."
    {% endif %}
 
[gcode_macro _VERIFY_TOOL_DETECTED_IMPL]
gcode:
    {% set expected_tool = params.T|int %}
    {% set detected_tool = printer.tool_probe_endstop.active_tool_number|int %}
    
    {% if detected_tool == expected_tool %}
      RESPOND MSG="✅ VERIFY_TOOL_DETECTED: T{expected_tool} physical engagement verified!"
    {% else %}
      RESPOND TYPE=error MSG="🚨 VERIFY_TOOL_DETECTED: T{expected_tool} engagement failed! Halting immediately."
      SELECT_TOOL_ERROR MESSAGE="Tool T{expected_tool} failed pickup. Halting to prevent crash."
    {% endif %}

[gcode_macro VERIFY_TOOL_DROPPED]
gcode:
    {% set expected_tool = params.T|int %}
    # Wait for sensor state to settle
    M400
    G4 P500
    # Force update physical sensor state
    DETECT_ACTIVE_TOOL_PROBE
    _VERIFY_TOOL_DROPPED_IMPL T={expected_tool}

[gcode_macro _VERIFY_TOOL_DROPPED_IMPL]
gcode:
    {% set expected_tool = params.T|int %}
    {% set detected_tool = printer.tool_probe_endstop.active_tool_number|int %}
    
    {% if detected_tool == -1 %}
      RESPOND MSG="VERIFY_TOOL_DROPPED: T{expected_tool} physical drop-off verified!"
    {% else %}
      RESPOND TYPE=error MSG="VERIFY_TOOL_DROPPED: T{expected_tool} drop-off failed! Tool is still attached to shuttle. Halting immediately to prevent crash."
      SELECT_TOOL_ERROR MESSAGE="Tool T{expected_tool} failed to drop off. Halting to prevent crashing into another dock!"
    {% endif %}
 
[gcode_macro _RETRY_PICKUP_SEQUENCE]
gcode:
    {% set expected_tool = params.TOOL|int %}
    {% set tool_name = "tool T" ~ expected_tool %}
    {% set tool_obj = printer[tool_name] %}
    
    {% set x = tool_obj.params_park_x|float %}
    {% set y = tool_obj.params_park_y|float %}
    {% set z = tool_obj.params_park_z|float %}
    {% set fast = tool_obj.params_fast_speed|float %}
    {% set path = tool_obj.params_pickup_path %}
    
    RESPOND MSG="Starting retry pickup sequence for T{expected_tool}..."
    
    G90
    # 1. Retreat to safe Y to prevent dock collision
    G0 Y{tool_obj.params_safe_y} F{fast}
    # 2. Move X/Z axes to approach position
    G0 X{x} Z{z + path[0]['z']|float} F{fast}
    # 3. Advance Y axis to dock entry point
    G0 Y{y + path[0]['y']|float} F{fast}
    
    # 4. Re-execute physical pickup trajectory
    {% for pos in path %}
      {% set speed = tool_obj.params_path_speed|float * (pos.get('f', 1.0)|float) %}
      G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float }{% endif %} F{speed}
    {% endfor %}
    
    # 5. Return to safe Y
    G0 Y{tool_obj.params_safe_y} F{fast}
    
    # Wait until retry motion completes physically
    M400
    G4 P500  # Wait 500ms for sensor signal to settle
    # 6. Re-scan and run final verification in sub-macro
    DETECT_ACTIVE_TOOL_PROBE
    _VERIFY_TOOL_DETECTED_FINAL_CHECK T={expected_tool}

[gcode_macro _VERIFY_TOOL_DETECTED_FINAL_CHECK]
gcode:
    {% set expected_tool = params.T|int %}
    {% set detected_tool = printer.tool_probe_endstop.active_tool_number|int %}
    
    {% if detected_tool == expected_tool %}
      RESPOND MSG="VERIFY_TOOL_DETECTED: T{expected_tool} retry physical engagement verified!"
    {% else %}
      # If retry also fails, park directly under the dock before raising error for manual alignment inspection
      RESPOND TYPE=error MSG="VERIFY_TOOL_DETECTED: T{expected_tool} second pickup failed! Moving under dock for alignment check and halting."
      
      {% set tool_name = "tool T" ~ expected_tool %}
      {% set tool_obj = printer[tool_name] %}
      {% set x = tool_obj.params_park_x|float %}
      {% set y = tool_obj.params_park_y|float %}
      {% set z = tool_obj.params_park_z|float %}
      {% set fast = tool_obj.params_fast_speed|float %}
      {% set path = tool_obj.params_pickup_path %}
      
      G90
      # Retreat to safe Y and move to X, Z (10mm below dock)
      G0 Y{tool_obj.params_safe_y} F{fast}
      G0 X{x} Z{z + path[0]['z']|float} F{fast}
      # Advance Y to position directly underneath dock latch
      G0 Y{y + path[1]['y']|float} F1500
      
      # Raise Klipper tool error while parked under dock with steppers enabled for alignment inspection
      SELECT_TOOL_ERROR MESSAGE="Tool T{expected_tool} failed pickup. Parked under dock (X={x}, Y={y + path[1]['y']|float}, Z={z + path[0]['z']|float}) for alignment check."
    {% endif %}

[gcode_macro CHECK_DOCK_ALIGNMENT]
description: Move shuttle to the specified tool dock (underneath latch or entrance) for manual dock alignment inspection.
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set UNDER = params.UNDER|default(1)|int %}
    {% set tool_name = "tool T" ~ TOOL %}
    
    {% if tool_name in printer %}
      {% set tool_obj = printer[tool_name] %}
      {% set x = tool_obj.params_park_x|float %}
      {% set y = tool_obj.params_park_y|float %}
      {% set z = tool_obj.params_park_z|float %}
      {% set fast = tool_obj.params_fast_speed|float %}
      {% set path = tool_obj.params_pickup_path %}
      
      {% if UNDER == 1 %}
        # Coordinates directly below latch engagement (dock Y, Z - 10mm)
        {% set entry_x = x %}
        {% set entry_y = y + path[1]['y']|float %}
        {% set entry_z = z + path[1]['z']|float %}
        {% set loc_name = "Under Dock Position" %}
      {% else %}
        # Dock entrance coordinates (Y + 16mm, Z - 10mm)
        {% set entry_x = x %}
        {% set entry_y = y + path[0]['y']|float %}
        {% set entry_z = z + path[0]['z']|float %}
        {% set loc_name = "Dock Entrance Position" %}
      {% endif %}
      
      RESPOND MSG="[Alignment Check] Moving to T{TOOL} {loc_name} -> X{entry_x} Y{entry_y} Z{entry_z}"
      
      {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
      {% endif %}
      
      G90
      # 1. Retreat to safe Y (120) first to avoid dock interference
      G0 Y120 F{fast}
      # 2. Move X to dock X and lower Z to entry height (z - 10)
      G0 X{entry_x} Z{entry_z} F{fast}
      
      {% if UNDER == 1 %}
        # 3. With Z lowered, advance Y to dock entrance line (y + 16)
        G0 Y{y + path[0]['y']|float} F{fast}
        # 4. Slowly advance Y to dock latch position (y) directly underneath tool
        G0 Y{entry_y} F1500
      {% else %}
        # 3. With Z lowered, advance Y to dock entrance line (y + 16)
        G0 Y{entry_y} F{fast}
      {% endif %}
      
      RESPOND MSG="Arrived at {loc_name}. Visually inspect alignment between shuttle and T{TOOL} dock."
    {% else %}
      RESPOND TYPE=error MSG="[Alignment Check] Invalid tool number: T{TOOL}"
    {% endif %}

[gcode_macro _STOP_IF_INCORRECT_TOOL]
gcode:
    # Bypass verification when physical sensor check is disabled
    RESPOND MSG="_STOP_IF_INCORRECT_TOOL: Bypassing check."

[gcode_macro _BEFORE_SELECT_TOOL_PHYSICAL_CHECK]
gcode:
    # 1. Scan physical tool probes
    DETECT_ACTIVE_TOOL_PROBE
    # 2. Delegate evaluation to sub-macro to bypass Jinja caching
    _BEFORE_SELECT_TOOL_PHYSICAL_CHECK_IMPL

[gcode_macro _BEFORE_SELECT_TOOL_PHYSICAL_CHECK_IMPL]
gcode:
    {% set query = printer.tool_probe_endstop.last_tools_query %}
    {% set active_count = namespace(val=0) %}
    {% set detected_tool = namespace(val=-1) %}
    {% for tool, triggered in query.items() %}
      {% if triggered|int == 0 %}
        {% set active_count.val = active_count.val + 1 %}
        {% set detected_tool.val = tool|int %}
      {% endif %}
    {% endfor %}

    {% set klipper_active_tool = printer.toolchanger.tool_number|default(-1)|int %}

    # 1. Check for multiple simultaneously triggered tool probes
    {% if active_count.val > 1 %}
      {action_raise_error("[Sensor Error] Multiple tools (%d) detected simultaneously during pickup check! Halting." % active_count.val)}
    
    # 2. Shuttle is physically empty, but Klipper state thinks a tool is mounted
    {% elif active_count.val == 0 and klipper_active_tool >= 0 %}
      RESPOND TYPE=error MSG="[Physical Scan] Shuttle is physically empty while Klipper expected T{klipper_active_tool}. Syncing state to EMPTY."
      INITIALIZE_TOOLCHANGER_ORIG
      
    # 3. A tool is physically mounted, but does not match Klipper active tool state
    {% elif active_count.val == 1 and klipper_active_tool != detected_tool.val %}
      RESPOND TYPE=error MSG="[Physical Scan] T{detected_tool.val} is physically mounted while Klipper expected T{klipper_active_tool}. Syncing state to T{detected_tool.val}."
      SET_ACTIVE_TOOL_PROBE T={detected_tool.val}
      INITIALIZE_TOOLCHANGER_ORIG T={detected_tool.val}
    {% endif %}