#####################################################################
#  toolchanger-config.cfg - User Overrides
#####################################################################
#  This file is loaded as the final include of klipper-toolchanger-easy.
#  Override values from readonly-configs/ here.
#
#  Location: ~/printer_data/config/toolchanger-config.cfg
#  * Do not modify files inside readonly-configs/ directly!
#####################################################################

#####################################################################
#  Rounded Path (Curved 3D trajectory for dock entry/exit)
#####################################################################

[rounded_path]
resolution: 0.2       # Arc approximation segment length (mm)
replace_g0: False     # If True, replaces all G0 moves with rounded paths (unsafe)

#####################################################################
#  Force Move (Allow axis movement before homing)
#####################################################################

[force_move]
enable_force_move: True

#####################################################################
#  Toolchanger - Dock Trajectories and Operating Parameters
#####################################################################
#  params_dropoff_path / params_pickup_path:
#    Relative coordinates referenced to dock park position (params_park_x/y/z)
#    y/z = offset, f = speed multiplier (default 1.0), verify = check tool presence
#
#  ModularDock default trajectories (official StealthChanger values):
#    dropoff: lower onto dock -> unlatch -> retreat
#    pickup:  approach -> latch -> verify presence -> retreat

[toolchanger]
params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
params_safe_y: 120          # Safe Y position (retreat line before approaching docks)
params_close_y: 30          # Close Y position near docks
params_fast_speed: 10000    # Fast traverse speed (mm/min)
params_path_speed: 900      # Dock path speed (mm/min, ~15mm/s)
require_tool_present: False # Physical Z-max endstop allows Z homing even without a tool mounted

after_change_gcode:
    {% set tn = "T"+(tool.tool_number|string) %}
    {% if printer["gcode_macro " + tn ] %}
       SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'c44'"
    {% endif %}
    {% if 'input_shaper' in printer.configfile.config %}
      {% set default_x_freq = printer.configfile.config['input_shaper']['shaper_freq_x']|default(0)|float %}
      {% set default_x_type = printer.configfile.config['input_shaper']['shaper_type_x']|default('mzv')|string %}
      {% set default_x_damping = printer.configfile.config['input_shaper']['damping_ratio_x']|default(0.1)|float %}
      {% set default_y_freq = printer.configfile.config['input_shaper']['shaper_freq_y']|default(0)|float %}
      {% set default_y_type = printer.configfile.config['input_shaper']['shaper_type_y']|default('mzv')|string %}
      {% set default_y_damping = printer.configfile.config['input_shaper']['damping_ratio_y']|default(0.1)|float %}
      SET_INPUT_SHAPER SHAPER_TYPE_X={tool.params_input_shaper_type_x if tool.params_input_shaper_type_x else default_x_type} SHAPER_FREQ_X={tool.params_input_shaper_freq_x if tool.params_input_shaper_freq_x else default_x_freq} SHAPER_TYPE_Y={tool.params_input_shaper_type_y if tool.params_input_shaper_type_y else default_y_type} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y if tool.params_input_shaper_freq_y else default_y_freq} DAMPING_RATIO_X={tool.params_input_shaper_damping_ratio_x if tool.params_input_shaper_damping_ratio_x else default_x_damping} DAMPING_RATIO_Y={tool.params_input_shaper_damping_ratio_y if tool.params_input_shaper_damping_ratio_y else default_y_damping}
    {% endif %}
    {% if printer.save_variables is defined %}
      SAVE_VARIABLE VARIABLE=toolchanger_active_tool VALUE={tool.tool_number}
    {% endif %}

    # (BASE_OFFSET logic moved to _SYNC_BASE_OFFSET macro to bypass RESTORE_GCODE_STATE)

pickup_gcode:
    {% set x = tool.params_park_x|float %}
    {% set y = tool.params_park_y|float %}
    {% set z = tool.params_park_z|float %}
    {% set fast = tool.params_fast_speed|float %}
    {% set path = tool.params_pickup_path %}
    RESPOND TYPE=echo MSG='Picking up {tool.name}'
    G90
    # -- Isolate coordinate offsets during docking (use absolute machine coordinates) --
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
    
    # Log target coordinates and active gcode offsets
    {% set g_off = printer.gcode_move.homing_origin %}
    RESPOND TYPE=echo MSG="DEBUG: Pickup target X={x} Y={y} Z={z} | Active GCode offset: X={g_off.x} Y={g_off.y} Z={g_off.z}"

    # 1. Dock collision prevention: retreat Y axis to safe_y (120) first to clear the dock zone
    G0 Y{tool.params_safe_y} F{fast}
    # 2. Move X and Z axes to pickup approach height and position
    G0 X{x} Z{z + path[0]['z']|float} F{fast}
    # 3. Advance Y axis to dock entry position
    G0 Y{y + path[0]['y']|float} F{fast}
    # Wait for nozzle temperature to reach target
    {% if tool.extruder %}
      M109 T{tool.tool_number} S{printer[tool.extruder].target|int}
    {% endif %}
    # Execute docking trajectory (pickup)
    {% for pos in path %}
      {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
      G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float }{% endif %} F{speed}
      {% if 'verify' in pos %}
        VERIFY_TOOL_DETECTED T={tool.tool_number}
      {% endif %}
    {% endfor %}
    # Restore position after pickup
    ROUNDED_G0 Y={tool.params_safe_y} F={fast} D=20
    {% if 'Z' in restore_position %}
      ROUNDED_G0 Z={restore_position.Z} F={fast} D=150
    {% endif %}
    {% if 'X' in restore_position %}
      ROUNDED_G0 X={restore_position.X} F={fast} D=1000
    {% endif %}
    {% if 'Y' in restore_position %}
      ROUNDED_G0 Y={restore_position.Y} F={fast} D=0
    {% endif %}
    ROUNDED_G0 D=0

dropoff_gcode:
    {% set x = tool.params_park_x|float %}
    {% set y = tool.params_park_y|float %}
    {% set z = tool.params_park_z|float %}
    {% set fast = tool.params_fast_speed|float %}
    {% set path = tool.params_dropoff_path %}
    RESPOND TYPE=echo MSG='Dropping off {tool.name}'
    G90
    # -- Isolate coordinate offsets during docking (use absolute machine coordinates) --
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
    # 1. Dock collision prevention: retreat Y axis to safe_y (120) first to clear the dock zone
    G0 Y{tool.params_safe_y} F{fast}
    # 2. Safely move X and Z axes to dropoff start height and position
    G0 X{x} Z{z + path[0]['z']|float} F{fast}
    # 3. Advance Y axis to dock approach position
    G0 Y{y + path[0]['y']|float} F{fast}
    
    STOP_CRASH_DETECTION
    # Execute docking trajectory (dropoff)
    {% for pos in path %}
      {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
      G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float }{% endif %} F{speed}
    {% endfor %}
    
    # -- Verify physical detachment immediately after dropoff --
    # If the probe still detects a tool here, dropoff failed; halt immediately before moving.
    VERIFY_TOOL_DROPPED T={tool.tool_number}
    
    # -- Save empty shuttle state immediately upon dropoff completion --
    {% if printer.save_variables is defined %}
      SAVE_VARIABLE VARIABLE=toolchanger_active_tool VALUE=-1
    {% endif %}

    ## Retreat to safe Y
    {% if pickup_tool is none %}
      G0 Y{tool.params_safe_y} F{fast}
    {% endif %}

#####################################################################
#  Homing Override Config (Sensorless Homing Settings)
#####################################################################
#  Read by [homing_override] to configure
#  sensorless vs. physical endstop homing.
#
#  AWD (4-motor XY) configuration:
#    stepper_x + stepper_x1  (TMC5160 HV)
#    stepper_y + stepper_y1  (TMC5160 HV)
#    During homing, primary motor switches to homing_current,
#    while secondary motor (x1/y1) is reduced to prevent StallGuard interference.

[gcode_macro homing_override_config]
variable_sensorless_x: 1
variable_sensorless_y: 1
variable_homing_rebound_y: 20     # Rebound distance after sensorless homing (mm)
variable_stepper_driver: "tmc5160"  # Stepper driver type
variable_homing_current: 0.80     # Homing current (A) - affects StallGuard sensitivity
variable_homing_start_time: 0
gcode:

#####################################################################
#  M109 Temperature Deadband (Optional)
#####################################################################
#  Temperature tolerance window for M109 wait command
#  Default: +-1C (e.g. target 250C -> proceeds within 249~251C)
#  Reduce deadband for temperature-sensitive filaments such as TPU.

#[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
#variable_default_deadband: 1.0

#####################################################################
#  Calibration Switch Coordinates (Optional)
#####################################################################
#  Sexbolt switch coordinates for tool offset calibration
#  Used by TOOL_CALIBRATE_TOOL_OFFSET macro
#  Measure and update after physical assembly.

#[gcode_macro _CALIBRATION_SWITCH]
#variable_x: 275.0              # Adjust after physical measurement
#variable_y: 335.0              # Adjust after physical measurement
#variable_z: 5.0
#gcode:

#####################################################################
#  Tools Calibrate (Optional)
#####################################################################
#  Hardware sexbolt calibration probe settings
#  Enable when using a Sexbolt + nozzle calibration probe

#[tools_calibrate]
#pin: ^!PF3              # Calibration probe pin (Kraken S5, NC switch -> inverted)
#travel_speed: 20        # XY probing travel speed (mm/s)
#spread: 7               # XY probing spread distance (mm)
#lower_z: 1.0            # Z descent distance over probe (mm)
#speed: 2                # Probing speed (mm/s)
#lift_speed: 4           # Z lift speed after probing
#final_lift_z: 6         # Final Z lift height (mm)
#sample_retract_dist: 2
#samples_tolerance: 0.05
#samples: 5
#samples_result: median

#####################################################################
#  Empty Shuttle Recovery Sequence (Based on Physical Z-Max Endstop)
#####################################################################
#
#  * Physical Z-max endstop at top of chamber allows Z homing without a tool:
#    - require_tool_present: False -> homing_override permits Z homing
#    - stepper_z endstop_pin: ^PF4 + homing_positive_dir: True
#    - G28 -> Homes XYZ (bed moves down / gantry up to trigger Z-max switch)
#
#
#  * RECOVER_EMPTY_SHUTTLE is provided for manual recovery:
#    - When the shuttle boots up with no tool attached
#    - Automatically picks up T0 (or specified TOOL) after G28

[gcode_macro RECOVER_EMPTY_SHUTTLE]
description: Recover empty shuttle - Home XYZ and pick up specified tool
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}

    RESPOND MSG="========================================="
    RESPOND MSG="  Starting empty shuttle recovery sequence"
    RESPOND MSG="========================================="

    # 1. Home XYZ (physical Z-max endstop works without a tool)
    RESPOND MSG="[1/3] Homing XYZ (Z-max endstop)..."
    M117 Homing XYZ...
    G28

    # 2. Pick up target tool
    RESPOND MSG="[2/3] Picking up T{TOOL}..."
    M117 Picking up T{TOOL}...
    SELECT_TOOL T={TOOL}

    # 3. Complete
    RESPOND MSG="[3/3] Recovery complete"
    RESPOND MSG="========================================="
    RESPOND MSG="  T{TOOL} mounted"
    RESPOND MSG="========================================="
    M117 Recovery complete - T{TOOL} ready

[gcode_macro _SENSORLESS_HOME]
gcode:
  {% set axis = params.AXIS|default('X')|string %}
  {% set config = printer["gcode_macro homing_override_config"] %}

  # Always use consistent run_current on A/B steppers during sensorless homing
  {% set RUN_CURRENT_X = printer.configfile.settings[config.stepper_driver ~ ' stepper_x'].run_current|float %}
  {% set RUN_CURRENT_Y = printer.configfile.settings[config.stepper_driver ~ ' stepper_y'].run_current|float %}
  
  # Decouple homing currents to optimize Y-axis travel torque and X-axis soft triggering
  {% if axis|upper == 'Y' %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.8
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.8
    {% set AUX_CURRENT = 0.8 %}
  {% else %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.8
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.8
    {% set AUX_CURRENT = 0.8 %}
  {% endif %}
  
  {% if config.stepper_driver ~ ' stepper_x1' in printer.configfile.settings %}
    {% set RUN_CURRENT_X1 = printer.configfile.settings[config.stepper_driver ~ ' stepper_x1'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={AUX_CURRENT}
  {% endif %}
  
  {% if config.stepper_driver ~ ' stepper_y1' in printer.configfile.settings %}
    {% set RUN_CURRENT_Y1 = printer.configfile.settings[config.stepper_driver ~ ' stepper_y1'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={AUX_CURRENT}
  {% endif %}

  # Home
  G28 {axis|upper}
    
  # Wait 1 second (clear StallGuard registers and prevent cross-axis interference)
  G4 P1000
  # Set current during print
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
  
  {% if config.stepper_driver ~ ' stepper_x1' in printer.configfile.settings %}
    {% set RUN_CURRENT_X1 = printer.configfile.settings[config.stepper_driver ~ ' stepper_x1'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={RUN_CURRENT_X1}
  {% endif %}
  
  {% if config.stepper_driver ~ ' stepper_y1' in printer.configfile.settings %}
    {% set RUN_CURRENT_Y1 = printer.configfile.settings[config.stepper_driver ~ ' stepper_y1'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={RUN_CURRENT_Y1}
  {% endif %}

#####################################################################
#  AWD Z-Homing Safety Override (Collision-Preventive Z Descent)
#####################################################################
[homing_override]
axes: xyz
gcode:

  {% set uses_tool_probe = printer["tool_probe_endstop"] is defined %}

  {% set start_time = printer.toolhead.estimated_print_time %}
  SET_GCODE_VARIABLE MACRO=homing_override_config VARIABLE=homing_start_time VALUE={start_time}
  INITIALIZE_TOOLCHANGER

  {% if False %}
    # Removed error trigger because we now use probe to lift Z safely
  {% else %}
    ENTER_DOCKING_MODE
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    RESPOND MSG="DEBUG: max_x={max_x} max_y={max_y}"
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    {% set config = printer["gcode_macro homing_override_config"] %}

    G90 ; absolute mode
    {% if 'z' not in printer.toolhead.homed_axes %}
      SET_KINEMATIC_POSITION Z=0
      _SMART_Z_HOP
      M400
    {% elif printer.toolhead.position[2]|float < 4 %}
      _SMART_Z_HOP
      M400
    {% endif %}

    {% if home_all or 'Y' in params or 'X' in params %}
      {% if config.sensorless_y %}
        _SENSORLESS_HOME AXIS=Y
      {% else %}
        G28 Y
      {% endif %}
      G0 Y{ max_y - config.homing_rebound_y } F6000
    {% endif %}

    {% if home_all or 'X' in params %}
      {% if config.sensorless_x %}
        _SENSORLESS_HOME AXIS=X
      {% else %}
        G28 X
      {% endif %}
      G0 X{ max_x - 10} F6000
    {% endif %}

    EXIT_DOCKING_MODE

    {% if home_all or 'Z' in params %}
      {% set random_x = (range(-50, 50) | random) / 10 %}
      {% set random_y = (range(-50, 50) | random) / 10 %}

      G90 ; absolute mode
      G0 X{( max_x / 2 ) + random_x} Y{( max_y / 2 ) + random_y} F12000
      G28 Z
      
      {% if uses_tool_probe %}
        _ADJUST_Z_HOME_FOR_TOOL_OFFSET
      {% endif %}

      G0 Z30 F3000    # Z10 -> Z30: Park at safe Z30 after Z homing to prevent collision
    {% endif %}
    M400
    _PRINT_HOMING_TIME
  {% endif %}

[gcode_macro _SMART_Z_HOP]
gcode:
  {% if printer["smart_effector"] is defined %}
    QUERY_SMART_EFFECTOR
    _SMART_Z_HOP_ACTION
  {% else %}
    RESPOND MSG="No smart_effector detected, defaulting to 5mm Z-hop."
    G91
    G0 Z5 F300
    G90
  {% endif %}

[gcode_macro _SMART_Z_HOP_ACTION]
gcode:
  {% set probe_state = printer.smart_effector.last_query %}
  {% if probe_state == 1 %}
    RESPOND MSG="Bed detected (IR Probe Triggered)! Safe Z-hop 10mm."
    G91
    G0 Z10 F300
    G90
  {% else %}
    RESPOND MSG="Bed not detected (IR Probe Open). Safe Z-hop 5mm."
    G91
    G0 Z5 F300
    G90
  {% endif %}


[gcode_macro _ADJUST_Z_HOME_FOR_TOOL_OFFSET]
gcode:
      G90 ; absolute mode
      G0 Z10 F4800
      {% set tool = printer.toolchanger.tool %}
      {% set tool_z_offset = (printer[tool].gcode_z_offset|float) if tool else 0.0 %}
      SET_KINEMATIC_POSITION Z={10.0+tool_z_offset}

[gcode_macro TOOL_BED_MESH_CALIBRATE]
gcode:
      {% set tool_z_offset = printer[printer.toolchanger.tool].gcode_z_offset %}
      G90 ; absolute mode
      G0 Z10 F4800
      # Bed mesh knows about the probe offset, but not about the tool offset.
      SET_KINEMATIC_POSITION Z={10.0-tool_z_offset|float}
      BED_MESH_CALIBRATE
      G0 Z10 F4800
      SET_KINEMATIC_POSITION Z={10.0+tool_z_offset|float}

[gcode_macro _SAVE_TOOL_OFFSET]
gcode:
    {% set tool = params.T|int %}
    TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="tool T{tool}" ATTRIBUTE=offset

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
gcode:
    # Move to Sexbolt XY coordinates at safe Z height for toolchanger offset calibration
    G0 Z15 F6000
    G0 X42.30 Y-5.80 F6000

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Automatically calibrate XYZ offsets for all tools
gcode:
    {% set tools = printer.toolchanger.tool_numbers %}
    {% set names = printer.toolchanger.tool_names %}
    # Tool 0
    SELECT_TOOL T={tools[0]}  RESTORE_AXIS=XYZ
    STOP_CRASH_DETECTION
    CALIBRATE_MOVE_OVER_PROBE    
    M109 S170
    TOOL_LOCATE_SENSOR
    M104 S0
    {% for tool in tools[1:] %}
        SELECT_TOOL T={tool}  RESTORE_AXIS=Z
        STOP_CRASH_DETECTION
        M104 S170 T{tool}
        CALIBRATE_MOVE_OVER_PROBE
        M109 S170 T{tool}
        TOOL_CALIBRATE_TOOL_OFFSET
        _SAVE_TOOL_OFFSET T={tool}
        M104 S0
    {% endfor %}
    
    # Finish up
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XZ
    TURN_OFF_HEATERS
    RESPOND MSG="=== All tool offsets calibrated! Restarting firmware via SAVE_CONFIG. ==="
    SAVE_CONFIG


[gcode_macro CALIBRATE_ALL_TOOL_PID]
description: Sequentially run PID calibration on all docked toolhead heaters without shuttle pickup and run SAVE_CONFIG once
gcode:
    {% set TARGET = params.TARGET|default(210)|float %}
    {% set tools = printer.toolchanger.tool_numbers %}
    {% set names = printer.toolchanger.tool_names %}

    RESPOND MSG="=== Starting all-toolhead PID calibration (TARGET={TARGET}C, docked) ==="

    {% for tn in tools %}
        {% set heater = "extruder" if tn == 0 else "extruder" ~ tn %}
        RESPOND MSG="[{loop.index}/{tools|length}] Starting PID calibration for {names[tn]} ({heater})..."
        M117 Calibrating T{tn} PID... ({loop.index}/{tools|length})
        PID_CALIBRATE HEATER={heater} TARGET={TARGET}
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
        RESPOND MSG="[{loop.index}/{tools|length}] {names[tn]} complete."
    {% endfor %}

    RESPOND MSG="=== All toolhead PID calibrations complete. Running SAVE_CONFIG. ==="
    SAVE_CONFIG


[gcode_macro _PRINT_HOMING_TIME]
gcode:
    {% set start_time = printer["gcode_macro homing_override_config"].homing_start_time %}
    {% set end_time = printer.toolhead.estimated_print_time %}
    {% set duration = end_time - start_time %}
    {% set minutes = (duration / 60)|int %}
    {% set seconds = (duration % 60)|int %}
    RESPOND MSG="Homing duration: {minutes}m {seconds}s"

[gcode_macro STOP_CRASH_DETECTION]
gcode:
    # Dummy macro to prevent error

