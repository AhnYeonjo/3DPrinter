#####################################################################
#  macros.cfg - Utility Macros
#####################################################################
#  Included via [include macros.cfg] in printer.cfg.
#
#  Contents:
#  1. PID Tuning (Bed + 5 Hotends)
#  2. Pressure Advance Tuning Helpers
#  3. Batch Sensor Verification
#  4. Tool Change Testing
#  5. M600 Filament Change (Slicer Compatible)
#  6. Z Endstop Calibration Guide
#  7. Input Shaper Resonance Measurement
#  8. Dock Calibration Wizard
#  9. IR Probe Calibration Guide
#  10. Comprehensive System Status
#  11. Spoolman Filament Management
#  12. Toolhead LED Status System
#  13. Per-Tool Fan Synchronization
#  14. Pre-Print Tool Verification
#  15. Speed / Acceleration Test
#  16. Material Temperature Presets
#  17. Multi-Tool Parallel Preheating
#  18. Layer Change Event Hooks
#  19. Conditional Purge State Tracking
#  20. Z Thermal Drift Compensation Guide
#  21. Low Filament Warning System
#####################################################################

#####################################################################
#  1. PID Tuning Macros
#####################################################################

[gcode_macro PID_ALL]
description: Sequential PID tuning for bed + 5 hotends (~30 min total)
# Usage: PID_ALL                (default: bed 60°C, hotend 200°C)
#        PID_ALL BED=110 HOTEND=250  (ABS preset)
gcode:
    {% set BED_TEMP = params.BED|default(60)|int %}
    {% set HOTEND_TEMP = params.HOTEND|default(200)|int %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing required before PID tuning. Running G28..."
        G28
    {% endif %}

    RESPOND MSG="╔══════════════════════════════════════════════╗"
    RESPOND MSG="║  Starting Full PID Tuning                    ║"
    RESPOND MSG="║  Bed: {BED_TEMP}°C / Hotend: {HOTEND_TEMP}°C             ║"
    RESPOND MSG="╚══════════════════════════════════════════════╝"

    # Bed PID
    RESPOND MSG="[1/6] Bed PID tuning ({BED_TEMP}°C)..."
    M117 PID: Bed {BED_TEMP}C
    PID_CALIBRATE HEATER=heater_bed TARGET={BED_TEMP}

    # Hotend PID (T0~T4)
    {% set heaters = ["extruder", "extruder1", "extruder2", "extruder3", "extruder4", "extruder5"] %}
    {% for i in range(5) %}
        RESPOND MSG="[{i+2}/6] T{i} hotend PID tuning ({HOTEND_TEMP}°C)..."
        M117 PID: T{i} {HOTEND_TEMP}C
        PID_CALIBRATE HEATER={heaters[i]} TARGET={HOTEND_TEMP}
    {% endfor %}

    TURN_OFF_HEATERS
    RESPOND MSG="═══ Full PID Tuning Complete ═══"
    RESPOND MSG="Run SAVE_CONFIG to save results."
    M117 PID done - SAVE_CONFIG needed

[gcode_macro PID_HOTEND]
description: Tune hotend PID for a specific tool
# Usage: PID_HOTEND TOOL=0 TEMP=200
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set TEMP = params.TEMP|default(200)|int %}
    {% set heater = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    RESPOND MSG="T{TOOL} hotend PID tuning ({TEMP}°C)..."
    M117 PID: T{TOOL} {TEMP}C
    PID_CALIBRATE HEATER={heater} TARGET={TEMP}

    RESPOND MSG="T{TOOL} PID tuning complete. Run SAVE_CONFIG to save."
    M117 PID T{TOOL} done

[gcode_macro PID_BED]
description: Tune heated bed PID
# Usage: PID_BED TEMP=60
gcode:
    {% set TEMP = params.TEMP|default(60)|int %}

    RESPOND MSG="Bed PID tuning ({TEMP}°C)..."
    M117 PID: Bed {TEMP}C
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}

    RESPOND MSG="Bed PID tuning complete. Run SAVE_CONFIG to save."
    M117 PID Bed done

#####################################################################
#  2. Pressure Advance Tuning Helpers
#####################################################################

[gcode_macro PA_TUNING]
description: Prepare Pressure Advance test pattern print (displays guide)
# Usage: PA_TUNING TOOL=0
#        PA_TUNING TOOL=0 START=0.01 END=0.08 INCREMENT=0.005
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set START = params.START|default(0.01)|float %}
    {% set END = params.END|default(0.08)|float %}
    {% set INC = params.INCREMENT|default(0.005)|float %}

    RESPOND MSG="╔══════════════════════════════════════════════════╗"
    RESPOND MSG="║  Pressure Advance Tuning Guide - T{TOOL}            ║"
    RESPOND MSG="╠══════════════════════════════════════════════════╣"
    RESPOND MSG="║                                                  ║"
    RESPOND MSG="║  Method 1: Klipper Built-in Tuning Tower         ║"
    RESPOND MSG="║  ─────────────────────────────────               ║"
    RESPOND MSG="║  1. Slice a hollow square STL (40x40x50mm, 1 wall)║"
    RESPOND MSG="║  2. Set PRINT_START in Slicer Start G-code       ║"
    RESPOND MSG="║  3. Enter the following in the Klipper console:  ║"
    RESPOND MSG="║     SET_VELOCITY_LIMIT                           ║"
    RESPOND MSG="║       SQUARE_CORNER_VELOCITY=1                   ║"
    RESPOND MSG="║       ACCEL=500                                  ║"
    RESPOND MSG="║     TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE    ║"
    RESPOND MSG="║       PARAMETER=ADVANCE START={START}            ║"
    RESPOND MSG="║       FACTOR={INC/1.0}                           ║"
    RESPOND MSG="║  4. Measure the height (mm) with the cleanest    ║"
    RESPOND MSG="║     corners and calculate PA:                    ║"
    RESPOND MSG="║     PA = START + (measured_height * FACTOR)      ║"
    RESPOND MSG="║                                                  ║"
    RESPOND MSG="║  Method 2: Direct PA Assignment (For Testing)    ║"
    RESPOND MSG="║  ─────────────────────────────────               ║"
    RESPOND MSG="║  SET_PRESSURE_ADVANCE EXTRUDER=extruder{''+TOOL|string if TOOL > 0 else ''}  ║"
    RESPOND MSG="║    ADVANCE=0.040                                 ║"
    RESPOND MSG="║                                                  ║"
    RESPOND MSG="╚══════════════════════════════════════════════════╝"

[gcode_macro SET_PA]
description: Set Pressure Advance for a specific tool
# Usage: SET_PA TOOL=0 PA=0.04
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set PA = params.PA|default(0.04)|float %}
    {% set extruder = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    SET_PRESSURE_ADVANCE EXTRUDER={extruder} ADVANCE={PA}
    RESPOND MSG="T{TOOL} Pressure Advance = {PA}"
    M117 T{TOOL} PA={PA}

#####################################################################
#  22. Tool Change Retract / Unretract & Standby Temp Drop (Ooze Prevention)
#####################################################################

[gcode_macro _PARK_RETRACT]
description: Retract filament and lower to standby temperature before docking current tool
gcode:
    {% if printer.toolchanger.tool_number|default(-1)|int >= 0 %}
        {% set active_tool = printer.toolchanger.tool_number %}
        {% set extruder = "extruder" if active_tool == 0 else "extruder" ~ active_tool %}
        
        # 3mm retract (only when nozzle temp >= 175C and target temp >= 170C)
        {% if printer[extruder].temperature >= 175 and printer[extruder].target >= 170 %}
            SAVE_GCODE_STATE NAME=PARK_RETRACT_STATE
            M83
            G1 E-3 F1800
            RESTORE_GCODE_STATE NAME=PARK_RETRACT_STATE
            RESPOND MSG="T{active_tool} park: 3mm retract complete"
        {% else %}
            RESPOND MSG="T{active_tool} park: Nozzle temp low, skipping retract"
        {% endif %}
        
        # Lower to standby temp (150C) - slicer or toolchanger restores active temp on pickup
        SET_HEATER_TEMPERATURE HEATER={extruder} TARGET=150
        
        # ── Minimize Standby Extruder Stepper Heat (Dynamic TMC Current) ──
        # Lower holding current of docked tool motor to 0.1A to prevent heat creep
        SET_TMC_CURRENT STEPPER={extruder} CURRENT=0.1
        
        RESPOND MSG="T{active_tool} park configured: standby temp 150°C, current 0.1A"
    {% endif %}

[gcode_macro _PARK_UNRETRACT]
description: Restore retraction and motor current after picking up new tool
gcode:
    {% if printer.toolchanger.tool_number|default(-1)|int >= 0 %}
        {% set active_tool = printer.toolchanger.tool_number %}
        {% set extruder = "extruder" if active_tool == 0 else "extruder" ~ active_tool %}
        
        # ── Restore Motor Current ──
        # Restore extruder drive current to nominal 0.6A on pickup
        SET_TMC_CURRENT STEPPER={extruder} CURRENT=0.6

        # 3mm unretract (only when nozzle temp >= 175C and target temp >= 170C)
        {% if printer[extruder].temperature >= 175 and printer[extruder].target >= 170 %}
            SAVE_GCODE_STATE NAME=PARK_UNRETRACT_STATE
            M83
            G1 E3 F1800
            RESTORE_GCODE_STATE NAME=PARK_UNRETRACT_STATE
            RESPOND MSG="T{active_tool} pickup: 3mm unretract complete"
        {% else %}
            RESPOND MSG="T{active_tool} pickup: Nozzle temp low, skipping unretract"
        {% endif %}
        RESPOND MSG="T{active_tool} pickup complete: drive current restored to 0.6A"
    {% endif %}
    
    # Timelapse hook (capture frame after new tool pickup)
    _TIMELAPSE_TOOLCHANGE_HOOK

#####################################################################
#  23. Automatic Tool Failover
#####################################################################
[gcode_macro _AUTO_FAILOVER]
# Key is current tool, value is fallback tool number (-1 = no fallback)
variable_fallback_tool: { 0: -1, 1: -1, 2: -1, 3: -1, 4: -1, 5: -1 }
variable_temp_fallback: -1
gcode:
    RESPOND MSG="Configured Failover mapping: {fallback_tool}"

[gcode_macro SET_FAILOVER]
description: Configure automatic failover to a backup tool upon filament runout (-1 = auto search)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set FALLBACK = params.FALLBACK|default(-1)|int %}
    
    {% set current_map = printer["gcode_macro _AUTO_FAILOVER"].fallback_tool %}
    {% set temp_map = dict(current_map) %}
    # Update Jinja dictionary
    {% set _ = temp_map.update({TOOL: FALLBACK}) %}
    SET_GCODE_VARIABLE MACRO=_AUTO_FAILOVER VARIABLE=fallback_tool VALUE="{temp_map}"
    {% if FALLBACK >= 0 %}
        RESPOND MSG="Failover configured: T{TOOL} runout -> fixed switch to T{FALLBACK}"
    {% else %}
        RESPOND MSG="Failover configured: T{TOOL} runout -> Spoolman smart search"
    {% endif %}

#####################################################################
#  23-1. Spoolman-Based Smart Tool Failover Logic
#####################################################################
[gcode_macro _SPOOLMAN_FIND_FALLBACK]
description: Search for another active spool with the same material/color as the current tool (internal)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set fallback_found = -1 %}
    
    {% if printer.spoolman is defined %}
        {% set active_spool_id = printer.spoolman.active_spools[TOOL]|default(None) %}
        
        {% if active_spool_id is not none %}
            {% set vars = printer["gcode_macro _PRINT_STATE"] %}
            {% set mat = vars.last_material|default("NONE")|upper %}
            
            RESPOND MSG="Smart Failover: Searching for another tool with matching {mat} material for T{TOOL}..."
            
            # Placeholder for Spoolman metadata lookup across T0~T4
            # {% set fallback_found = (TOOL + 1) % 5 %}
        {% else %}
            RESPOND MSG="Smart Failover: No Spoolman spool assigned to T{TOOL}, auto-search failed"
        {% endif %}
    {% else %}
        RESPOND MSG="Smart Failover: Spoolman is not integrated. Use manual SET_FAILOVER."
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=_AUTO_FAILOVER VARIABLE=temp_fallback VALUE={fallback_found}

#####################################################################
#  24. CAN Bus Bottleneck & Diagnostics Guide
#####################################################################
[gcode_macro QUERY_CAN_STATUS]
description: Display CAN bus communication diagnostics guide for all 5 toolboards
gcode:
    RESPOND MSG="╔══════════════════════════════════════════════════╗"
    RESPOND MSG="║  CAN Bus Diagnostics & Bottleneck Guide          ║"
    RESPOND MSG="╠══════════════════════════════════════════════════╣"
    RESPOND MSG="║ 1. Check tx_queue_len status (ifconfig can0)     ║"
    RESPOND MSG="║    Recommended: >= 1024 (for 5 toolboards)       ║"
    RESPOND MSG="║ 2. U2C/UTOC firmware bitrate                     ║"
    RESPOND MSG="║    Recommended: Keep at 1000000 (1Mbps)          ║"
    RESPOND MSG="║ 3. If byte drops accumulate, inspect wiring      ║"
    RESPOND MSG="║    and 120-ohm termination resistors             ║"
    RESPOND MSG="╚══════════════════════════════════════════════════╝"
    M117 CAN Bus Diagnostics

#####################################################################
#  25. Toolchanger-Optimized Timelapse Hook
#####################################################################
[gcode_macro _TIMELAPSE_TOOLCHANGE_HOOK]
description: Trigger timelapse shutter at a parked position during toolchange
gcode:
    {% if printer["gcode_macro TIMELAPSE_TAKE_FRAME"] is defined %}
        RESPOND MSG="Timelapse: Capturing toolchange frame"
        TIMELAPSE_TAKE_FRAME
    {% endif %}

#####################################################################
#  26. Pre-Flight Kinematics Check
#####################################################################
[gcode_macro PRE_FLIGHT_CHECK]
description: Pre-print QGL and high-speed motor/belt skipped-step verification test
gcode:
    RESPOND MSG="═══ Starting Pre-Flight Kinematics Check ═══"
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing...
        G28
    {% endif %}
    
    M117 QGL Check...
    QUAD_GANTRY_LEVEL
    
    # Move to bed center
    G0 X175 Y175 Z50 F18000
    
    RESPOND MSG="  Motor/belt load test (high-speed diagonal shake)..."
    M117 Shake Test...
    # Rapid short diagonal strokes to test for skipped steps
    {% for i in range(3) %}
        G0 X185 Y185 F30000
        G0 X165 Y165 F30000
        G0 X165 Y185 F30000
        G0 X185 Y165 F30000
    {% endfor %}
    
    # Return to center
    G0 X175 Y175 F18000
    
    RESPOND MSG="  Final Z homing verification..."
    M117 Final Z Home...
    G28 Z
    RESPOND MSG="═══ Pre-Flight Check Passed: Ready to Print ═══"
    M117 Pre-Flight OK

#####################################################################
#  27. Dedicated Maintenance Mode
#####################################################################
[gcode_macro MAINTENANCE_MODE]
description: Park active tool and bring shuttle to front center for nozzle/hotend maintenance
gcode:
    RESPOND MSG="═══ Entering Maintenance Mode ═══"
    M117 Maintenance Mode
    
    # Turn chamber lights on (full brightness)
    LIGHTS_ON
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # Dock any currently mounted tool for safety
    {% if printer.toolchanger.tool_number|default(-1)|int >= 0 %}
        RESPOND MSG="  Parking current tool in dock for safety."
        UNSELECT_TOOL
    {% endif %}
    
    # Lower Z (raises gantry for workspace access)
    G0 Z200 F1500
    
    # Move shuttle to front center
    G0 X175 Y10 F12000
    
    # Disable stepper motors (allows manual movement)
    M84
    RESPOND MSG="═══ Shuttle positioned at front center. Steppers disabled. ═══"
    M117 Safe to Work

#####################################################################
#  28. System Debugging (Dump Variables)
#####################################################################
[gcode_macro DUMP_TOOLS_STATE]
description: Print status and temperatures of all defined tools to the console
gcode:
    RESPOND MSG="╔══════════════════════════════════════════════════╗"
    RESPOND MSG="║  Tools Status Dump                              ║"
    RESPOND MSG="╠══════════════════════════════════════════════════╣"
    
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    RESPOND MSG="║ Currently active tool : T{active_tool}"
    
    {% for t in range(5) %}
        {% set ext = "extruder" if t == 0 else "extruder" ~ t %}
        {% if printer[ext] is defined %}
            {% set target = printer[ext].target %}
            {% set current = printer[ext].temperature %}
            RESPOND MSG="║ T{t} ({ext}): Target {target}°C / Current {current}°C"
        {% else %}
            RESPOND MSG="║ T{t} : Offline (not configured)"
        {% endif %}
    {% endfor %}
    
    RESPOND MSG="╚══════════════════════════════════════════════════╝"

#####################################################################
#  3. Batch Sensor Verification Macro
#####################################################################

[gcode_macro CHECK_ALL_SENSORS]
description: Batch check all sensor states (15 filament sensors + endstops + temperatures)
gcode:
    RESPOND MSG="╔══════════════════════════════════════════════════════════════╗"
    RESPOND MSG="║  All Sensor Status Check                                     ║"
    RESPOND MSG="╠══════════════════════════════════════════════════════════════╣"

    # Endstops
    RESPOND MSG="║  ── Endstops ──"
    QUERY_ENDSTOPS

    RESPOND MSG="║"
    RESPOND MSG="║  ── Filament Sensors (15 total) ──"
    RESPOND MSG="║  Lane │ BT prep │ TH entry │ TH toolhead │"
    RESPOND MSG="║  ─────┼─────────┼──────────┼─────────────│"

    {% for i in range(5) %}
        {% set prep = "filament_switch_sensor bt_lane" ~ i ~ "_prep" %}
        {% set entry = "filament_switch_sensor T" ~ i ~ "_runout_entry" %}
        {% set th = "filament_switch_sensor T" ~ i ~ "_runout_toolhead" %}
        {% set p = "●" if (printer[prep] is defined and printer[prep].filament_detected) else "○" %}
        {% set e = "●" if (printer[entry] is defined and printer[entry].filament_detected) else "○" %}
        {% set t = "●" if (printer[th] is defined and printer[th].filament_detected) else "○" %}
        RESPOND MSG="║  T{i}   │    {p}    │    {e}     │      {t}      │"
    {% endfor %}

    RESPOND MSG="║  ─────┴─────────┴──────────┴─────────────│"
    RESPOND MSG="║  ● = Triggered  ○ = Open                    │"
    RESPOND MSG="║"

    # Temperature sensors
    RESPOND MSG="║  ── Temperature Sensors ──"
    {% for i in range(5) %}
        {% set heater = "extruder" if i == 0 else "extruder" ~ i %}
        {% set temp = printer[heater].temperature|default(0)|round(1) %}
        {% set target = printer[heater].target|default(0)|round(0)|int %}
        RESPOND MSG="║  T{i} Hotend: {temp}°C (Target: {target}°C)"
    {% endfor %}
    {% set bed_temp = printer.heater_bed.temperature|default(0)|round(1) %}
    {% set bed_target = printer.heater_bed.target|default(0)|round(0)|int %}
    RESPOND MSG="║  Bed: {bed_temp}°C (Target: {bed_target}°C)"
    {% if printer["temperature_fan chamber"] is defined %}
        {% set chamber = printer["temperature_fan chamber"].temperature|default(0)|round(1) %}
        RESPOND MSG="║  Chamber: {chamber}°C"
    {% endif %}

    RESPOND MSG="╚══════════════════════════════════════════════════════════════╝"

#####################################################################
#  4. Tool Change Test Macros
#####################################################################

[gcode_macro TEST_TOOL_CHANGE]
description: Test pickup/dropoff cycle for a specified tool
# Usage: TEST_TOOL_CHANGE TOOL=0
#        TEST_TOOL_CHANGE TOOL=0 REPEAT=3
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set REPEAT = params.REPEAT|default(1)|int %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing required..."
        G28
    {% endif %}

    RESPOND MSG="╔══════════════════════════════════════╗"
    RESPOND MSG="║  T{TOOL} Tool Change Test ({REPEAT}x)        ║"
    RESPOND MSG="╚══════════════════════════════════════╝"

    {% for i in range(REPEAT) %}
        RESPOND MSG="── Cycle {i+1}/{REPEAT} ──"
        RESPOND MSG="  Picking up T{TOOL}..."
        M117 Test: T{TOOL} pick {i+1}/{REPEAT}
        SELECT_TOOL T={TOOL}
        G4 P1000

        RESPOND MSG="  Dropping off T{TOOL}..."
        M117 Test: T{TOOL} drop {i+1}/{REPEAT}
        UNSELECT_TOOL
        G4 P1000
    {% endfor %}

    RESPOND MSG="T{TOOL} tool change test complete ({REPEAT}x)"
    M117 Tool test done

[gcode_macro TEST_ALL_TOOLS]
description: Sequential pickup/dropoff test for T0~T4 (post-assembly verification)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing required..."
        G28
    {% endif %}

    RESPOND MSG="╔══════════════════════════════════════╗"
    RESPOND MSG="║  Sequential All-Tools Test (T0->T4)  ║"
    RESPOND MSG="╚══════════════════════════════════════╝"

    {% for i in range(5) %}
        RESPOND MSG="── Testing T{i} ({i+1}/5) ──"
        M117 Testing T{i}...
        SELECT_TOOL T={i}
        G4 P2000
        UNSELECT_TOOL
        G4 P1000
        RESPOND MSG="  T{i} complete OK"
    {% endfor %}

    RESPOND MSG="═══ All Tools Test Complete ═══"
    M117 All tools OK

