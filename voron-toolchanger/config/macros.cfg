#####################################################################
#  7. Input Shaper Measurement Macros
#####################################################################

[gcode_macro MEASURE_RESONANCE]
description: Measure Input Shaper resonance for a specific tool (auto-switches LIS2DW chip)
# Usage: MEASURE_RESONANCE TOOL=0
#        MEASURE_RESONANCE TOOL=0 AXIS=x
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set AXIS = params.AXIS|default("both")|string|lower %}

    # Per-tool accelerometer chip mapping (T0~T4 all use lis2dw T*_accel)
    {% set accel_chips = {0: "lis2dw T0_accel", 1: "lis2dw T1_accel", 2: "lis2dw T2_accel", 3: "lis2dw T3_accel", 4: "lis2dw T4_accel"} %}
    {% set chip = accel_chips[TOOL] %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SELECT_TOOL T={TOOL}

    # Move to measurement position (bed center)
    G90
    G1 X175 Y175 Z50 F6000

    RESPOND MSG="Measuring Input Shaper for T{TOOL}... (Accelerometer: {chip})"
    M117 Shaper: T{TOOL} measuring...

    {% if AXIS == "x" or AXIS == "both" %}
        RESPOND MSG="  Measuring X axis..."
        TEST_RESONANCES AXIS=X CHIPS="{chip}"
    {% endif %}

    {% if AXIS == "y" or AXIS == "both" %}
        RESPOND MSG="  Measuring Y axis..."
        TEST_RESONANCES AXIS=Y CHIPS="{chip}"
    {% endif %}

    RESPOND MSG="T{TOOL} resonance measurement complete!"
    RESPOND MSG="Analyze results: ~/klipper/scripts/calibrate_shaper.py /tmp/resonances_*.csv -o /tmp/shaper_T{TOOL}.png"
    RESPOND MSG="Enter the results into params_input_shaper_* in T{TOOL}.cfg."
    M117 Shaper T{TOOL} done

[gcode_macro MEASURE_ALL_RESONANCE]
description: Sequentially measure Input Shaper resonances for all tools (T0~T4)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    RESPOND MSG="═══ Starting Resonance Measurement for All Tools (T0~T4) ═══"

    {% for i in range(5) %}
