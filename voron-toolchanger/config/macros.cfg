#####################################################################
#  12. Toolhead LED Status System
#####################################################################
#  Automatically changes the color of the 3 WS2812B LEDs (1=logo, 2~3=nozzle)
#  on each toolhead (T0~T4) based on printer state.
#
#  Color Legend:
#  ● White: Active tool (currently mounted)
#  ● Blue: Homing / Calibrating
#  ● Green: Printing
#  ● Orange: Heating
#  ● Red: Error / Paused
#  ● Purple: Parked in dock (standby tool)
#  ● OFF: Printer idle

[gcode_macro SET_TOOL_LEDS]
description: Set LED color for a specific toolhead
# Usage: SET_TOOL_LEDS TOOL=0 R=1.0 G=1.0 B=1.0
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set R = params.R|default(0)|float %}
    {% set G = params.G|default(0)|float %}
    {% set B = params.B|default(0)|float %}
    {% set led_name = "T" ~ TOOL ~ "_leds" %}

    SET_LED LED={led_name} RED={R} GREEN={G} BLUE={B}

[gcode_macro ALL_TOOL_LEDS_OFF]
description: Turn off all toolhead LEDs
gcode:
    {% for i in range(5) %}
        SET_LED LED=T{i}_leds RED=0 GREEN=0 BLUE=0
    {% endfor %}

[gcode_macro ALL_TOOL_LEDS_ON]
description: Set all toolhead LEDs to white
gcode:
    {% for i in range(5) %}
        SET_LED LED=T{i}_leds RED=0.3 GREEN=0.3 BLUE=0.3
    {% endfor %}

[gcode_macro _SET_ACTIVE_TOOL_LED]
description: Set active tool LED to specified color and remaining tools to standby color (internal)
# Internal call: _SET_ACTIVE_TOOL_LED R=0 G=1.0 B=0
gcode:
    {% set R = params.R|default(1.0)|float %}
    {% set G = params.G|default(1.0)|float %}
    {% set B = params.B|default(1.0)|float %}
    {% set IDLE_R = params.IDLE_R|default(0.05)|float %}
    {% set IDLE_G = params.IDLE_G|default(0)|float %}
    {% set IDLE_B = params.IDLE_B|default(0.1)|float %}

    {% if printer.toolchanger is defined %}
        {% set active = printer.toolchanger.tool_number|default(-1) %}
        {% for i in range(5) %}
            {% if i == active %}
                SET_LED LED=T{i}_leds RED={R} GREEN={G} BLUE={B}
            {% else %}
                SET_LED LED=T{i}_leds RED={IDLE_R} GREEN={IDLE_G} BLUE={IDLE_B}
            {% endif %}
        {% endfor %}
    {% endif %}

[gcode_macro _LED_HOMING]
description: LED homing state (blue)
gcode:
    {% for i in range(5) %}
        SET_LED LED=T{i}_leds RED=0 GREEN=0 BLUE=0.5
    {% endfor %}

[gcode_macro _LED_HEATING]
description: LED heating state (orange)
gcode:
    _SET_ACTIVE_TOOL_LED R=1.0 G=0.3 B=0

[gcode_macro _LED_PRINTING]
description: LED printing state (active=green, standby=purple)
gcode:
    _SET_ACTIVE_TOOL_LED R=0 G=0.8 B=0 IDLE_R=0.05 IDLE_G=0 IDLE_B=0.1

[gcode_macro _LED_PAUSED]
description: LED paused state (solid red)
gcode:
    {% for i in range(5) %}
        SET_LED LED=T{i}_leds RED=0.8 GREEN=0 BLUE=0
    {% endfor %}

[gcode_macro _LED_COMPLETE]
description: LED print complete state (active=white, others=off)
gcode:
    _SET_ACTIVE_TOOL_LED R=0.5 G=0.5 B=0.5 IDLE_R=0 IDLE_G=0 IDLE_B=0

[gcode_macro _LED_ERROR]
description: LED error state (all red)
gcode:
    {% for i in range(5) %}
        SET_LED LED=T{i}_leds RED=1.0 GREEN=0 BLUE=0
    {% endfor %}

[gcode_macro _LED_CALIBRATING]
description: LED calibrating state (cyan)
gcode:
    _SET_ACTIVE_TOOL_LED R=0 G=0.6 B=0.8

#####################################################################
#  13. Per-Tool Fan Synchronization Macros
#####################################################################
#  Automatically switches part cooling fans on toolchange in a multi-tool printer.
#  Turns off the outgoing tool's part cooling fan and sets the incoming tool's fan to the previous speed.

[gcode_macro _SYNC_TOOL_FANS]
description: Synchronize part cooling fans during toolchange (internal macro)
# Usage: _SYNC_TOOL_FANS FROM=0 TO=1 SPEED=0.8
gcode:
    {% set FROM = params.FROM|default(-1)|int %}
    {% set TO = params.TO|default(0)|int %}
    {% set SPEED = params.SPEED|default(0)|float %}

    # Turn outgoing tool fan OFF
    {% if FROM >= 0 and FROM <= 5 %}
        SET_FAN_SPEED FAN=T{FROM}_part_fan SPEED=0
    {% endif %}

    # Set incoming tool fan to previous speed
    {% if TO >= 0 and TO <= 5 %}
        {% if SPEED > 0 %}
            SET_FAN_SPEED FAN=T{TO}_part_fan SPEED={SPEED}
        {% endif %}
    {% endif %}

    RESPOND MSG="Fan switch: T{FROM} OFF -> T{TO} {'%.0f'|format(SPEED*100)}%"

[gcode_macro SET_TOOL_FAN]
description: Set part cooling fan speed for a specific tool
# Usage: SET_TOOL_FAN TOOL=0 SPEED=1.0
#        SET_TOOL_FAN TOOL=2 SPEED=0.5
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set SPEED = params.SPEED|default(1.0)|float %}

    {% if TOOL >= 0 and TOOL <= 5 %}
        SET_FAN_SPEED FAN=T{TOOL}_part_fan SPEED={SPEED}
        RESPOND MSG="T{TOOL} part cooling fan: {'%.0f'|format(SPEED*100)}%"
    {% else %}
        RESPOND MSG="Invalid tool number: {TOOL} (0~5)"
    {% endif %}

[gcode_macro ALL_FANS_OFF]
description: Turn off part cooling fans on all tools
gcode:
    {% for i in range(5) %}
        SET_FAN_SPEED FAN=T{i}_part_fan SPEED=0
    {% endfor %}
    RESPOND MSG="All part cooling fans OFF"

#####################################################################
#  13-1. Material-Specific Cooldown Ventilation at Print End
#####################################################################
#  ABS/ASA: Prevent rapid chamber cooling -> keep exhaust OFF, start gradual ventilation after 5 min
#  PLA/PETG: Run exhaust immediately for fast cooling
#  * Automatically called from PRINT_END.

[gcode_macro _PRINT_END_COOLDOWN]
description: Material-specific cooldown ventilation control (called inside PRINT_END)
gcode:
    # Part cooling fans are already turned off by ALL_FANS_OFF;
    # only exhaust / filter fans are controlled here.

    # * Cancel any previous cooldown timer chain (prevents overlapping timers on back-to-back prints)
    UPDATE_DELAYED_GCODE ID=_DELAYED_EXHAUST DURATION=0
    UPDATE_DELAYED_GCODE ID=_DELAYED_EXHAUST_FULL DURATION=0
    UPDATE_DELAYED_GCODE ID=_DELAYED_FANS_OFF DURATION=0

    {% set state = printer["gcode_macro _PRINT_STATE"] %}
    {% set mat = state.last_material|default("NONE")|upper %}

    {% if mat in ["ABS", "ASA", "HS-ABS"] %}
        # ABS/ASA: Prevent thermal shock -> 5 min exhaust delay -> gradual ventilation
        UPDATE_DELAYED_GCODE ID=_DELAYED_EXHAUST DURATION=300
        RESPOND MSG="Cooldown: ABS/ASA mode — starting gradual ventilation in 5 min"
    {% elif mat in ["PLA", "PETG", "HS-PLA", "HS-PETG", "TPU"] %}
        # PLA/PETG/TPU: Immediate exhaust -> rapid cooling
        SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET=35
        SET_FAN_SPEED FAN=chamber_filter_fan SPEED=0
        UPDATE_DELAYED_GCODE ID=_DELAYED_FANS_OFF DURATION=600
        RESPOND MSG="Cooldown: PLA/PETG mode — immediate ventilation (OFF in 10 min)"
    {% else %}
        # Other materials: Conservative delayed ventilation
        UPDATE_DELAYED_GCODE ID=_DELAYED_EXHAUST DURATION=300
        RESPOND MSG="Cooldown: Default mode — starting ventilation in 5 min"
    {% endif %}

[delayed_gcode _DELAYED_EXHAUST]
initial_duration: 0
gcode:
    # After 5 min: Run exhaust gently + keep filter fan running
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET=45
    RESPOND MSG="Cooldown: Starting ventilation (chamber target 45°C)"

    # Full ventilation after an additional 5 min
    UPDATE_DELAYED_GCODE ID=_DELAYED_EXHAUST_FULL DURATION=300

[delayed_gcode _DELAYED_EXHAUST_FULL]
initial_duration: 0
gcode:
    # After 10 min: Full exhaust + filter fan OFF
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET=30
    SET_FAN_SPEED FAN=chamber_filter_fan SPEED=0
    RESPOND MSG="Cooldown: Full ventilation (chamber target 30°C, filter OFF)"

    # All fans OFF after 15 min total
    UPDATE_DELAYED_GCODE ID=_DELAYED_FANS_OFF DURATION=300

[delayed_gcode _DELAYED_FANS_OFF]
initial_duration: 0
gcode:
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET=80
    SET_FAN_SPEED FAN=chamber_filter_fan SPEED=0
    LIGHTS_OFF
    RESPOND MSG="Cooldown complete: All systems OFF"

#####################################################################
#  14. Pre-Print Tool Verification Macros
#####################################################################
#  Safety macro that verifies all required tools are properly seated in their docks
#  before starting a multi-tool print by running a quick pickup/dropoff cycle.

[gcode_macro VERIFY_ALL_TOOLS]
description: Pre-print dock verification for all tools (quick pickup/dropoff cycle)
# Usage: VERIFY_ALL_TOOLS
#        VERIFY_ALL_TOOLS TOOLS="0,1,3"    <- Verify specific tools only
gcode:
    {% set TOOLS_STR = params.TOOLS|default("0,1,2,3,4")|string %}
    {% set tool_list = TOOLS_STR.split(",") %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing required..."
        G28
    {% endif %}

    RESPOND MSG="╔══════════════════════════════════════════════╗"
    RESPOND MSG="║  Starting Pre-Print Tool Verification        ║"
    RESPOND MSG="║  Targets: T{TOOLS_STR}                        ║"
    RESPOND MSG="╚══════════════════════════════════════════════╝"
    _LED_CALIBRATING

    {% set ns = namespace(errors=0) %}

    {% for t in tool_list %}
        {% set tool_num = t|trim|int %}
        RESPOND MSG="── Verifying T{tool_num}... ──"
        M117 Verify T{tool_num}...

        # Pickup test
        SELECT_TOOL T={tool_num}
        G4 P500

        # Return to dock test
        UNSELECT_TOOL
        G4 P500

        RESPOND MSG="  T{tool_num} OK"
    {% endfor %}

    RESPOND MSG="═══════════════════════════════════════════════"
    RESPOND MSG="  All Tools Verified — Ready to Print"
    RESPOND MSG="═══════════════════════════════════════════════"
    M117 All tools verified
    ALL_TOOL_LEDS_ON

[gcode_macro VERIFY_PRINT_TOOLS]
description: Verify only the tools used by the slicer job (called before PRINT_START)
# Usage: VERIFY_PRINT_TOOLS TOOLS="0,2,4"
gcode:
    {% set TOOLS_STR = params.TOOLS|default("0")|string %}
    VERIFY_ALL_TOOLS TOOLS={TOOLS_STR}

#####################################################################
#  15. Speed / Acceleration Test Macro
#####################################################################
#  Test pattern for validating maximum velocity and acceleration limits
#  within a safe travel boundary without using FORCE_MOVE.

[gcode_macro SPEED_TEST]
description: Travel velocity / acceleration limit test
# Usage: SPEED_TEST                      <- Default (300mm/s, 3000mm/s^2)
#        SPEED_TEST SPEED=500 ACCEL=5000 <- High-speed test
#        SPEED_TEST SPEED=200 ITERATIONS=50 <- Endurance test
gcode:
    {% set SPEED = params.SPEED|default(300)|int %}
    {% set ACCEL = params.ACCEL|default(3000)|int %}
    {% set ITERATIONS = params.ITERATIONS|default(20)|int %}
    {% set BOUND = params.BOUND|default(40)|int %}

    # Calculate safe bounding box (based on 350mm bed)
    {% set x_min = BOUND %}
    {% set x_max = 350 - BOUND %}
    {% set y_min = BOUND %}
    {% set y_max = 350 - BOUND %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing required..."
        G28
    {% endif %}

    # Save current acceleration limit
    {% set old_accel = printer.toolhead.max_accel %}

    RESPOND MSG="╔══════════════════════════════════════════════╗"
    RESPOND MSG="║  Starting Speed Test                         ║"
    RESPOND MSG="║  Speed: {SPEED}mm/s  Accel: {ACCEL}mm/s²         ║"
    RESPOND MSG="║  Iterations: {ITERATIONS}x  Margin: {BOUND}mm      ║"
    RESPOND MSG="╚══════════════════════════════════════════════╝"
    M117 Speed test...

    # Set test acceleration
    SET_VELOCITY_LIMIT ACCEL={ACCEL}

    # Start position (center)
    G90
    G1 X175 Y175 Z50 F6000
    G4 P1000

    # ── Diagonal travel test ──
    RESPOND MSG="Diagonal travel test ({ITERATIONS}x)..."
    {% for i in range(ITERATIONS) %}
        G1 X{x_min} Y{y_min} F{SPEED * 60}
        G1 X{x_max} Y{y_max} F{SPEED * 60}
        G1 X{x_min} Y{y_max} F{SPEED * 60}
        G1 X{x_max} Y{y_min} F{SPEED * 60}
    {% endfor %}

    # ── X-axis reciprocating test ──
    RESPOND MSG="X-axis reciprocating test..."
    G1 X175 Y175 F6000
    {% for i in range(ITERATIONS) %}
        G1 X{x_min} F{SPEED * 60}
        G1 X{x_max} F{SPEED * 60}
    {% endfor %}

    # ── Y-axis reciprocating test ──
    RESPOND MSG="Y-axis reciprocating test..."
    G1 X175 Y175 F6000
    {% for i in range(ITERATIONS) %}
        G1 Y{y_min} F{SPEED * 60}
        G1 Y{y_max} F{SPEED * 60}
    {% endfor %}

    # Restore original acceleration limit
    SET_VELOCITY_LIMIT ACCEL={old_accel}

    # Return to center
    G1 X175 Y175 F6000

    RESPOND MSG="═══════════════════════════════════════════════"
    RESPOND MSG="  Speed test complete!"
    RESPOND MSG="  Check for any skipped steps."
    RESPOND MSG="  To verify: Re-home with G28 and compare XY position."
    RESPOND MSG="═══════════════════════════════════════════════"
    M117 Speed test done

#####################################################################
#  16. Material Temperature Preset Macros
#####################################################################
#  Automatically sets BED/HOTEND/chamber temperatures by MATERIAL name.
#  Usage: MATERIAL_PRESET MATERIAL=ABS
#         MATERIAL_PRESET MATERIAL=HS-PLA

#####################################################################
#  * Single Source of Truth for Material Temperatures (_MATERIAL_DB)
#####################################################################
#  Shared across loading, unloading, changeover, and preheat presets.
#    - print  : Manual preheat target temperature (actual print temp is passed by slicer)
#    - load   : Hotend temperature during filament loading
#    - unload : Unloading / tip-forming temperature (slightly higher than print to melt residue)
#    - pull   : Cold pull extraction temperature
#    - bed/chamber : Bed and chamber temperatures
[gcode_macro _MATERIAL_DB]
description: Single-source material temperature table
variable_db:
    {
        "PLA":     {"bed": 60,  "print": 200, "load": 215, "unload": 215, "pull": 90,  "chamber": 0},
        "PETG":    {"bed": 80,  "print": 230, "load": 235, "unload": 235, "pull": 100, "chamber": 0},
        "ABS":     {"bed": 110, "print": 250, "load": 250, "unload": 255, "pull": 130, "chamber": 50},
        "ASA":     {"bed": 110, "print": 250, "load": 250, "unload": 255, "pull": 130, "chamber": 50},
        "TPU":     {"bed": 50,  "print": 220, "load": 225, "unload": 225, "pull": 110, "chamber": 0},
        "NYLON":   {"bed": 80,  "print": 260, "load": 260, "unload": 265, "pull": 140, "chamber": 0},
        "HS-PLA":  {"bed": 65,  "print": 220, "load": 225, "unload": 225, "pull": 95,  "chamber": 0},
        "HS-ABS":  {"bed": 110, "print": 270, "load": 270, "unload": 275, "pull": 140, "chamber": 50},
        "HS-PETG": {"bed": 85,  "print": 250, "load": 250, "unload": 250, "pull": 105, "chamber": 0}
    }
gcode:
    RESPOND MSG="Supported materials: PLA, PETG, ABS, ASA, TPU, NYLON, HS-PLA, HS-ABS, HS-PETG"

[gcode_macro MATERIAL_PRESET]
description: Apply automatic material temperature preset (for manual preheating)
gcode:
    {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set heater = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}

    {% if MATERIAL in db %}
        {% set p = db[MATERIAL] %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={p.bed}
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET={p.print}
        RESPOND MSG="Preset applied: {MATERIAL} / BED:{p.bed}°C / HOTEND:{p.print}°C / T{TOOL}"
        M117 Preset: {MATERIAL}
    {% else %}
        RESPOND MSG="Unknown material: {MATERIAL}"
        RESPOND MSG="Supported: PLA, PETG, ABS, ASA, TPU, NYLON, HS-PLA, HS-ABS, HS-PETG"
    {% endif %}

#####################################################################
#  17. Multi-Tool Parallel Preheating Macros
#####################################################################
#  Preheats the next tool ahead of time during multi-color prints to reduce swap time.
#  Usage: PREHEAT_NEXT_TOOL TOOL=2 TEMP=250
#         PREHEAT_NEXT_TOOL TOOL=1              (default 200°C)

[gcode_macro PREHEAT_NEXT_TOOL]
description: Preheat the next scheduled tool ahead of time (reduces toolchange wait)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set TEMP = params.TEMP|default(200)|float %}

    {% if TOOL < 0 or TOOL > 5 %}
        { action_raise_error("PREHEAT_NEXT_TOOL: Valid tool number is 0~5 (input: T%d)" % TOOL) }
    {% endif %}

    {% set heater = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    # Skip if already mounted as the active tool
    {% if printer.toolchanger is defined %}
        {% set current = printer.toolchanger.tool_number|default(-1) %}
        {% if current == TOOL %}
            RESPOND MSG="T{TOOL} is already the active mounted tool"
        {% else %}
            SET_HEATER_TEMPERATURE HEATER={heater} TARGET={TEMP}
            RESPOND MSG="T{TOOL} preheat started: {TEMP}°C (awaiting toolchange)"
        {% endif %}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET={TEMP}
        RESPOND MSG="T{TOOL} preheat started: {TEMP}°C"
    {% endif %}

[gcode_macro COOLDOWN_IDLE_TOOLS]
description: Turn off heaters on all unmounted idle tools (saves power)
gcode:
    {% if printer.toolchanger is defined %}
        {% set current = printer.toolchanger.tool_number|default(-1) %}
        {% for i in range(5) %}
            {% if i != current %}
                {% set heater = "extruder" if i == 0 else "extruder" ~ i %}
                {% if printer[heater] is defined and printer[heater].target > 0 %}
                    SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
                    RESPOND MSG="T{i} cooldown: Idle tool heater OFF"
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}

#####################################################################
#  18. Layer Change Event Hooks
#####################################################################
#  Called from Slicer Before/After Layer Change G-code.
#  OrcaSlicer configuration:
#    Before layer change: BEFORE_LAYER_CHANGE LAYER=[layer_num] HEIGHT=[layer_z]
#    After layer change:  AFTER_LAYER_CHANGE

[gcode_macro BEFORE_LAYER_CHANGE]
description: Before layer change event hook (called from slicer)
variable_current_layer: 0
variable_current_height: 0
variable_total_layers: 0
gcode:
    {% set LAYER = params.LAYER|default(0)|int %}
    {% set HEIGHT = params.HEIGHT|default(0)|float %}
    {% set TOTAL = params.TOTAL|default(0)|int %}

    M400    # Wait for previous layer moves to finish (for timelapse accuracy)

    SET_GCODE_VARIABLE MACRO=BEFORE_LAYER_CHANGE VARIABLE=current_layer VALUE={LAYER}
    SET_GCODE_VARIABLE MACRO=BEFORE_LAYER_CHANGE VARIABLE=current_height VALUE={HEIGHT}
    {% if TOTAL > 0 %}
        SET_GCODE_VARIABLE MACRO=BEFORE_LAYER_CHANGE VARIABLE=total_layers VALUE={TOTAL}
    {% endif %}

    # Timelapse frame capture (when timelapse plugin is enabled)
    # TIMELAPSE_TAKE_FRAME

    # Report status every 50 layers
    {% if LAYER > 0 and LAYER % 50 == 0 %}
        {% set bed_temp = printer.heater_bed.temperature|round(1) %}
        {% set total_l = printer["gcode_macro BEFORE_LAYER_CHANGE"].total_layers %}
        {% set progress = (LAYER / total_l * 100)|round(0) if total_l > 0 else "?" %}
        RESPOND MSG="── Layer {LAYER}/{total_l} (Z={HEIGHT}mm) | Bed:{bed_temp}°C | Progress:{progress}% ──"
    {% endif %}

[gcode_macro AFTER_LAYER_CHANGE]
description: After layer change event hook (called from slicer)
gcode:
    # Extension point: adjust fan speeds or temperatures at specific layers
    {% set layer = printer["gcode_macro BEFORE_LAYER_CHANGE"] %}

#####################################################################
#  19. Conditional Purge Skip (Consecutive Same-Tool Prints)
#####################################################################
#  Skips purging if the print uses the exact same tool + material as the previous job.

[gcode_macro _PRINT_STATE]
description: Print state tracking variables (internal macro)
variable_last_tool: -1
variable_last_material: "NONE"
variable_print_count: 0
gcode:
    # State storage only - do not call directly

#####################################################################
#  20. Z Thermal Drift Compensation Macros
#####################################################################
#  * Disabled by default after migrating to the non-contact shuttle IR probe.

[gcode_macro Z_THERMAL_ADJUST]
description: (DEPRECATED) Legacy macro-based Z thermal drift compensation — disabled with IR probe.
variable_base_temp: 0
variable_last_adjustment: 0
variable_offset_per_degree: -0.008     # * Initial -0.008mm/C — calibrate on actual printer if used
gcode:
    {% set is_printing = printer.idle_timeout.state == "Printing" %}
    {% set use_move = 0 if (is_printing and params.AUTO is not defined) else 1 %}

    {% set current_temp = printer["temperature_fan chamber"].temperature|default(25) %}
    {% set base = printer["gcode_macro Z_THERMAL_ADJUST"].base_temp %}
    {% set coeff = printer["gcode_macro Z_THERMAL_ADJUST"].offset_per_degree %}
    {% set prev_adj = printer["gcode_macro Z_THERMAL_ADJUST"].last_adjustment %}

    {% if base == 0 %}
        SET_GCODE_VARIABLE MACRO=Z_THERMAL_ADJUST VARIABLE=base_temp VALUE={current_temp}
        SET_GCODE_VARIABLE MACRO=Z_THERMAL_ADJUST VARIABLE=last_adjustment VALUE=0
        RESPOND MSG="Z drift compensation: Base temperature set to {current_temp|round(1)}°C"
    {% else %}
        {% set delta = current_temp - base %}
        {% set target_adj = delta * coeff %}
        {% set incremental = target_adj - prev_adj %}
        {% if delta|abs > 3 and incremental|abs > 0.001 %}
            SET_GCODE_OFFSET Z_ADJUST={incremental} MOVE={use_move}
            SET_GCODE_VARIABLE MACRO=Z_THERMAL_ADJUST VARIABLE=last_adjustment VALUE={target_adj}
            RESPOND MSG="Z drift: dT={delta|round(1)}°C -> Z cumulative {target_adj|round(4)}mm (step {incremental|round(4)}mm)"
        {% endif %}
    {% endif %}

[gcode_macro RESET_THERMAL_ADJUST]
description: Reset Z thermal drift compensation baseline temperature
gcode:
    SET_GCODE_VARIABLE MACRO=Z_THERMAL_ADJUST VARIABLE=base_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=Z_THERMAL_ADJUST VARIABLE=last_adjustment VALUE=0
    RESPOND MSG="Z drift compensation: Baseline temperature reset"

#####################################################################
#  21. Low Filament Warning System
#####################################################################
#  Tracks estimated filament usage and warns when approaching threshold.

[gcode_macro SET_FILAMENT_ESTIMATE]
description: Set total estimated filament length required for current print (called from slicer)
# Add to OrcaSlicer Start G-code:
#   SET_FILAMENT_ESTIMATE TOTAL_MM={filament_used_mm}
# or:
#   SET_FILAMENT_ESTIMATE TOTAL_M={filament_used_m}
variable_total_length_mm: 0
variable_used_length_mm: 0
variable_warning_threshold: 90
gcode:
    {% if params.TOTAL_MM is defined %}
        {% set TOTAL = params.TOTAL_MM|float %}
    {% elif params.TOTAL_M is defined %}
        {% set TOTAL = params.TOTAL_M|float * 1000 %}
    {% elif params.TOTAL_LENGTH is defined %}
        {% set TOTAL = params.TOTAL_LENGTH|float %}
        {% if TOTAL < 10 %}
            {% set TOTAL = TOTAL * 1000 %}
        {% endif %}
    {% else %}
        {% set TOTAL = 0 %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SET_FILAMENT_ESTIMATE VARIABLE=total_length_mm VALUE={TOTAL}
    SET_GCODE_VARIABLE MACRO=SET_FILAMENT_ESTIMATE VARIABLE=used_length_mm VALUE=0
    {% if TOTAL > 0 %}
        RESPOND MSG="Filament estimate: Total {(TOTAL/1000)|round(1)}m required"
    {% endif %}

[gcode_macro CHECK_FILAMENT_USAGE]
description: Check filament usage progress (called from BEFORE_LAYER_CHANGE)
gcode:
    {% set est = printer["gcode_macro SET_FILAMENT_ESTIMATE"] %}
    {% set total = est.total_length_mm %}
    {% set layer_info = printer["gcode_macro BEFORE_LAYER_CHANGE"] %}
    {% set layer = layer_info.current_layer %}

    {% if total > 0 and params.TOTAL_LAYERS is defined %}
        {% set total_layers = params.TOTAL_LAYERS|int %}
        {% if total_layers > 0 %}
            {% set usage_pct = (layer / total_layers * 100)|round(0) %}
            {% if usage_pct >= est.warning_threshold|int %}
                RESPOND MSG="WARNING: Filament usage ~{usage_pct}%: Please check remaining spool weight"
            {% endif %}
        {% endif %}
    {% endif %}

#####################################################################
#  Tap Probe Activation Helper (klipper-toolchanger-easy compatible)
#####################################################################
#  Called from tool_probe activate_gcode in each T*.cfg.
#  Limits hotend temperature to 150C during Tap probing to prevent nozzle oozing.

[gcode_macro _TAP_PROBE_ACTIVATE]
description: Limit hotend temperature during Tap probing (internal macro)
gcode:
    {% set HEATER = params.HEATER|default("extruder")|string %}
    {% set max_tap_temp = 150 %}

    {% if printer[HEATER].temperature > max_tap_temp + 5 %}
        RESPOND MSG="Tap probing: {HEATER} exceeds {max_tap_temp}°C - waiting for cooldown..."
        SET_HEATER_TEMPERATURE HEATER={HEATER} TARGET={max_tap_temp}
        TEMPERATURE_WAIT SENSOR={HEATER} MAXIMUM={max_tap_temp} TIMEOUT=300
    {% endif %}

#####################################################################
#  29. Smart Purge & Wipe by Material
#####################################################################
[gcode_macro CLEAN_NOZZLE_DYNAMIC]
description: Dynamically adjust brush wipe cycles depending on filament material
gcode:
    {% set qty = params.QTY|default(3)|int %}
    {% set vars = printer["gcode_macro _PRINT_STATE"] %}
    {% set mat = vars.last_material|default("PLA")|upper %}
    
    # Default wipe count (PLA, ABS, etc.)
    {% set wipe_qty = qty %}
    
    # Double wipe count for sticky materials like PETG, TPU
    {% if mat in ["PETG", "HS-PETG", "TPU"] %}
        {% set wipe_qty = qty * 2 %}
        RESPOND MSG="Smart Wipe: {mat} material detected -> Increasing wipes to {wipe_qty}"
    {% elif mat in ["ABS", "ASA"] %}
        # Cleaner materials like ABS/ASA require fewer wipes
        {% set wipe_qty = (qty * 0.8)|int %}
        {% if wipe_qty < 1 %} {% set wipe_qty = 1 %} {% endif %}
        RESPOND MSG="Smart Wipe: {mat} material detected -> Reducing wipes to {wipe_qty}"
    {% else %}
        RESPOND MSG="Smart Wipe: Default {mat} material -> Wipes: {wipe_qty}"
    {% endif %}
    
    # Call actual CLEAN_NOZZLE (brush action) from Klipper-Toolchanger-Easy
    # If existing CLEAN_NOZZLE macro exists, pass arguments
    # Otherwise write G-code here
    
    # This example assumes reciprocal travel distance along X
    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
    G90
    G0 Z15 F2000
    # Brush bristle center: X=247, Y=349, Z=2.0 (physically measured)
    # Brush wipe start point (left end of X)
    G0 X220 Y349 F12000
    G0 Z2.0 F1500
    
    {% for i in range(wipe_qty) %}
        G0 X270 Y349 F18000      # Stroke through to guide end (right)
        G0 X220 Y349 F18000      # Return to left
    {% endfor %}
    
    G0 Z15 F2000
    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
    RESPOND MSG="  Nozzle wiping complete"

#####################################################################
#  30. Dynamic Color-Transition Purge
#####################################################################
[gcode_macro DYNAMIC_PURGE]
description: Smartly calculates purge amount by comparing previous and next tool colors (minimum volume based on direct drive).
gcode:
    {% set PREV_TOOL = params.PREV_TOOL|default(-1)|int %}
    {% set NEXT_TOOL = params.NEXT_TOOL|default(0)|int %}
    
    # Brightness value per tool (0: pure black, 100: pure white) - configurable whenever user changes filament
    # Example: T0(black)=10, T1(red)=40, T2(blue)=30, T3(white)=90, T4(gray)=60 (default=50)
    {% set tool_brightness = [10, 40, 30, 90, 60, 50] %}

    # Base purge amount
    {% set base_purge = 20 %}
    {% set purge_qty = base_purge %}

    {% if PREV_TOOL >= 0 and PREV_TOOL < 6 and NEXT_TOOL >= 0 and NEXT_TOOL < 6 %}
        {% set brightness_diff = tool_brightness[NEXT_TOOL] - tool_brightness[PREV_TOOL] %}
        
        # Previous tool dark and next tool light (black -> white)
        {% if brightness_diff > 20 %}
            {% set purge_qty = base_purge + 40 %}
            RESPOND MSG="Dynamic Purge: Dark ({PREV_TOOL}) to light ({NEXT_TOOL}) transition. Significantly increased purge: {purge_qty}mm"
        # Previous tool light and next tool dark (white -> black)
        {% elif brightness_diff < -20 %}
            {% set purge_qty = 10 %}
            RESPOND MSG="Dynamic Purge: Light ({PREV_TOOL}) to dark ({NEXT_TOOL}) transition. Minimized purge: {purge_qty}mm"
        {% else %}
            RESPOND MSG="Dynamic Purge: Similar brightness transition. Standard purge: {purge_qty}mm"
        {% endif %}
    {% else %}
        RESPOND MSG="Dynamic Purge: No previous tool info. Default purge: {purge_qty}mm"
    {% endif %}

    # Perform actual extrusion (move over purge bucket then discharge)
    SAVE_GCODE_STATE NAME=DYNAMIC_PURGE_STATE
    G90
    G0 Z15 F2000             # Lift to avoid bed collision
    G0 X187 Y349 F12000      # Purge bucket fixed position
    G0 Z5 F1500              # Dropping purge height
    
    M83
    G1 E{purge_qty} F300     # Extrude calculated purge amount
    G1 E-2 F2400             # Retraction to prevent stringing
    G0 Z15 F2000             # Lift for travel
    RESTORE_GCODE_STATE NAME=DYNAMIC_PURGE_STATE


#####################################################################
#  31. Self-Healing Tool Verification upon Drop / Bad Engagement
#####################################################################
[gcode_macro VERIFY_TOOL_PICKUP]
description: Verifies tool engagement height at Z endstop (SexBolt) after pickup; retries on bad engagement.
gcode:
    {% set TOOL = params.TOOL|default("T0")|string %}
    {% set TARGET_Z = 1.0 %}  # SexBolt trigger height upon normal engagement (example)
    {% set TOLERANCE = 0.2 %} # Tolerance (mm)
    
    RESPOND MSG="Verifying {TOOL} engagement status..."
    
    # Move to SexBolt position and probe Z (virtual macro invocation structure)
    # In production, links coordinates and macros via the tools_calibrate plugin.
    # Assumes measurement result is stored in Z_RESULT variable (probing simulation).
    {% set Z_RESULT = 1.05 %} # Temporary mock value assuming normal engagement
    
    {% set diff = (Z_RESULT - TARGET_Z)|abs %}
    
    {% if diff > TOLERANCE %}
        RESPOND TYPE=error MSG="🚨 Tool engagement error detected! Error: {diff}mm. Returning current tool to dock and retrying pickup."
        # Return tool to dock
        # TOOL_DROPOFF (plugin default macro)
        # Wait 1s and re-pickup
        # G4 P1000
        # TOOL_PICKUP T={TOOL}
    {% else %}
        RESPOND MSG="[OK] {TOOL} verified. Error: {diff}mm (Normal)."
    {% endif %}

#####################################################################
#  32. Real-Time Frame Thermal Expansion Z Compensation
#####################################################################
[delayed_gcode _FRAME_THERMAL_COMP]
initial_duration: 60.0 # Run every 60 seconds
gcode:
    # Consider checking printer_state == 'printing' before executing
    {% set chamber_temp = printer["temperature_fan chamber"].temperature|default(25.0) %}
    
    # Compensation factor for nozzle sinking due to frame expansion per 1°C rise from 25°C baseline
    # (Coeff 0.001 must be tuned via physical calibration)
    {% set comp_coeff = 0.001 %}
    {% set base_temp = 25.0 %}
    
    {% if chamber_temp > base_temp %}
        {% set z_comp = (chamber_temp - base_temp) * comp_coeff %}
        # Set upper bound to prevent excessive compensation
        {% if z_comp > 0.15 %}
            {% set z_comp = 0.15 %}
        {% endif %}
        
        # Update internal state (needs absolute offset method to avoid runaway accumulation;
        # safest when synchronized with baseline capture at print start)
        # SET_GCODE_OFFSET Z_ADJUST={...}
        # RESPOND MSG="Thermal comp: Chamber {chamber_temp}°C -> Z offset {z_comp|round(3)}mm post-adjustment"
    {% endif %}
    
    UPDATE_DELAYED_GCODE ID=_FRAME_THERMAL_COMP DURATION=60.0

#####################################################################
#  33. Spaghetti Tactical Retreat Parking Mode
#####################################################################
[gcode_macro TACTICAL_RETREAT]
description: Returns tool to dock, parks at rear, and runs exhaust fan at 100% upon spaghetti detection.
gcode:
    RESPOND TYPE=error MSG="🚨 Spaghetti/Emergency detected! Starting tactical retreat."
    
    # 1. Turn off heaters (fire prevention)
    TURN_OFF_HEATERS
    
    # 2. Force tool dropoff (using toolchanger API)
    # T0 (tool release macro) or call plugin force-release macro
    # e.g. TOOL_DROPOFF_ALL
    RESPOND MSG="  -> Returning all toolheads to dock"
    
    # 3. Park Y axis safely at rear (select X position to avoid dock collision)
    G90
    G0 Z300 F1500  # Raise Z to maximum to avoid part collision
    G0 X175 Y340 F6000 # Retreat to rear center
    
    # 4. Run exhaust/chamber fan at 100% (vent fumes)
    # SET_FAN_SPEED FAN=chamber_fan SPEED=1.0 # (match actual fan name)
    RESPOND MSG="  -> Running chamber exhaust fan at 100%"
    
    # 5. Pause Klipper print
    PAUSE
    RESPOND TYPE=error MSG="🚫 Tactical retreat complete. Awaiting user in safe parking state."

#####################################################################
#  34. Chamber Pre-Heating via Bed
#####################################################################
[gcode_macro HEAT_CHAMBER]
description: Forced chamber pre-heat (macro using bed to raise chamber temperature)
gcode:
    {% set BED_TEMP = params.BED|default(110)|int %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(40)|int %}
    {% set SOAK_MINUTES = params.SOAK|default(0)|int %}

    RESPOND MSG="🔥 Starting chamber pre-heat mode"
    RESPOND MSG=" -> Target bed temp: {BED_TEMP}°C"
    RESPOND MSG=" -> Target chamber temp: {CHAMBER_TEMP}°C"
    
    # Bed heating
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    
    # Chamber fan target setting (circulation)
    SET_TEMPERATURE_FAN_TARGET temperature_fan=chamber TARGET={CHAMBER_TEMP}
    
    {% if SOAK_MINUTES > 0 %}
        RESPOND MSG=" -> Will hold for additional {SOAK_MINUTES} min after reaching target chamber temp."
        TEMPERATURE_WAIT SENSOR="temperature_fan chamber" MINIMUM={CHAMBER_TEMP}
        RESPOND MSG=" -> Target chamber temp reached. Starting {SOAK_MINUTES} min heat soak..."
        G4 P{SOAK_MINUTES * 60 * 1000}
    {% else %}
        RESPOND MSG=" -> Waiting until chamber reaches {CHAMBER_TEMP}°C. Send M108 to cancel."
        TEMPERATURE_WAIT SENSOR="temperature_fan chamber" MINIMUM={CHAMBER_TEMP}
    {% endif %}
    
    RESPOND MSG="[OK] Chamber pre-heat complete!"

# ==============================================================================
# Bambu-Style Filament Load/Unload Mode
# ==============================================================================
# Usage:
#   FILAMENT_LOAD_MODE TOOL=0 MATERIAL={params.MATERIAL|default("")} TEMP=200    → Start load mode
#   FILAMENT_UNLOAD_MODE TOOL=0 MATERIAL={params.MATERIAL|default("")} TEMP=200  → Start unload mode
#   FILAMENT_LOAD_CANCEL                  → Cancel in-progress load/unload
#
# Operation flow (Load):
#   1. Heat hotend → Wait for "Insert filament"
#   2. Entry sensor (gpio20, MDM switch) triggered → Extruder pulls filament automatically
#   3. Feeds in 5mm steps until reaching toolhead runout sensor (gpio24, between extruder and hotend)
#      → Stops, purges, and awaits color confirmation / Errors out if limit (400mm = MAX_STEPS 80 x 5) exceeded
#   ※ Stop trigger sensor = gpio17 (toolhead switch behind extruder). gpio16 is MDM motion (pulses)
#     and not suitable for stop detection. (Corrected from previous misassigned pin gpio20->gpio17)
#
# Operation flow (Unload):
#   1. Heat hotend → (If cutter present) cut, otherwise tip forming → retract → heater OFF

[gcode_macro _LOAD_MODE_STATE]
description: Load mode internal state variables
variable_tool: 0
variable_step: 0
variable_active: False
variable_mode: "load"
gcode:

[gcode_macro FILAMENT_LOAD_MODE]
description: Filament load mode (preheat -> pickup -> move to purge zone -> auto-load via entry sensor)
# ★ Reorganized: Move preheating to 'before pickup'.
#   Pickup path (toolchanger pickup_gcode) M109 waits on 'current target', so setting the target
#   before pickup provides a warm nozzle for stable docking and a single heating wait.
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default("")|string|upper %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}
    # Load temp from DB if material matched, otherwise TEMP parameter. min_extrude_temp(170) lower bound 175
    {% if MATERIAL in db %}
        {% set TEMP = [ db[MATERIAL].load|float, 175 ]|max %}
    {% else %}
        {% set TEMP = [ params.TEMP|default(200)|float, 175 ]|max %}
    {% endif %}

    # --- Safety guards ---
    {% if printer.idle_timeout.state == "Printing" %}
        RESPOND TYPE=error MSG="[ERR] Cannot use load mode during printing"
    {% elif TOOL < 0 or TOOL > 5 %}
        RESPOND TYPE=error MSG="[ERR] TOOL range error: 0~5"
    {% else %}
        {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

        # Cancel previous load mode + reset state
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=active VALUE=False
        G4 P500
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=tool VALUE={TOOL}
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE=0
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=active VALUE=True
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=mode VALUE='"load"'

        # Remember per-tool material (automatically used by unload/switch)
        {% if MATERIAL in db %}
            SAVE_VARIABLE VARIABLE=tool{TOOL}_material VALUE="'{MATERIAL}'"
            RESPOND MSG="[Load Mode] T{TOOL} = {MATERIAL} remembered ({TEMP}°C)"
        {% endif %}

        # ── Stage 1: Homing + QGL (ensure gantry level with empty shuttle via IR probe) ──
        {% if "xyz" not in printer.toolhead.homed_axes %}
            RESPOND MSG="[Load Mode] Running homing first..."
            G28
        {% endif %}
        {% if not printer.quad_gantry_level.applied %}
            RESPOND MSG="[Load Mode] Running QGL (empty shuttle, IR probe gantry leveling)..."
            QUAD_GANTRY_LEVEL
            G28 Z
        {% endif %}

        # ── Stage 2: ★ Start preheating first (set target temp, wait happens during pickup/travel) ──
        RESPOND MSG="🔥 [Load Mode] T{TOOL}: Preheating to {TEMP}°C (heats during pickup)..."
        M117 Preheat T{TOOL}...
        SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET={TEMP}

        # ── Stage 3: Mount tool onto shuttle (pickup M109 waits on above target temp) ──
        RESPOND MSG="[Load Mode] Mounting T{TOOL} to shuttle..."
        T{TOOL}
        ACTIVATE_EXTRUDER EXTRUDER={ext_name}
        
        # ── Stage 3.5: Force re-inject target temp immediately after pickup (prevents toolchanger 150C standby/active overwrite) ──
        SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET={TEMP}

        # ── Stage 4: Move above purge bucket (left bucket) (catches oozing filament during load) ──
        {% set vars = printer['gcode_macro _PURGE_BUCKET_VARS'] %}
        RESPOND MSG="🚿 [Load Mode] T{TOOL}: Moving to left purge bucket..."
        G90
        _SAFE_BUCKET_ENTRY TARGET=BUCKET
        M400

        # ── Stage 5: Ensure target temperature reached (mostly already reached during pickup) ──
        RESPOND MSG="🔥 [Load Mode] T{TOOL}: Confirming {TEMP}°C reached..."
        TEMPERATURE_WAIT SENSOR={ext_name} MINIMUM={TEMP - 5} TIMEOUT=600

        RESPOND MSG="📥 [Load Mode] T{TOOL}: Push filament into entry (within 2 minutes)"
        RESPOND MSG="   Waiting above purge bucket — safe even if oozing"
        M117 Insert filament T{TOOL}

        # ── Stage 6: Start entry sensor polling ──
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE=0
        UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_ENTRY DURATION=0.5
    {% endif %}

[delayed_gcode _LOAD_MODE_WAIT_ENTRY]
# Polls entry sensor (gpio20) every 0.5s until filament is inserted
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _LOAD_MODE_STATE"] %}
    {% if not state.active %}
        # Cancelled
    {% else %}
        {% set TOOL = state.tool %}
        {% set step = state.step %}
        {% set entry_sensor = "T" ~ TOOL ~ "_runout_entry" %}
        {% set sensor_name = "filament_switch_sensor " ~ entry_sensor %}

        {% if printer[sensor_name].filament_detected %}
            # Filament detected! Start fixed-distance feeding
            RESPOND MSG="[OK] [Load Mode] T{TOOL}: Filament detected! Starting auto-load..."
            M117 Loading T{TOOL}...
            _LOAD_MODE_FEED TOOL={TOOL}
        {% elif step >= 240 %}
            # Timeout (240 x 0.5s = 120s)
            {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
            RESPOND TYPE=error MSG="⏰ [Load Mode] T{TOOL}: No filament detected within 2 minutes. Turning off heater."
            SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET=0
            SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=active VALUE=False
            M117 Load timeout
        {% else %}
            SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE={step + 1}
            UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_ENTRY DURATION=0.5
        {% endif %}
    {% endif %}

[gcode_macro _LOAD_MODE_FEED]
description: Internal - Extruder feed until filament reaches toolhead runout sensor (dummy temp sensor)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
    ACTIVATE_EXTRUDER EXTRUDER={ext_name}
    SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE=0
    RESPOND MSG="  T{TOOL}: Extruder active — loading using dummy temperature sensor..."
    UPDATE_DELAYED_GCODE ID=_LOAD_MODE_FEED_STEP DURATION=0.1

[delayed_gcode _LOAD_MODE_FEED_STEP]
# Feed 5mm at a time, check if dummy temp sensor reached (<100°C).
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _LOAD_MODE_STATE"] %}
    {% if not state.active %}
        ; Cancelled
    {% else %}
        {% set TOOL = state.tool %}
        {% set step = state.step %}
        {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
        {% set FEED = 5.0 %}
        {% set MAX_STEPS = 80 %}
        
        # Read digital switch value (pressed = filament detected)
        {% set th_sensor = "filament_switch_sensor T" ~ TOOL ~ "_runout_toolhead" %}
        {% set reached = printer[th_sensor].filament_detected|default(False) %}

        {% if reached %}
            RESPOND MSG="[OK] [Load Mode] T{TOOL}: Runout sensor reached! (Fed ~{(step * FEED)|int}mm)"
            RESPOND MSG="  Primary purge + brush wiping..."
            PURGE_NOZZLE AMOUNT=100 BUCKET=left
            SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=mode VALUE='"confirm"'
            SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE=0
            RESPOND MSG="[?] Is the color clean? (60s timeout)"
            RESPOND MSG="   -> Yes (complete): FILAMENT_LOAD_CONFIRM   -> No (purge more): FILAMENT_LOAD_PURGE_MORE"
            M117 Check purge color...
            UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_CONFIRM DURATION=1
        {% elif step >= MAX_STEPS %}
            RESPOND TYPE=error MSG="[ERR] [Load Mode] T{TOOL}: Fed {(MAX_STEPS * FEED)|int}mm but sensor not reached. Check gear grip / filament path."
            SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET=0
            SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=active VALUE=False
            M117 Load failed
        {% else %}
            G91
            M83
            G1 E{FEED} F300
            G90
            M400
            SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE={step + 1}
            RESPOND MSG="  ... T{TOOL}: Loading... ({(step * FEED)|int}mm)"
            UPDATE_DELAYED_GCODE ID=_LOAD_MODE_FEED_STEP DURATION=0.2
        {% endif %}
    {% endif %}

[delayed_gcode _LOAD_MODE_WAIT_CONFIRM]
# Auto-confirm after 60s wait
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _LOAD_MODE_STATE"] %}
    {% if state.active and state.mode == "confirm" %}
        {% set step = state.step %}
        {% if step >= 60 %}
            # Timeout
            RESPOND MSG="⏰ Confirmation timed out. Auto-completing load mode."
            FILAMENT_LOAD_CONFIRM
        {% else %}
            SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE={step + 1}
            UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_CONFIRM DURATION=1
        {% endif %}
    {% endif %}

[gcode_macro FILAMENT_LOAD_PURGE_MORE]
description: Additional purge if colors are mixed during load mode
gcode:
    {% set state = printer["gcode_macro _LOAD_MODE_STATE"] %}
    {% if state.active and state.mode == "confirm" %}
        {% set TOOL = state.tool %}
        RESPOND MSG="🔄 [Load Mode] T{TOOL}: Additional purge of 30mm..."
        # Pause timer briefly
        UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_CONFIRM DURATION=0
        
        PURGE_NOZZLE AMOUNT=30
        
        # Restart timer
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=step VALUE=0
        RESPOND MSG="[?] Is the color clean now? (60s timeout)"
        RESPOND MSG="   -> Yes (complete): FILAMENT_LOAD_CONFIRM"
        RESPOND MSG="   -> No (purge more): FILAMENT_LOAD_PURGE_MORE"
        UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_CONFIRM DURATION=1
    {% else %}
        RESPOND TYPE=error MSG="[ERR] Not currently awaiting confirmation."
    {% endif %}

[gcode_macro FILAMENT_LOAD_CONFIRM]
description: Complete color confirmation in load mode
gcode:
    {% set state = printer["gcode_macro _LOAD_MODE_STATE"] %}
    {% if state.active and state.mode == "confirm" %}
        {% set TOOL = state.tool %}
        {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
        
        UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_CONFIRM DURATION=0
        SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET=0
        SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=active VALUE=False
        
        RESPOND MSG="🎉 [Load Mode] T{TOOL}: Load finished! Heater OFF"
        M117 T{TOOL} loaded!
    {% else %}
        RESPOND TYPE=error MSG="[ERR] Not currently awaiting confirmation."
    {% endif %}

[gcode_macro FILAMENT_UNLOAD_MODE]
description: Unload mode (pick up tool to shuttle -> cut with cutter or tip forming + retract)
# ★ Homes and QGLs, then mounts the tool to the shuttle (not docked unload).
#   Cuts via CUT_FILAMENT if cutter enabled (have_cutter:True), otherwise performs tip forming + retract.
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}
    {% set saved_mat = printer.save_variables.variables.get('tool' ~ TOOL ~ '_material', '')|string|upper %}
    {% set MATERIAL = params.MATERIAL|default(saved_mat)|string|upper %}
    # Unload temp from DB if material matched, otherwise TEMP parameter. min_extrude_temp(170) lower bound 175
    {% if MATERIAL in db %}
        {% set TEMP = [ db[MATERIAL].unload|float, 175 ]|max %}
    {% else %}
        {% set TEMP = [ params.TEMP|default(200)|float, 175 ]|max %}
    {% endif %}

    # --- Safety guards ---
    {% if printer.idle_timeout.state == "Printing" %}
        RESPOND TYPE=error MSG="[ERR] Cannot use unload mode during printing"
    {% elif TOOL < 0 or TOOL > 5 %}
        RESPOND TYPE=error MSG="[ERR] TOOL range error: 0~5"
    {% else %}
        {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
        {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}

        # ── Pre-pickup preparation: Homing + QGL (ensures accurate dock mounting) ──
        {% if "xyz" not in printer.toolhead.homed_axes %}
            RESPOND MSG="[Unload Mode] Running homing first..."
            G28
        {% endif %}
        {% if not printer.quad_gantry_level.applied %}
            RESPOND MSG="[Unload Mode] Running QGL (empty shuttle, IR probe gantry leveling)..."
            QUAD_GANTRY_LEVEL
            G28 Z
        {% endif %}

        # ── Pick up tool to shuttle ──
        RESPOND MSG="[Unload Mode] Mounting T{TOOL} to shuttle..."
        T{TOOL}
        ACTIVATE_EXTRUDER EXTRUDER={ext_name}

        # ── Move above purge bucket (catch oozing filament during unload) ──
        {% set vars = printer['gcode_macro _PURGE_BUCKET_VARS'] %}
        G90
        _SAFE_BUCKET_ENTRY TARGET=BUCKET
        M400

        # ── Heat hotend ──
        RESPOND MSG="🔥 [Unload Mode] T{TOOL}: Heating to {TEMP}°C..."
        M117 Heating T{TOOL}...
        SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET={TEMP}
        TEMPERATURE_WAIT SENSOR={ext_name} MINIMUM={TEMP - 5} TIMEOUT=600

        # ── Unload operation: Cutter cut if enabled, otherwise tip forming + retract ──
        {% if s.have_cutter %}
            RESPOND MSG="✂️ [Unload Mode] T{TOOL}: Filament cutting method..."
            M117 Cutting T{TOOL}...
            # Prime small amount right before cut (meltzone stabilization)
            G91
            M83
            G1 E{s.cut_prime} F120
            G90
            M400
            CUT_FILAMENT
            # Retract severed upper segment (★ while hot — satisfies min_extrude_temp)
            G91
            M83
            G1 E-{s.upper_retract} F1200
            G90
            M400
            SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET=0
            RESPOND MSG="🎉 [Unload Mode] T{TOOL}: Cut and retraction complete (Heater OFF). Remaining stub ({s.cut_to_nozzle}mm) will purge on next load."
            M117 Unloaded (cut) T{TOOL}
        {% else %}
            RESPOND MSG="📤 [Unload Mode] T{TOOL}: Starting tip forming..."
            M117 Unloading T{TOOL}...
            # Tip forming (3 cycles: push and pull)
            G91
            M83
            {% for i in range(3) %}
                G1 E3 F1800
                G1 E-3 F1800
            {% endfor %}
            # Final retract (70mm)
            G1 E-70 F600
            G90
            M400
            SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET=0
            RESPOND MSG="🎉 [Unload Mode] T{TOOL}: Unload complete (Heater OFF). Pull out filament from top manually."
            M117 Pull out filament T{TOOL}!
        {% endif %}
    {% endif %}

[gcode_macro FILAMENT_LOAD_CANCEL]
description: Cancel in-progress filament load/unload mode
gcode:
    {% set state = printer["gcode_macro _LOAD_MODE_STATE"] %}
    {% set TOOL = state.tool %}
    {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}

    SET_GCODE_VARIABLE MACRO=_LOAD_MODE_STATE VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_ENTRY DURATION=0
    UPDATE_DELAYED_GCODE ID=_LOAD_MODE_FEED_STEP DURATION=0
    UPDATE_DELAYED_GCODE ID=_LOAD_MODE_WAIT_CONFIRM DURATION=0
    {% if printer["filament_switch_sensor mdm_cal_T" ~ TOOL] is defined %}
        SET_FILAMENT_SENSOR SENSOR=mdm_cal_T{TOOL} ENABLE=0
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER={ext_name} TARGET=0

    RESPOND MSG="⚠️ [Load Mode] T{TOOL}: Cancelled. Heater OFF."
    M117 Load cancelled


# ══════════════════════════════════════════════════════════════════
#  Mainsail Macro Panel Button Set (2-Step Workflow)
# ══════════════════════════════════════════════════════════════════
#  Usage:
#    ① Press a material button (MAT_PLA / MAT_PETG / MAT_ABS / MAT_ASA / MAT_TPU / MAT_NYLON)
#       to select 'Material to load'   ← If not pressed, uses last selection (default PLA)
#    ② Press the corresponding tool button (LOAD_T0 ~ LOAD_T4) to auto-load with that material
#  Override: You can also specify material directly from the button like LOAD_T0 MATERIAL=ABS.
#  Mainsail tip: Top-right gear on macro panel → assign colors/groups for clean layout.
# ──────────────────────────────────────────────────────────────────

[gcode_macro _LOAD_UI]
description: (Internal) Load UI state — stores currently selected material. Do not execute directly.
variable_material: "PLA"
gcode:
    RESPOND MSG="Current selected material: {printer['gcode_macro _LOAD_UI'].material}"

[gcode_macro _SET_LOAD_MATERIAL]
description: (Internal) Set load material selection
gcode:
    {% set M = params.MATERIAL|default("PLA")|string|upper %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}
    {% if M in db %}
        SET_GCODE_VARIABLE MACRO=_LOAD_UI VARIABLE=material VALUE="'{M}'"
        RESPOND MSG="✅ Load material selected: {M} (load {db[M].load}°C) — Now press LOAD_T0~T4 button."
        M117 Material: {M}
    {% else %}
        RESPOND TYPE=error MSG="[ERR] Unsupported material: {M} (Supported: PLA/PETG/ABS/ASA/TPU/NYLON)"
    {% endif %}

# ── Step 1: Material Selection Buttons ──
[gcode_macro MAT_PLA]
description: Select material to load = PLA
gcode: _SET_LOAD_MATERIAL MATERIAL=PLA
[gcode_macro MAT_PETG]
description: Select material to load = PETG
gcode: _SET_LOAD_MATERIAL MATERIAL=PETG
[gcode_macro MAT_ABS]
description: Select material to load = ABS
gcode: _SET_LOAD_MATERIAL MATERIAL=ABS
[gcode_macro MAT_ASA]
description: Select material to load = ASA
gcode: _SET_LOAD_MATERIAL MATERIAL=ASA
[gcode_macro MAT_TPU]
description: Select material to load = TPU
gcode: _SET_LOAD_MATERIAL MATERIAL=TPU
[gcode_macro MAT_NYLON]
description: Select material to load = NYLON
gcode: _SET_LOAD_MATERIAL MATERIAL=NYLON

# ── Step 2: Per-tool load buttons (auto-uses selected material / override via MATERIAL=...) ──
[gcode_macro LOAD_T0]
description: Load T0 (selected material)
gcode: FILAMENT_LOAD_MODE TOOL=0 MATERIAL={params.MATERIAL|default(printer['gcode_macro _LOAD_UI'].material)}
[gcode_macro LOAD_T1]
description: Load T1 (selected material)
gcode: FILAMENT_LOAD_MODE TOOL=1 MATERIAL={params.MATERIAL|default(printer['gcode_macro _LOAD_UI'].material)}
[gcode_macro LOAD_T2]
description: Load T2 (selected material)
gcode: FILAMENT_LOAD_MODE TOOL=2 MATERIAL={params.MATERIAL|default(printer['gcode_macro _LOAD_UI'].material)}
[gcode_macro LOAD_T3]
description: Load T3 (selected material)
gcode: FILAMENT_LOAD_MODE TOOL=3 MATERIAL={params.MATERIAL|default(printer['gcode_macro _LOAD_UI'].material)}
[gcode_macro LOAD_T4]
description: Load T4 (selected material)
gcode: FILAMENT_LOAD_MODE TOOL=4 MATERIAL={params.MATERIAL|default(printer['gcode_macro _LOAD_UI'].material)}

# ── Unload buttons (auto-uses saved material temperature) ──
[gcode_macro UNLOAD_T0]
description: Unload T0
gcode: FILAMENT_UNLOAD_MODE TOOL=0 MATERIAL={params.MATERIAL|default("")}
[gcode_macro UNLOAD_T1]
description: Unload T1
gcode: FILAMENT_UNLOAD_MODE TOOL=1 MATERIAL={params.MATERIAL|default("")}
[gcode_macro UNLOAD_T2]
description: Unload T2
gcode: FILAMENT_UNLOAD_MODE TOOL=2 MATERIAL={params.MATERIAL|default("")}
[gcode_macro UNLOAD_T3]
description: Unload T3
gcode: FILAMENT_UNLOAD_MODE TOOL=3 MATERIAL={params.MATERIAL|default("")}
[gcode_macro UNLOAD_T4]
description: Unload T4
gcode: FILAMENT_UNLOAD_MODE TOOL=4 MATERIAL={params.MATERIAL|default("")}

# ==============================================================================

[gcode_macro _MDM_COUNTER]
variable_count: 0
gcode:

[gcode_macro _MDM_CHECK]
description: Increments counter on MDM sensor toggle (called by mdm_cal sensor runout/insert_gcode)
gcode:
    SET_GCODE_VARIABLE MACRO=_MDM_COUNTER VARIABLE=count VALUE={printer["gcode_macro _MDM_COUNTER"].count|int + 1}

[gcode_macro MDM_CALIBRATE_ESTEPS]
description: Fully automatic calibration of e-steps (Rotation Distance) using MDM encoder
# Usage example: MDM_CALIBRATE_ESTEPS TOOL=0 PULSE_LENGTH=1.724 TEMP=200 EXTRUDE=100
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% set PULSE_LENGTH = params.PULSE_LENGTH|default(0)|float %}
    # Cold extrusion error if below min_extrude_temp (170°C) -> raise to at least 175°C
    {% set TEMP = [ params.TEMP|default(200)|float, 175 ]|max %}
    {% set EXTRUDE = params.EXTRUDE|default(100)|float %}
    
    # ── Input Validation ──
    {% if PULSE_LENGTH <= 0 %}
        RESPOND TYPE=error MSG="[ERR] PULSE_LENGTH required! Usage: MDM_CALIBRATE_ESTEPS TOOL=0 PULSE_LENGTH=1.73 TEMP=200"
    {% elif TOOL < 0 or TOOL > 5 %}
        RESPOND TYPE=error MSG="[ERR] TOOL range error! Enter a value between 0 and 5. (Input: {TOOL})"
    {% elif printer.idle_timeout.state == "Printing" %}
        RESPOND TYPE=error MSG="[ERR] Cannot run calibration while printing! Retry after print completion."
    {% else %}
        # ── Tool Mount Check ──
        {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
        {% set motion_sensor = "T" ~ TOOL ~ "_runout_toolhead" %}
        {% set cal_sensor = "mdm_cal_T" ~ TOOL %}
        
        # ── Physical toolhead connection check (judged by board communication, not software selection) ──
        {% set ext_temp = printer[ext_name].temperature|default(-1) if printer[ext_name] is defined else -1 %}
        {% if ext_temp < 0 %}
            RESPOND TYPE=error MSG="[ERR] Cannot communicate with T{TOOL}({ext_name}) board! Check CAN connection."
        {% elif printer["filament_switch_sensor " ~ cal_sensor] is not defined %}
            RESPOND TYPE=error MSG="[ERR] Calibration sensor ({cal_sensor}) for T{TOOL} is not defined. Check config file."
        {% else %}
            RESPOND TYPE=command MSG="========== Starting MDM Auto Calibration (T{TOOL}) =========="
            RESPOND TYPE=command MSG="  Pulse length: {PULSE_LENGTH}mm / Extrusion amount: {EXTRUDE}mm / Temp: {TEMP}°C"
            
            # 1. Disable existing runout/clog sensors and enable calibration counter
            SET_FILAMENT_SENSOR SENSOR={motion_sensor} ENABLE=0
            SET_FILAMENT_SENSOR SENSOR=T{TOOL}_clog ENABLE=0   # Disable clog motion sensor as well (shares pulse pin)
            SET_GCODE_VARIABLE MACRO=_MDM_COUNTER VARIABLE=count VALUE=0
            SET_FILAMENT_SENSOR SENSOR={cal_sensor} ENABLE=1
            
            # 2. Heating and extrusion (very slow speed 1mm/s recommended)
            # ★ ACTIVATE_EXTRUDER first — M109 heats/waits on the 'currently active' extruder;
            #   activating the target tool first prevents heating the wrong heater and cold extrusion errors.
            ACTIVATE_EXTRUDER EXTRUDER={ext_name}
            M109 S{TEMP}
            G91
            G92 E0
            G1 E{EXTRUDE} F60
            G90
            
            # ★ Important: Wait until actual motor movement (extrusion) completes
            M400
            
            # 3. Restore sensors after extrusion completion (disable counter and enable clog sensor)
            SET_FILAMENT_SENSOR SENSOR={cal_sensor} ENABLE=0
            SET_FILAMENT_SENSOR SENSOR={motion_sensor} ENABLE=1
            
            # 4. Call sub-macro dedicated to result computation (prevents Jinja asynchronous evaluation errors)
            _MDM_CALIBRATE_FINISH TOOL={TOOL} PULSE_LENGTH={PULSE_LENGTH|round(4)} EXTRUDE={EXTRUDE|round(1)}
        {% endif %}
    {% endif %}

[gcode_macro _MDM_CALIBRATE_FINISH]
description: Internal macro dedicated to MDM calibration calculation
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set PULSE_LENGTH = params.PULSE_LENGTH|float %}
    {% set EXTRUDE = params.EXTRUDE|float %}
    
    {% set ext_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
    
    # Reading here correctly captures the final count accumulated up to extrusion (M400) completion.
    {% set toggles = printer["gcode_macro _MDM_COUNTER"].count|int %}
    {% set actual_extruded = (toggles / 2.0) * PULSE_LENGTH %}
    # ★ Live RD-based calculation: If LOAD_MDM_ROTATION_DISTANCE already overwrote RD with
    #   a saved value at boot, configfile values are stale; use the saved value as current if present.
    #   (Falls back to configfile on initial calibration when no saved value exists)
    {% set config_rd = printer.configfile.settings[ext_name].rotation_distance|float %}
    {% set saved_rd = printer.save_variables.variables.get(ext_name ~ '_rotation_distance', 0)|float %}
    {% set current_rd = saved_rd if saved_rd > 0 else config_rd %}
    
    {% if actual_extruded > 0 %}
        {% set new_rd = current_rd * (actual_extruded / EXTRUDE) %}
        
        RESPOND TYPE=command MSG="Toggle edge count: {toggles} (actual pulses: {toggles/2.0})"
        RESPOND TYPE=command MSG="Commanded extrusion: {EXTRUDE}mm / Measured actual: {actual_extruded|round(2)}mm"
        RESPOND TYPE=command MSG="Previous Rotation Distance: {current_rd}"
        RESPOND TYPE=command MSG="New Rotation Distance: {'%.4f'|format(new_rd)}"
        
        # Apply immediately and persist to save variables
        SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER={ext_name} DISTANCE={'%.4f'|format(new_rd)}
        SAVE_VARIABLE VARIABLE={ext_name}_rotation_distance VALUE={'%.4f'|format(new_rd)}
        
        RESPOND TYPE=command MSG="[OK] Success! New value applied and saved to bt_saved_state.cfg."
    {% else %}
        RESPOND TYPE=error MSG="[ERR] No sensor toggle detected. Check filament loading status."
    {% endif %}

# Macro to disable calibration sensors at boot by default (all tools)
[delayed_gcode DISABLE_MDM_CAL_SENSORS_AT_BOOT]
initial_duration: 2.0
gcode:
    {% for i in range(5) %}
        {% set cal_sensor = "mdm_cal_T" ~ i %}
        {% if printer["filament_switch_sensor " ~ cal_sensor] is defined %}
            SET_FILAMENT_SENSOR SENSOR={cal_sensor} ENABLE=0
        {% endif %}
        # Also disable clog sensor at boot (prevents false triggers during load/standby; enabled only in PRINT_START)
        {% set clog_sensor = "T" ~ i ~ "_clog" %}
        {% if printer["filament_motion_sensor " ~ clog_sensor] is defined %}
            SET_FILAMENT_SENSOR SENSOR={clog_sensor} ENABLE=0
        {% endif %}
    {% endfor %}
    RESPOND MSG="MDM Calibration & Clog Sensors disabled at boot."

# Output clog handler during printing
[gcode_macro _CLOG_HANDLER]
description: Clog motion sensor trigger handler — PAUSE if printing, ignore otherwise
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}
    {% if printer.idle_timeout.state == "Printing" %}
        RESPOND TYPE=error MSG="🛑 [Clog Detected] T{TOOL}: Extrusion commanded but filament not moving -> Pausing."
        M117 CLOG T{TOOL}!
        PAUSE
    {% else %}
        RESPOND MSG="[Clog Sensor] T{TOOL} no toggle detected (not printing) — ignoring."
    {% endif %}

# Macro to load auto-saved calibration values at boot
[delayed_gcode LOAD_MDM_ROTATION_DISTANCE]
initial_duration: 3.5  # Add margin to run after BoxTurtle restore (3s)
gcode:
    {% set saved = printer.save_variables.variables %}
    
    {% for i in range(5) %}
        {% set ext_name = "extruder" if i == 0 else "extruder" ~ i %}
        {% set var_name = ext_name ~ "_rotation_distance" %}
        
        {% if saved[var_name] is defined %}
            SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER={ext_name} DISTANCE={saved[var_name]}
            RESPOND TYPE=command MSG="[Loaded] T{i} Rotation Distance: {saved[var_name]}"
        {% endif %}
    {% endfor %}

[gcode_macro _FILAMENT_RUNOUT_HANDLER]
description: Filament runout dispatcher (delegates to BT handler if BoxTurtle is present, simple pause otherwise)
gcode:
    # If BoxTurtle (boxturtle.cfg) is included and _BT_VARS exists, delegate to state machine handler.
    # If not installed, handle via simple fallback below (PAUSE if printing).
    {% if printer["gcode_macro _BT_VARS"] is defined %}
        _BT_FILAMENT_RUNOUT_HANDLER {rawparams}
    {% else %}
        {% set TOOL = params.TOOL|default(0)|int %}
        {% set SENSOR = params.SENSOR|default("")|string %}
        RESPOND MSG="Filament runout detected (fallback): T{TOOL} (sensor: {SENSOR})"
        {% if printer.idle_timeout.state == "Printing" %}
            RESPOND MSG="Printing in progress - pausing print."
            PAUSE
        {% else %}
            RESPOND MSG="Not printing - warning only"
        {% endif %}
    {% endif %}

[gcode_macro DISABLE_FILAMENT_SENSORS]
description: Batch disable filament runout sensors for all tools (T0~T4)
gcode:
    {% for i in range(5) %}
        SET_FILAMENT_SENSOR SENSOR=T{i}_runout_entry ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=T{i}_runout_toolhead ENABLE=0
    {% endfor %}
    RESPOND MSG="All tool (T0~T4) filament runout sensors (10 total) batch disabled."

[gcode_macro ENABLE_FILAMENT_SENSORS]
description: Batch enable filament runout sensors for all tools (T0~T4)
gcode:
    {% for i in range(5) %}
        SET_FILAMENT_SENSOR SENSOR=T{i}_runout_entry ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=T{i}_runout_toolhead ENABLE=1
    {% endfor %}
    RESPOND MSG="All tool (T0~T4) filament runout sensors (10 total) batch enabled."

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: QUAD_GANTRY_LEVEL_BASE
variable_start_time: 0
description: Automatically disables all filament sensors during QGL leveling and restores them afterwards (2-stage smart QGL)
gcode:
    # ★ QGL/mesh is always measured with the 'probe' object (= smart_effector, shuttle IR probe).
    #   The probe is fixed to the IR probe regardless of whether a tool is docked (does not switch to Voron Tap),
    #   so the height is unified to the IR safe height (Z=5) instead of branching by active_tool_number.
    #   (If branched, leaving a tool on the shuttle could cause the IR probe to fail at Tap height Z=3
    #    with 'Probe triggered prior to movement'.)
    # Stage 1 uses higher Z (coarse leveling, safe for large tilt), Stage 2 uses lower Z (precision).
    # ★ Stage 2 Z(5) must be higher than the IR trigger height. Before lowering (e.g., to 3),
    #   check trigger height with QUERY_PROBE — if lower than trigger height, 'Probe triggered prior to movement' fails.
    {% set qgl_z_1 = 10 %}   # Coarse leveling (high safe height)
    {% set qgl_z_2 = 4 %}    # Fine leveling (lowered from 5 to 4mm; check trigger height via QUERY_PROBE before lowering to <=3mm)

    SET_GCODE_VARIABLE MACRO=QUAD_GANTRY_LEVEL VARIABLE=start_time VALUE={printer.toolhead.estimated_print_time}
    DISABLE_FILAMENT_SENSORS
    # Stage 1: Coarse leveling at high Z
    RESPOND MSG="QGL Stage 1: Coarse alignment (Z={qgl_z_1}mm, Tolerance=1.0mm)..."
    QUAD_GANTRY_LEVEL_BASE HORIZONTAL_MOVE_Z={qgl_z_1} RETRY_TOLERANCE=1.0 RETRIES=3
    # Stage 2: Precision leveling at low Z. Retains tolerance 0.04 + samples=5 reduces noise (reduces 4-point range) -> converges.
    RESPOND MSG="QGL Stage 2: Precision alignment (Z={qgl_z_2}mm, Tolerance=0.04mm)..."
    QUAD_GANTRY_LEVEL_BASE HORIZONTAL_MOVE_Z={qgl_z_2} RETRY_TOLERANCE=0.04 {rawparams}
    ENABLE_FILAMENT_SENSORS
    RESPOND MSG="QGL complete! Performing Z-axis re-homing (G28 Z) for accurate zero point."
    G28 Z
    _QGL_PRINT_TIME

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: Automatically disables all filament sensors during bed mesh scan and restores them afterwards
gcode:
    DISABLE_FILAMENT_SENSORS
    BED_MESH_CALIBRATE_BASE {rawparams}
    ENABLE_FILAMENT_SENSORS

[gcode_macro CALIBRATE_BED_MESHES]
description: Sequential full scan across multiple bed temperatures -> batch saves with SAVE_CONFIG at the end (low to high temp)
# Usage examples:
#   CALIBRATE_BED_MESHES                       (default 50,60,80,90 = TPU/PLA/PETG/ABS / soak 5 min)
#   CALIBRATE_BED_MESHES TEMPS="60,80,90"      (specify temperature list manually)
#   CALIBRATE_BED_MESHES SOAK=8                (heat soak stabilization minutes per temperature)
# ★ Recommended to run with empty shuttle (IR probe). Firmware restarts via SAVE_CONFIG upon completion.
# ★ Created profiles: bed_50, bed_60, bed_80, bed_90 (approximate match LOAD by BED temp in PRINT_START)
gcode:
    {% set temps = params.TEMPS|default("50,60,80,90")|string %}
    {% set soak  = params.SOAK|default(5)|int %}

    RESPOND MSG="========= Batch bed mesh calibration: {temps} (soak {soak} min) ========="
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    {% for t in temps.split(",") %}
        {% set temp = t|trim|int %}
        RESPOND MSG="[{temp}°C] Heating + waiting {soak} min for thermal stabilization..."
        M117 Mesh {temp}C heat soak...
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={temp}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={temp - 1} MAXIMUM={temp + 3}
        G4 P{soak * 60000}                      # Wait for bed thermal expansion stabilization
        RESPOND MSG="[{temp}°C] QGL + full bed mesh scan -> profile bed_{temp}..."
        M117 Mesh {temp}C scan...
        QUAD_GANTRY_LEVEL
        G28 Z
        BED_MESH_CALIBRATE PROFILE=bed_{temp}   # ADAPTIVE not used = full bed scan
    {% endfor %}

    TURN_OFF_HEATERS
    RESPOND MSG="========= All temperature scans complete -> batch saving via SAVE_CONFIG (restarts) ========="
    M117 Saving all meshes...
    SAVE_CONFIG

[gcode_macro GOTO_SEXBOLT]
description: Move nozzle to SexBolt calibration switch position (KlipperScreen compatible)
gcode:
    {% set switch = printer['gcode_macro _CALIBRATION_SWITCH'] %}
    G90
    G1 Z{switch.z} F3000
    G1 X{switch.x} Y{switch.y} F6000
    RESPOND MSG="Arrived at SexBolt position (X{switch.x} Y{switch.y})"

[gcode_macro GOTO_LEAFCUTTER]
description: Move nozzle to LeafCutter filament cutter position (KlipperScreen compatible)
gcode:
    {% set cutter = printer['gcode_macro CUT_FILAMENT'] %}
    G90
    G1 Z10 F3000
    G1 X{cutter.cut_x} Y{cutter.cut_y} F6000
    RESPOND MSG="Arrived at LeafCutter position (X{cutter.cut_x} Y{cutter.cut_y})"


[gcode_macro _QGL_PRINT_TIME]
gcode:
    {% set start_time = printer["gcode_macro QUAD_GANTRY_LEVEL"].start_time %}
    {% set end_time = printer.toolhead.estimated_print_time %}
    {% set elapsed = end_time - start_time %}
    {% set minutes = (elapsed / 60) | int %}
    {% set seconds = (elapsed % 60) | int %}
    RESPOND MSG="QGL elapsed time: {minutes}m {seconds}s"

#####################################################################
#  Smart Filament Auto Loading Macro (sensor-based 1-min in-place loading) - GEMINI FIX applied
#####################################################################
[gcode_macro _AUTO_LOAD_VARS]
variable_t0_state: "IDLE"
variable_t0_ticks: 0
variable_t1_state: "IDLE"
variable_t1_ticks: 0
variable_t2_state: "IDLE"
variable_t2_ticks: 0
variable_t3_state: "IDLE"
variable_t3_ticks: 0
variable_t4_state: "IDLE"
variable_t4_ticks: 0
variable_target_temp: 200
gcode:

[gcode_macro _PREPARE_AUTO_LOAD]
gcode:
    {% set TOOL = params.TOOL|int %}
    SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"HOME_REQ"'
    RESPOND MSG="[T{TOOL} Auto Load] Filament detected (Entry)! Preparing loading..."
    UPDATE_DELAYED_GCODE ID=AUTO_LOAD_PICKUP_T{TOOL} DURATION=0.1

[delayed_gcode AUTO_LOAD_PICKUP_T0]
gcode: _EXECUTE_PICKUP_AND_LOAD TOOL=0

[delayed_gcode AUTO_LOAD_PICKUP_T1]
gcode: _EXECUTE_PICKUP_AND_LOAD TOOL=1

[delayed_gcode AUTO_LOAD_PICKUP_T2]
gcode: _EXECUTE_PICKUP_AND_LOAD TOOL=2

[delayed_gcode AUTO_LOAD_PICKUP_T3]
gcode: _EXECUTE_PICKUP_AND_LOAD TOOL=3

[delayed_gcode AUTO_LOAD_PICKUP_T4]
gcode: _EXECUTE_PICKUP_AND_LOAD TOOL=4

[gcode_macro _EXECUTE_PICKUP_AND_LOAD]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set sensor_name = "filament_switch_sensor T" ~ TOOL ~ "_runout_entry" %}
    {% set has_filament = printer[sensor_name].filament_detected %}
    {% set state = printer["gcode_macro _AUTO_LOAD_VARS"]["t" ~ TOOL ~ "_state"] %}
    {% set blocked = false %}

    {% if not has_filament %}
        RESPOND MSG="[T{TOOL} Auto Load] Filament removed! Cancelling operation."
        _CANCEL_AUTO_LOAD TOOL={TOOL}
        {% set state = "CANCELLED" %}
    {% endif %}

    {% if state == "HOME_REQ" and not blocked %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            RESPOND MSG="[T{TOOL} Auto Load] Requesting homing (G28)..."
            G28
            {% set blocked = true %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"QGL_REQ"'
        {% set state = "QGL_REQ" %}
    {% endif %}

    {% if state == "QGL_REQ" and not blocked %}
        {% if not printer.quad_gantry_level.applied %}
            RESPOND MSG="[T{TOOL} Auto Load] Requesting QGL..."
            QUAD_GANTRY_LEVEL
            G28 Z
            {% set blocked = true %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"PICKUP_REQ"'
        {% set state = "PICKUP_REQ" %}
    {% endif %}

    {% if state == "PICKUP_REQ" and not blocked %}
        {% if printer.toolchanger.tool_number|default(-1)|int != TOOL %}
            RESPOND MSG="[T{TOOL} Auto Load] Picking up T{TOOL}..."
            SELECT_TOOL T={TOOL}
            {% set blocked = true %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"MOVE_REQ"'
        {% set state = "MOVE_REQ" %}
    {% endif %}

    {% if state == "MOVE_REQ" and not blocked %}
        {% if printer.toolchanger.tool_number|default(-1)|int != TOOL %}
            RESPOND MSG="[T{TOOL} Auto Load] Pickup failed! Cancelling loading."
            _CANCEL_AUTO_LOAD TOOL={TOOL}
            {% set state = "CANCELLED" %}
        {% else %}
            RESPOND MSG="[T{TOOL} Auto Load] Pickup complete. Moving to bucket..."
            {% set vars = printer['gcode_macro _PURGE_BUCKET_VARS'] %}
            G90
            _SAFE_BUCKET_ENTRY TARGET=BUCKET
            
            _START_AUTO_LOAD_HEATING TOOL={TOOL}
            {% set state = "HEATING" %}
        {% endif %}
    {% endif %}

    {% if state not in ["CANCELLED", "HEATING"] %}
        UPDATE_DELAYED_GCODE ID=AUTO_LOAD_PICKUP_T{TOOL} DURATION=1.0
    {% endif %}

[gcode_macro _START_AUTO_LOAD_HEATING]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set saved_mat = printer.save_variables.variables.get("tool" ~ TOOL ~ "_material", "") | replace("'", "") %}
    {% set db = printer["gcode_macro _MATERIAL_DB"].db %}
    
    {% if saved_mat in db %}
        {% set TEMP = [ db[saved_mat].load|float, 175 ]|max %}
    {% else %}
        {% set TEMP = 200 %}
    {% endif %}
    
    {% set extruder_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
    
    SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"HEATING"'
    SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_ticks VALUE=0
    SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=target_temp VALUE={TEMP}
    
    RESPOND MSG="[T{TOOL} Auto Load] Ready! Push filament into extruder gears! (Heating to {TEMP}°C)"
    M117 Push filament in!
    SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET={TEMP}
    
    UPDATE_DELAYED_GCODE ID=AUTO_LOAD_TICK_T{TOOL} DURATION=1.0

[gcode_macro _CANCEL_AUTO_LOAD]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set vars = printer["gcode_macro _AUTO_LOAD_VARS"] %}
    {% set state = vars["t" ~ TOOL ~ "_state"] %}
    
    {% if state != "IDLE" %}
        {% set extruder_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
        SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"IDLE"'
        SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_ticks VALUE=0
        
        RESPOND MSG="[T{TOOL} Auto Load] Cancelled! Stopping process."
        M117 Load Cancelled
        SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET=0
        UPDATE_DELAYED_GCODE ID=AUTO_LOAD_TICK_T{TOOL} DURATION=0
        UPDATE_DELAYED_GCODE ID=AUTO_LOAD_PICKUP_T{TOOL} DURATION=0
    {% endif %}

[gcode_macro _PROCESS_AUTO_LOAD]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set vars = printer["gcode_macro _AUTO_LOAD_VARS"] %}
    {% set state = vars["t" ~ TOOL ~ "_state"] %}
    {% set ticks = vars["t" ~ TOOL ~ "_ticks"] %}
    
    {% set extruder_name = "extruder" if TOOL == 0 else "extruder" ~ TOOL %}
    {% set current_temp = printer[extruder_name].temperature %}
    {% set target_temp = printer[extruder_name].target %}
    
    {% set sensor_name = "filament_switch_sensor T" ~ TOOL ~ "_runout_entry" %}
    {% set has_filament = printer[sensor_name].filament_detected %}
    
    {% if not has_filament %}
        _CANCEL_AUTO_LOAD TOOL={TOOL}
    {% elif state == "HEATING" %}
        {% if current_temp >= target_temp - 2 %}
            SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"EXTRUDING"'
            RESPOND MSG="[T{TOOL} Auto Load] Heating complete. Extruding for 1 minute..."
        {% endif %}
        UPDATE_DELAYED_GCODE ID=AUTO_LOAD_TICK_T{TOOL} DURATION=1.0
    {% elif state == "EXTRUDING" %}
        {% if ticks < 60 %}
            # P1 Fix: Fast extrusion speed (F300) ensures 1-second tick interval is not overrun
            ACTIVATE_EXTRUDER EXTRUDER={extruder_name}
            M83
            G1 E2.5 F300
            SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_ticks VALUE={ticks + 1}
            UPDATE_DELAYED_GCODE ID=AUTO_LOAD_TICK_T{TOOL} DURATION=1.0
        {% else %}
            SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_state VALUE='"IDLE"'
            SET_GCODE_VARIABLE MACRO=_AUTO_LOAD_VARS VARIABLE=t{TOOL}_ticks VALUE=0
            
            RESPOND MSG="[T{TOOL} Auto Load] 1-min loading (150mm) complete! Brushing/purging nozzle..."
            CLEAN_NOZZLE
            
            # P3 Fix: Turn off heater after completion
            SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET=0
            RESPOND MSG="[T{TOOL} Auto Load] Brushing complete. Turning off heater."
            M117 Load Complete
        {% endif %}
    {% endif %}

[delayed_gcode AUTO_LOAD_TICK_T0]
gcode: _PROCESS_AUTO_LOAD TOOL=0

[delayed_gcode AUTO_LOAD_TICK_T1]
gcode: _PROCESS_AUTO_LOAD TOOL=1

[delayed_gcode AUTO_LOAD_TICK_T2]
gcode: _PROCESS_AUTO_LOAD TOOL=2

[delayed_gcode AUTO_LOAD_TICK_T3]
gcode: _PROCESS_AUTO_LOAD TOOL=3

[delayed_gcode AUTO_LOAD_TICK_T4]
gcode: _PROCESS_AUTO_LOAD TOOL=4

[gcode_macro CALIBRATE_BASE_OFFSET]
description: T0 nozzle to IR trigger distance (BASE_OFFSET) guide. Datum and dock invariant.
gcode:
    RESPOND MSG="╔══════════════════════════════════════════════════════╗"
    RESPOND MSG="║  BASE_OFFSET Manual Calibration Guide                ║"
    RESPOND MSG="╠══════════════════════════════════════════════════════╣"
    RESPOND MSG="║  The system currently defaults to the IR sensor for  ║"
    RESPOND MSG="║  PROBE commands, preventing automated measurement.   ║"
    RESPOND MSG="║                                                      ║"
    RESPOND MSG="║  Manual save procedure:                              ║"
    RESPOND MSG="║  Copy and run the following command in the console:  ║"
    RESPOND MSG="║  ─────────────────────────────────                   ║"
    RESPOND MSG="║  SAVE_VARIABLE VARIABLE=base_offset VALUE=2.55       ║"
    RESPOND MSG="║  ─────────────────────────────────                   ║"
    RESPOND MSG="║  Changes take effect on subsequent tool pickups.     ║"
    RESPOND MSG="║  Verify first layer height with a paper test, and    ║"
    RESPOND MSG="║  fine-tune by adjusting 2.55 with SAVE_VARIABLE.     ║"
    RESPOND MSG="╚══════════════════════════════════════════════════════╝"

#####################################################################
#  BASE_OFFSET Bypass Macro (overcomes RESTORE_GCODE_STATE reset)
#####################################################################
[gcode_macro SELECT_TOOL]
rename_existing: _BASE_SELECT_TOOL
gcode:
    _BASE_SELECT_TOOL {rawparams}
    _SYNC_BASE_OFFSET

[gcode_macro UNSELECT_TOOL]
rename_existing: _BASE_UNSELECT_TOOL
gcode:
    _BASE_UNSELECT_TOOL {rawparams}
    _SYNC_BASE_OFFSET

[gcode_macro _SYNC_BASE_OFFSET]
gcode:
    {% set tool_num = printer.toolchanger.tool_number|default(-1)|int %}
    {% set base = printer.save_variables.variables.get('base_offset', 2.55)|float %}
    
    {% if tool_num >= 0 %}
        {% set tool_off = printer[printer.toolchanger.tool].gcode_z_offset|float %}
        SET_GCODE_OFFSET Z={tool_off - base} MOVE=1 MOVE_SPEED=15
        RESPOND MSG="[BASE_OFFSET] Z={tool_off - base} set (T{tool_num} offset applied)"
    {% else %}
        SET_GCODE_OFFSET Z=0 MOVE=1 MOVE_SPEED=15
        RESPOND MSG="[BASE_OFFSET] Z=0 restored (docking/homing height established)"
    {% endif %}
