# =====================================================================
#  [Custom] toolchanger-include.cfg
#  To prevent duplicate [homing_override] boot errors, this file excludes
#  readonly-configs/homing.cfg and loads individual modules directly.
#
#  Location: ~/printer_data/config/toolchanger-include.cfg
#  Included from printer.cfg via:
#  [include toolchanger-include.cfg]
# =====================================================================

# 1. Load toolchanger core and macros (excluding homing.cfg)
[include toolchanger/readonly-configs/toolchanger.cfg]
[include toolchanger/readonly-configs/toolchanger-macros.cfg]
[include toolchanger/readonly-configs/calibrate-offsets.cfg]

# 2. Load per-toolhead configurations
[include toolchanger/tools/T0.cfg]
[include toolchanger/tools/T1.cfg]
[include toolchanger/tools/T2.cfg]
[include toolchanger/tools/T3.cfg]
[include toolchanger/tools/T4.cfg]

# 3. Load user overrides and custom AWD homing override
[include toolchanger-config.cfg]
