#####################################################################
#  crowsnest.conf - Webcam Streaming Configuration
#####################################################################
#  Voron 2.4 350mm AWD + 5-Tool StealthChanger
#  Location: ~/printer_data/config/crowsnest.conf
#
#  2 Cameras:
#  1. Logitech C920E (USB 3.0) - Full print monitoring
#  2. Nozzle micro camera (USB, shuttle mounted) - Nozzle / first layer inspection
#
#  Installation:
#    cd ~ && git clone https://github.com/mainsail-crew/crowsnest.git
#    cd crowsnest && sudo make install
#
#  ★ /dev/video* numbers may vary by device.
#    Check and adjust with ls /dev/video* or v4l2-ctl --list-devices.
#####################################################################

[crowsnest]
log_path: /home/esahn/printer_data/logs/crowsnest.log
log_level: verbose                  # quiet / verbose / debug
delete_log: true                    # Delete previous log on startup
no_resolve: false

#####################################################################
#  Camera 1: Logitech C920E (Full chamber view)
#####################################################################
#  Connected to USB 3.0 port, supports 1080p
#  Captures full print progress from outside or top of chamber

#[cam chamber]
#mode: ustreamer                     # ustreamer / camera-streamer
#enable_rtsp: false
#port: 8080                          # Port to access from Mainsail
#device: /dev/v4l/by-id/usb-046d_Logitech_Webcam_C920e-video-index0
## ★ If above path does not match, use /dev/video0
## device: /dev/video0
#resolution: 1280x720                # 1080p supported, using 720p for bandwidth saving
#max_fps: 15                         # 15 fps is sufficient for 3D printer monitoring
#custom_flags:
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=30
## ★ Manual focus recommended (autofocus frequently attempts to refocus during printing, causing instability)

#####################################################################
#  Camera 2: Nozzle micro camera (shuttle mounted)
#####################################################################
#  Small USB camera mounted on the shuttle
#  Check nozzle condition, first layer adhesion, filament flow

[cam nozzle]
mode: ustreamer
enable_rtsp: false
port: 8081                          # Different port from chamber camera
device: /dev/v4l/by-id/usb-Generic_HD_camera_20201212000000-video-index0
# ★ If above path does not match, use /dev/video2 (video0 is C920E)
# device: /dev/video2
resolution: 640x480                 # Micro camera resolution
max_fps: 15                         # Throttled to 15 FPS to avoid Tailscale (external VPN) bandwidth bottleneck
# custom_flags: --format=mjpeg        # Commented out: camera does not support MJPEG (YUYV only)
